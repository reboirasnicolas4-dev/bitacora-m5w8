<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16120e">
<meta name="robots" content="noindex">
<title>Bitácora · Alas de Libertad</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="bloqueo.js?v=2"></script>
<link rel="icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>/* Mismo estilo que Médicos y Despensa: fondo oscuro, tarjetas marrones, acento naranja */
:root{--bg:#16120e;--card:#211b15;--card2:#2b241d;--line:#3a3027;--ink:#f0e8da;--mut:#b3a99b;--acc:#f7a823;--accx:#281a08;--soft:#3a2a12;--ok:#8fd19e;--blue:#8db4ff;--red:#ff8f7a}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Hanken Grotesk",system-ui,-apple-system,Segoe UI,sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:30;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
.top img{width:38px;height:38px;object-fit:contain}
.top .t{flex:1;font:700 26px Fraunces,serif;line-height:1}
.top .t small{display:block;font:400 12.5px "Hanken Grotesk",sans-serif;color:var(--mut);margin-top:3px}
.me{border:0;background:none;padding:0}
.av{width:40px;height:40px;border-radius:50%;background:var(--card2);border:1px solid var(--line);color:var(--acc);display:grid;place-items:center;font-weight:700;font-size:15px}
.estado{max-width:560px;margin:0 auto 6px;background:var(--soft);border:1px solid var(--acc);border-radius:12px;color:var(--ink);font-size:14.5px;padding:10px 14px;text-align:center}
.estado.err{border-color:var(--red);color:var(--red);background:#2a1512}
main{padding:6px 14px 16px}
h1{font:700 24px/1.2 Fraunces,serif;margin:6px 2px 14px}
h2{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin:24px 2px 8px}
h2.rojo{color:var(--red)}
h3{font-size:15px;margin:0 0 8px;color:var(--mut)}
.nota{color:var(--mut);font-size:14.5px;margin:0 2px 14px}
.vacio{border:1px dashed var(--line);border-radius:14px;padding:16px;text-align:center;color:var(--mut);font-size:15px}
.buscar{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;margin-bottom:12px;color:var(--ink);outline:none}
.nombres{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nb{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 12px;min-height:64px;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:3px;color:var(--ink)}
.nb b{font-size:16.5px;line-height:1.2}
.nb small.med{color:var(--blue);font-size:12.5px;font-weight:600}
.nb:active{background:var(--soft);border-color:var(--acc)}
.nb.gen{grid-column:1/-1;background:var(--acc);border-color:var(--acc);color:var(--accx)}
.nb.gen small{color:#5a3a0c;font-size:13.5px}
.punto{position:absolute;top:10px;right:10px;width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px #2a1512}
.it{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px;color:var(--ink)}
.it.urg{border-color:var(--acc);background:linear-gradient(90deg,#2e2214,var(--card) 60%)}
.it.sys{border-style:dashed;background:transparent}
.it-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.it-top b{font-size:16px}
.cuando{margin-left:auto;color:var(--mut);font-size:13px;white-space:nowrap}
.it p{margin:6px 0 4px;font-size:15.5px;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.it small{color:var(--mut);font-size:12.5px}
.tag{display:inline-block;background:var(--acc);color:var(--accx);font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px}
.tag.gris{background:var(--card2);color:var(--mut);border:1px solid var(--line);font-weight:600}
.fila{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:8px;color:var(--ink)}
.fila b{flex:1;font-size:16px}
.fila span{color:var(--mut);font-size:13.5px}
.fila i{font-style:normal;color:var(--mut);font-size:22px;line-height:1}
.volver{border:0;background:none;color:var(--acc);font-weight:700;font-size:16px;padding:4px 0;margin-bottom:6px}
.btn{border:1px solid var(--line);background:var(--card2);border-radius:14px;padding:13px 16px;font-weight:600;font-size:15.5px;text-align:center;text-decoration:none;color:var(--ink);display:inline-block}
.btn.full{width:100%;display:block}
.btn.grande{padding:16px;font-size:17px;font-weight:700}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--accx);font-weight:700}
.btn.wa{background:#1f6b3d;border-color:#2f8a52;color:#fff}
.btn.rojo{background:#3a1a14;border-color:#6a2c20;color:var(--red)}
.btn.rojo-t{color:var(--red)}
.btn.suave{background:transparent;color:var(--mut)}
.btn:disabled{opacity:.6}
.link{display:block;color:var(--acc);font-size:14.5px;font-weight:600;text-decoration:none;margin:-2px 2px 4px;text-align:right}
.semana{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:12px}
.semana>div{flex:1;text-align:center}
.semana b{display:block;font:700 17px Fraunces,serif}
.semana small{color:var(--ok);font-weight:700;font-size:12.5px}
.semana button{width:44px;height:44px;border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:12px;font-size:20px}
.semana button:disabled{opacity:.3}
.bloque{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px;margin-bottom:8px}
.bloque>b{display:block;font-size:16px;margin:2px 0 4px}
.ln{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:8px 0;font-size:15px;white-space:pre-line;color:var(--ink)}
.bloque>.ln:first-child,.bloque>b+.ln{border-top:0}
.ln span{display:block;color:var(--mut);font-size:13px}
.ln b+span{margin-top:1px}
.pd{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.pd:last-of-type{border-bottom:0}
.pd input{width:24px;height:24px;flex:none;accent-color:var(--acc);margin:0}
.pd.hecho span{text-decoration:line-through;color:var(--mut)}
.nuevo{display:flex;gap:8px;margin-top:10px}
.nuevo input{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;color:var(--ink);outline:none}
.nav{position:fixed;left:0;right:0;bottom:0;background:#120f0c;border-top:1px solid var(--line);display:flex;justify-content:center;padding:7px 6px calc(10px + env(safe-area-inset-bottom));z-index:35}
.nav button{position:relative;flex:1;max-width:140px;background:none;border:0;color:var(--mut);font:600 12px "Hanken Grotesk",sans-serif;text-align:center}
.nav button span.ic{display:block;font-size:20px;line-height:30px;width:54px;margin:0 auto 2px;border-radius:99px}
.nav button.on{color:var(--ink)}
.nav button.on span.ic{background:#3a2c18}
.badge{position:absolute;top:-2px;left:calc(50% + 12px);background:var(--red);color:#1b0d09;font-size:11px;font-weight:700;border-radius:999px;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center}
.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:#000b}
.sheet{position:relative;background:var(--card);width:100%;max-width:560px;max-height:94vh;border-radius:22px 22px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sh-h{display:flex;align-items:center;gap:10px;padding:18px 16px 10px}
.sh-h h2{flex:1;margin:0;color:var(--ink);font:700 22px Fraunces,serif;text-transform:none;letter-spacing:0}
.x{border:1px solid var(--line);background:var(--card2);color:var(--mut);width:40px;height:40px;border-radius:12px;font-size:16px}
.sh-b{padding:6px 16px 16px;overflow-y:auto;flex:1}
.sh-foot{display:flex;gap:8px;padding:10px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sh-foot .btn.primary{flex:1}
textarea{width:100%;min-height:170px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:13px;font-size:17px;color:var(--ink);resize:vertical;outline:none}
textarea:focus,.buscar:focus,.nuevo input:focus,.inp:focus{border-color:var(--acc)}
.urgbox{display:flex;gap:12px;align-items:flex-start;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:13px;margin-top:10px}
.urgbox input{width:26px;height:26px;flex:none;accent-color:var(--acc);margin:0}
.urgbox b{display:block;color:var(--acc)}
.urgbox small{display:block;color:var(--mut);font-size:13.5px;margin-top:2px}
.urgbox:has(input:checked){border-color:var(--acc);background:var(--soft)}
.texto{white-space:pre-line;font-size:17px;line-height:1.5;background:var(--card2);border-radius:14px;padding:14px;margin-top:10px}
.meta{color:var(--mut);font-size:14px}
.err{color:var(--red);font-weight:600;font-size:14.5px;margin:10px 2px 0;display:none}
.confirmar{background:#2a1512;border:1px solid #6a2c20;border-radius:12px;padding:12px;margin-top:12px}
.confirmar div{display:flex;gap:8px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#f0e8da;color:#1b140d;padding:11px 18px;border-radius:12px;font-weight:600;font-size:15px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
/* ingreso */
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center}
.sp-in{display:flex;flex-direction:column;align-items:center;gap:6px}
.sp-in b{font:700 20px Fraunces,serif}
.sp-in small{color:var(--mut)}
.sp-in img{width:80px;height:80px;object-fit:contain}
#login{min-height:100vh;display:grid;place-items:center;padding:20px 18px}
.lg-box{width:100%;max-width:380px}
.lg-brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;margin-bottom:6px}
.lg-brand img{width:64px;height:64px;object-fit:contain}
.lg-brand small{color:var(--mut);font-size:14px}
.lg-brand h1{margin:0;font:700 30px Fraunces,serif}
#ltxt{text-align:center}
.lg-form{display:grid;gap:12px}
.lg-form label{display:grid;gap:5px;font-size:13px;color:var(--mut)}
.inp{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;color:var(--ink);outline:none;color-scheme:dark}
.lg-rec{display:flex!important;align-items:center;gap:10px;font-size:14px!important}
.lg-rec input{width:20px;height:20px;accent-color:var(--acc)}
.muted{color:var(--mut)}.soft{color:var(--mut)}
/* resumen de lo importante (inicio) */
.resumen{background:var(--card);border:1px solid var(--acc);border-radius:18px;padding:12px 12px 6px;margin:4px 0 6px}
.rs-t{font:700 20px Fraunces,serif;margin:2px 4px 8px;display:flex;align-items:baseline;gap:8px}
.rs-t small{font:600 13px "Hanken Grotesk",sans-serif;color:var(--mut)}
.rs{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:6px;color:var(--ink);text-decoration:none;font:inherit}
.rs i{font-style:normal;font-size:20px;line-height:1.2;flex:none;width:24px;text-align:center}
.rs span{font-size:13.5px;color:var(--mut);line-height:1.35}
.rs b{display:block;font-size:15.5px;color:var(--ink);margin-bottom:1px}
.rs.rojo{border-color:#6a4a16;background:linear-gradient(90deg,#2e2214,var(--card2) 70%)}
.rs.rojo b{color:var(--acc)}
.rs.azul b{color:var(--blue)}
</style>
</head>
<body>
<div id="splash" role="status" aria-live="polite"><div class="sp-in"><img src="logo.png" alt=""><b>Alas de Libertad</b><small>Cargando la bitácora…</small></div></div>

<!-- Ingreso (mismo usuario y contraseña que la app de Internos) -->
<section id="login" hidden>
  <div class="lg-box">
    <div class="lg-brand"><img src="logo.png" alt="Logo de Alas de Libertad"><div><small>Alas de Libertad</small><h1>Bitácora</h1></div></div>
    <p id="ltxt" class="muted">Ingresá con el mismo correo y contraseña de la app de Internos.</p>
    <form id="lf" class="lg-form">
      <label>Correo electrónico<input id="em" type="email" required autocomplete="username" placeholder="nombre@correo.com" class="inp"></label>
      <label id="pwrow">Contraseña<input id="pw" type="password" autocomplete="current-password" class="inp"></label>
      <div id="setup" hidden class="lg-form">
        <label id="coderow" hidden>Código de 6 números que te pasaron<input id="ncode" class="inp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 números"></label>
        <label>Elegí tu contraseña (mínimo 6 caracteres)<input id="np1" class="inp" type="password" autocomplete="new-password"></label>
        <label>Repetila<input id="np2" class="inp" type="password" autocomplete="new-password"></label>
      </div>
      <label class="lg-rec"><input id="rec" type="checkbox"> Recordarme en este dispositivo (30 días)</label>
      <div class="err" id="lmsg" role="alert" style="display:block"></div>
      <button class="btn primary" id="lbtn" type="submit" style="padding:15px">Ingresar</button>
      <small class="soft" style="text-align:center">¿Te olvidaste la contraseña? Pedile un código nuevo a Nicolás.</small>
    </form>
  </div>
</section>

<div id="app" hidden>
  <header class="top">
    <img src="logo.png" alt="">
    <div class="t">Bitácora<small>Alas de Libertad</small></div>
    <button class="me" id="meBtn" onclick="abrirMenu()" aria-label="Tu usuario"></button>
  </header>
  <div class="estado" id="estado" role="status" hidden></div>
  <main id="main"></main>
</div>
<nav class="nav" id="nav" hidden>
  <button data-v="inicio" onclick="go('inicio')"><span class="ic">✏️</span>Anotar</button>
  <button data-v="internos" onclick="go('internos')"><span class="ic">👥</span>Internos</button>
  <button data-v="viernes" onclick="go('viernes')"><span class="ic">📅</span>Viernes</button>
</nav>
<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="backdrop" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast"></div>
<datalist id="dlPersonas"></datalist>

<script>
/* ============================================================
   Bitácora · Alas de Libertad
   - Los internos NO se cargan acá: vienen de Base_Internos (pestañas "Internos" y "Egresados")
     por el mismo Apps Script de la app de Internos, y se actualizan solos en tiempo real (Firebase).
   - Lo que se anota en la bitácora se guarda en la pestaña "Bitacora" y las tareas en "Tareas Bitacora".
   ============================================================ */
const DEFAULT_API = "https://script.google.com/macros/s/AKfycbzYLuWCtvRv-sQobVzwXxUhTbjfhDuul9raoOD4RbxFOkBVaPI5FLEOU4TI5z3pQl9_/exec";
let API = DEFAULT_API;
const MED_API = "https://script.google.com/macros/s/AKfycbzYithfRv1aTYL1CrPeYHpAcq7XccGY3Gm7Bvlb56aCn65ZlT-FS7a6ePZ7-OumAz5LRw/exec"; // app de Médicos
const HOJA_BIT = "Bitacora", HOJA_TAR = "Tareas Bitacora", HOJA_EGR = "Egresados";
const DUR_MESES = 9;

/* ============ Utilidades ============ */
const DAY = 864e5;
const DN = ['dom','lun','mar','mié','jue','vie','sáb'];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const D = x => x instanceof Date ? x : new Date(x);
const fDate = x => { const d = D(x); return `${DN[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth()+1)}`; };
const fDateY = x => { if(!x) return '—'; const d = D(x); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`; };
const fTime = x => { const d = D(x); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const midnight = x => { const d = new Date(D(x)); d.setHours(0,0,0,0); return d; };
const dayDiff = (a,b) => Math.round((midnight(a)-midnight(b))/DAY);
function relDay(x){ const k = dayDiff(new Date(), x); if(k===0) return 'Hoy'; if(k===1) return 'Ayer'; return fDate(x); }
function toLocalInput(x){ const d = D(x); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
const aHoja = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
function toISO(v){ v = String(v||'').trim(); if(/^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0,10); const m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); return m ? m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0') : ''; }
// "2026-11-18 15:20", "2026-11-18" o ISO -> Date local
function fechaDe(v){ v = String(v||'').trim(); const m = v.match(/^(\d{4})-(\d{2})-(\d{2})(?:[ T](\d{1,2}):(\d{2}))?/); if(m) return new Date(+m[1], +m[2]-1, +m[3], +(m[4]||0), +(m[5]||0)); const d = new Date(v); return isNaN(d) ? new Date(0) : d; }
const diaLocal = s => s ? fechaDe(s) : null;
function durTxt(from, to=new Date()){ const d = Math.max(0, dayDiff(to, from)); if(d < 31) return `${d} días`; const m = Math.floor(d/30.44); return m===1 ? '1 mes' : `${m} meses`; }
function mesDe(ing){ const d = Math.max(0, dayDiff(new Date(), ing)); return Math.min(DUR_MESES, Math.floor(d/30.44)+1); }
function lastFriday(ref = new Date()){ const d = new Date(ref); d.setHours(10,0,0,0); d.setDate(d.getDate() - ((d.getDay()-5+7)%7)); if(d > ref) d.setDate(d.getDate()-7); return d; }
const shortName = n => { const p = String(n).trim().split(/\s+/); return p.length>1 ? `${p[0]} ${p[p.length-1][0]}.` : String(n); };
const initials = n => String(n).trim().split(/\s+/).map(w=>w[0]||'').slice(0,2).join('').toUpperCase();
const normCed = c => String(c||'').replace(/\D/g,'');
const nid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const lista = (s, sep=',') => String(s||'').split(sep).map(x=>x.trim()).filter(Boolean);

const CATS = {
  conducta:{label:'Evolución / Conducta', short:'Conducta', icon:'🧭', color:'var(--c-conducta)', hint:'Crisis, desmotivación, intención de abandono, avances'},
  familia:{label:'Contacto familiar / externo', short:'Familia', icon:'📞', color:'var(--c-familia)', hint:'Llamadas, reclamos, visitas'},
  equipo:{label:'Incidencia de equipo', short:'Equipo', icon:'🤝', color:'var(--c-equipo)', hint:'Conflictos, trato hacia internos, alertas legales'},
  general:{label:'Novedad general', short:'General', icon:'🏠', color:'var(--c-general)', hint:'Mantenimiento, convivencia, insumos'}
};
const PRIOS = {normal:'Normal', importante:'Importante', urgente:'Urgente / Delicado'};
const TSTATE = {pendiente:'Pendiente', proceso:'En proceso', hecho:'Hecho'};
const estCls = e => /termin|derivad|finaliz|egresad/i.test(e) ? 'ok' : /(fue|estall|abandon|fuga)/i.test(e) ? 'bad' : 'neu';

/* ============ Estado ============ */
let email = "", pass = "", role = "", token = "", soloCopia = false;

let PERS = [], BYID = {}, REGS = [], TAR = [];

function miNombre(){ try { const n = localStorage.getItem('alas-bit-nombre'); if(n) return n; } catch(e){} const u = email.split('@')[0] || 'Usuario'; return u.charAt(0).toUpperCase()+u.slice(1); }
// Siempre por fecha de ingreso: el que más tiempo lleva en la casa, primero
const porIngreso = (a,b) => (a.ingreso ? +a.ingreso : 9e15) - (b.ingreso ? +b.ingreso : 9e15) || a.nombre.localeCompare(b.nombre,'es');
const activos = () => PERS.filter(p => p.estado==='Activo').sort(porIngreso);
const bajas = () => PERS.filter(p => p.estado!=='Activo').sort((a,b)=>(b.baja?+b.baja:0)-(a.baja?+a.baja:0));
function weekRange(offset){ const F = lastFriday(); const s = new Date(F.getTime()+offset*7*DAY); return [s, new Date(s.getTime()+7*DAY)]; }
const inRange = (x,[s,e]) => { const t = D(x); return t>=s && t<e; };

/* ============ Armar los datos que vienen de la planilla ============ */
function armar(int, egr, reg, tar, med){
  if(Array.isArray(med)) RAW.med = med;
  if(Array.isArray(int)) RAW.int = int; if(Array.isArray(egr)) RAW.egr = egr; if(Array.isArray(reg)) RAW.reg = reg; if(Array.isArray(tar)) RAW.tar = tar;
  const act = RAW.int.filter(o => String(o.nombre||'').trim()).map(o => ({
    id:String(o.id||''), nombre:String(o.nombre).trim(), cedula:String(o.cedula||''), ingreso:diaLocal(toISO(o.ingreso)), tipo:String(o.tipo||''), estado:'Activo', baja:null }));
  const actIds = new Set(act.map(p=>p.id)), actCed = new Set(act.map(p=>normCed(p.cedula)).filter(Boolean));
  const egMap = new Map();
  RAW.egr.filter(o => String(o.nombre||'').trim()).forEach(o => {
    const p = { id:String(o.id || ('egr-'+(normCed(o.cedula) || o._fila))), nombre:String(o.nombre).trim(), cedula:String(o.cedula||''), ingreso:diaLocal(toISO(o.fechadeingreso)),
      tipo:String(o.tipo||''), estado:String(o.motivo||'').trim() || 'Egresado', baja:diaLocal(toISO(o.fechadeegreso)), nota:String(o.nota||'') };
    if(actIds.has(p.id) || (p.cedula && actCed.has(normCed(p.cedula)))) return; // volvió a ingresar: cuenta como activo
    const k = normCed(p.cedula) || p.id, ya = egMap.get(k);
    if(!ya || (p.baja && (!ya.baja || p.baja > ya.baja))) egMap.set(k, Object.assign(p, {otrosIds: ya ? [ya.id, ...(ya.otrosIds||[])] : []}));
  });
  PERS = [...act, ...egMap.values()];
  BYID = {}; PERS.forEach(p => { BYID[p.id] = p; (p.otrosIds||[]).forEach(x => BYID[x] = BYID[x] || p); });
  const byCed = {}; PERS.forEach(p => { const c = normCed(p.cedula); if(c && (!byCed[c] || p.estado==='Activo')) byCed[c] = p; });

  REGS = RAW.reg.filter(o => o.id).map(o => {
    const ids = lista(o.internos), noms = lista(o.nombres,'|'), ceds = lista(o.cedulas);
    const internos = ids.map((id,k) => {
      if(BYID[id]) return BYID[id].id;
      const c = normCed(ceds[k]); if(c && byCed[c]) return byCed[c].id;
      // ya no está en Internos ni en Egresados (por ejemplo, se borró la fila): se conserva con el nombre guardado
      const p = {id, nombre: noms[k] || 'Sin nombre', cedula: ceds[k]||'', ingreso:null, tipo:'', estado:'Sin datos en Internos', baja:null, fantasma:true};
      PERS.push(p); BYID[id] = p; return id;
    });
    return { id:String(o.id), fecha:fechaDe(o.fecha), cat: CATS[o.categoria] ? o.categoria : 'general', prio: PRIOS[o.prioridad] ? o.prioridad : 'normal',
      internos, nombres:noms, cedulas:ceds, personal:String(o.personal||''), texto:String(o.texto||''), operador:String(o.operador||''), email:String(o.email||''),
      editado:String(o.editado||''), _fila:o._fila };
  }).sort((a,b)=>b.fecha-a.fecha);
  // Bajas: una línea automática en la bitácora el día del egreso (no se guarda, se arma de la pestaña Egresados)
  bajas().filter(p=>!p.fantasma && p.baja).forEach(p => REGS.push({ id:'egr:'+p.id, fecha:new Date(p.baja.getFullYear(),p.baja.getMonth(),p.baja.getDate(),8,0), cat:'conducta', prio:'urgente',
    internos:[p.id], nombres:[p.nombre], cedulas:[p.cedula], personal:'', operador:'App de Internos', email:'', sistema:true,
    texto:`Egreso registrado en la app de Internos (motivo: ${p.estado})${p.nota?'. Nota: '+p.nota:''}. Sale de la lista de activos; sus registros quedan guardados.` }));
  REGS.sort((a,b)=>b.fecha-a.fecha);

  // Turnos de la app de Médicos: se unen a cada persona por el nombre
  const kN = x => String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
  const porNombre = {}; PERS.forEach(p => { const k = kN(p.nombre); if(!porNombre[k] || p.estado==='Activo') porNombre[k] = p; });
  MED = RAW.med.filter(t => t && t.interno && /^\d{4}-\d{2}-\d{2}/.test(String(t.fecha||''))).map(t => {
    const d = fechaDe(String(t.fecha).slice(0,10) + (/^\d{1,2}:\d{2}/.test(String(t.hora||'')) ? ' ' + String(t.hora).slice(0,5) : ''));
    const p = porNombre[kN(t.interno)];
    return { id:String(t.id||''), nombre:String(t.interno).trim(), pid: p ? p.id : '', fecha:d, hora:/^\d{1,2}:\d{2}/.test(String(t.hora||'')) ? String(t.hora).slice(0,5) : '',
      lugar:String(t.lugar||''), esp:String(t.especialidad||''), estado:String(t.estado||'pendiente') };
  }).sort((a,b) => a.fecha - b.fecha);
  TAR = RAW.tar.filter(o => o.id && String(o.titulo||'').trim()).map(o => ({ id:String(o.id), titulo:String(o.titulo), estado: TSTATE[o.estado] ? o.estado : 'pendiente',
    resp:String(o.responsable||''), limite:toISO(o.limite), origen:String(o.origen||''), creada:String(o.creada||''), creadapor:String(o.creadapor||''), _fila:o._fila }));

  const nombres = new Set([miNombre()]);
  REGS.forEach(r => { if(r.personal) nombres.add(r.personal); if(r.operador && !r.sistema) nombres.add(r.operador); });
  TAR.forEach(t => t.resp && nombres.add(t.resp)); nombres.add('Coordinación');
  $('dlPersonas').innerHTML = [...nombres].sort((a,b)=>a.localeCompare(b,'es')).map(n=>`<option value="${esc(n)}">`).join('');
  if(S.intSel && !BYID[S.intSel]) S.intSel = null;
  render();
}

/* ============ Comunicación con la hoja (mismo script que Internos) ============ */
const REPETIBLE = a => /^(get|check|list)/i.test(a||'') || ['updateRow','inicio'].includes(a);
async function postGoogle(url, datos){
  const body = JSON.stringify(datos), esperas = REPETIBLE(datos.action) ? [7000,8000,9000,10000,12000] : [0]; let err;
  for(const ms of esperas){
    const ctl = ms ? new AbortController() : null, tm = ms ? setTimeout(()=>ctl.abort(), ms) : 0;
    try { const r = await fetch(url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body, signal: ctl ? ctl.signal : undefined});
      const t = await r.text(); clearTimeout(tm); return {r, t}; }
    catch(e){ clearTimeout(tm); err = e.name==='AbortError' ? new Error('Google no contestó') : e; }
  }
  throw err;
}
async function api(datos){
  const {r, t} = await postGoogle(API, Object.assign(credenciales(), datos));
  if(!r.ok) throw new Error('HTTP '+r.status);
  let o; try { o = JSON.parse(t); } catch(e){ throw new Error('respuesta inesperada de la hoja'); }
  if(o && o.auth===false && datos.action!=='logout'){ sesionVencida(o.error); throw new Error(o.error||'sesión vencida'); }
  return o;
}
function sesionVencida(txt){ borrarSesion(); token=''; pass=''; role=''; mostrar(false); modoSetup(false); $('lmsg').textContent = txt || 'Tu sesión venció. Ingresá de nuevo con tu contraseña.'; }
function leerCache(em){ try { const c = JSON.parse(localStorage.getItem('alas-cache-bitacora')||'null'); return c && c.email===em && c.d ? c : null; } catch(x){ return null; } }
function guardarCache(){ try { if(token && localStorage.getItem('alas-token')) localStorage.setItem('alas-cache-bitacora', JSON.stringify({email, role, t:Date.now(), d:[RAW.int, RAW.egr, RAW.reg, RAW.tar, RAW.med]})); } catch(x){} }
const datos = r => (r && Array.isArray(r.data)) ? r.data : [];

async function cargar(){
  estado('Actualizando…');
  const [r, bit, tar] = await Promise.all([
    api({action:'inicio', hojas:[HOJA_EGR]}),
    api({action:'getSheet', sheet:HOJA_BIT}),
    api({action:'getSheet', sheet:HOJA_TAR})
  ]);
  let int, egr;
  if(r && Array.isArray(r.internos)){ if(r.role) role = String(r.role); int = r.internos; egr = (r.hojas||{})[HOJA_EGR] || []; FSC.tCarga = Number(r.tServidor)||0; }
  else if(r && r.allowed===false){ sesionVencida(r.error); throw new Error(r.error||'sesión vencida'); }
  else { const [i2, e2] = await Promise.all([api({action:'getInternos'}), api({action:'getSheet', sheet:HOJA_EGR})]); int = i2; egr = datos(e2); }
  if(!Array.isArray(int)) throw new Error((int && int.error) || 'no se pudo leer Internos');
  soloCopia = false;
  armar(int, egr, datos(bit), datos(tar));
  guardarCache();
  estado('');
  FSC.datos = {internos:int, ['hoja_'+HOJA_EGR]:egr}; Object.keys(FSC.datos).forEach(k => FSC.ult[k] = JSON.stringify(FSC.datos[k]));
  setTimeout(fsEscuchar, 0);
  cargarMedicos();
}

async function refrescarBitacora(silencioso=true){
  if(!token || S.ocupado) return;
  try { const [bit, tar] = await Promise.all([api({action:'getSheet', sheet:HOJA_BIT}), api({action:'getSheet', sheet:HOJA_TAR})]);
    const antes = RAW.reg.length + '|' + RAW.tar.map(t=>t.estado).join();
    if(document.querySelector('#sheetWrap:not([hidden])')) { RAW.reg = datos(bit); RAW.tar = datos(tar); return; } // no interrumpir un formulario abierto
    armar(null, null, datos(bit), datos(tar)); guardarCache();
    if(!silencioso && antes !== RAW.reg.length + '|' + RAW.tar.map(t=>t.estado).join()) toast('Hay novedades nuevas del equipo');
  } catch(e){ if(!silencioso) estado('No se pudo actualizar ('+e.message+').', true); }
}
setInterval(() => { if(document.visibilityState==='visible'){ refrescarBitacora(false); cargarMedicos(); } }, 60000);

async function fsAcceso(forzar){ const k = 'alas-fs-acc', marca = email+'|'+FSC.uid; let v = ''; try { v = localStorage.getItem(k) || sessionStorage.getItem(k) || ''; } catch(x){}

async function fsEscuchar(){

/* ============ Guardar en la planilla ============ */
// Busca la fila actual de un registro por su id (las filas pueden correrse si otro borró algo)
async function filaDe(hoja, id){ const r = await api({action:'getSheet', sheet:hoja}); const o = datos(r).find(x => String(x.id)===String(id)); return o ? o._fila : 0; }
function errorGuardar(e){
  const m = String(e && e.message || e);
  if(/Solo un Admin/i.test(m)) return 'Tu usuario todavía no puede anotar en la bitácora (falta habilitarlo en el script). Avisale a Nicolás.';
  return 'No se pudo guardar: ' + m + '. Revisá la conexión y probá de nuevo.';
}
async function guardarFila(hoja, rec, log, editar){
  S.ocupado = true;
  try {
    let r;
    if(editar){ const fila = await filaDe(hoja, rec.id); if(!fila) throw new Error('ya no existe en la planilla');
      r = await api({action:'updateRow', sheet:hoja, fila, record:rec, log}); }
    else r = await api({action:'addRow', sheet:hoja, record:rec, log});
    if(!r || r.ok!==true) throw new Error((r && r.error) || 'la hoja no confirmó');
  } finally { S.ocupado = false; }
}
async function borrarFila(hoja, id, log){
  S.ocupado = true;
  try { const fila = await filaDe(hoja, id); if(!fila) throw new Error('ya no existe en la planilla');
    const r = await api({action:'deleteRow', sheet:hoja, fila, log}); if(!r || r.ok!==true) throw new Error((r && r.error) || 'la hoja no confirmó'); }
  finally { S.ocupado = false; }
}

  const b = $('aSave'); b.disabled = true; b.textContent = 'Guardando…';

/* ---- VIERNES: resumen de la semana + pendientes ---- */
function semanaDatos(){
  const rng = weekRange(V.semana), [s, e] = rng;
  const regs = REGS.filter(r => inRange(r.fecha, rng)).sort((a,b) => a.fecha - b.fecha);
  const urg = regs.filter(r => r.prio==='urgente');
  const resto = regs.filter(r => r.prio!=='urgente');
  const gente = PERS.filter(p => resto.some(r => r.internos.includes(p.id))).sort(porIngreso)
    .map(p => ({p, regs: resto.filter(r => r.internos.includes(p.id))}));
  const general = resto.filter(r => !r.internos.length);
  const sinNada = activos().filter(p => !regs.some(r => r.internos.includes(p.id)));
  // Médicos: en la semana actual, los que vienen (hasta el viernes siguiente al cambio de guardia); en semanas pasadas, los de esa semana
  const actual = V.semana===0, mDesde = actual ? midnight(new Date()) : s, mHasta = actual ? new Date(e.getTime() + 7*DAY) : e;
  const meds = MED.filter(t => t.fecha>=mDesde && t.fecha<mHasta && (!actual || t.estado==='pendiente'));
  return {s, e, regs, urg, gente, general, sinNada, meds, actual};
}
function vViernes(){
  const W = semanaDatos(), enCurso = new Date() >= W.s && new Date() < W.e;
  const linea = r => `<button class="ln" onclick="ver('${esc(r.id)}')"><span>${fDate(r.fecha)}</span>${esc(r.texto)}</button>`;
  return `
  <div class="semana">
    <button onclick="V.semana--;render()" aria-label="Semana anterior">‹</button>
    <div><b>Semana del ${fDate(W.s)} al ${fDate(W.e)}</b>${enCurso ? '<small>esta semana</small>' : ''}</div>
    <button onclick="V.semana++;render()" ${V.semana >= 0 ? 'disabled' : ''} aria-label="Semana siguiente">›</button>
  </div>
  <button class="btn wa full grande" onclick="copiarWA()">📋 Copiar resumen para WhatsApp</button>

  <h2 class="rojo">⚠ Urgente (${W.urg.length})</h2>
  ${W.urg.map(r => item(r)).join('') || '<div class="vacio">Nada urgente esta semana.</div>'}

  <h2>🩺 Médicos ${W.actual ? 'que vienen' : 'de esa semana'} (${W.meds.length})</h2>
  ${W.meds.length ? `<div class="bloque">${W.meds.map(t => `<div class="ln"><b>${esc(t.nombre)}</b><span>${esc(medTxt(t))}${estMed(t)}</span></div>`).join('')}</div>` : `<div class="vacio">${W.actual ? 'No hay médicos anotados para estos días.' : 'No hubo médicos esa semana.'}</div>`}
  <a class="link" data-pasa href="${URL_MED}">Abrir la app de Médicos ›</a>

  <h2>Por persona</h2>
  ${W.gente.map(g => `<div class="bloque"><b>${esc(g.p.nombre)}${g.p.estado!=='Activo' ? ` <span class="tag gris">${esc(g.p.estado)}</span>` : ''}</b>${g.regs.map(linea).join('')}</div>`).join('') || '<div class="vacio">Sin novedades de internos.</div>'}
  ${W.sinNada.length && V.semana===0 ? `<p class="nota">Sin nada anotado esta semana: ${W.sinNada.map(p => esc(p.nombre)).join(', ')}.</p>` : ''}

  <h2>🏠 General</h2>

  ${tareasBloque()}`;
}
async function agregarPend(){
  const inp = $('pNuevo'), t = inp.value.trim(); if(!t){ inp.focus(); return; }
  const rec = {id:nid('t'), titulo:t, estado:'pendiente', responsable:'', limite:'', origen:'Semana del ' + fDate(weekRange(0)[0]), creada:aHoja(new Date()), creadapor:miNombre()};
  inp.disabled = true;
  try { await guardarFila(HOJA_TAR, rec, 'Nuevo pendiente: ' + t.slice(0,80), false); RAW.tar.push(rec); armar(); toast('✓ Pendiente agregado');  }
  catch(e){ inp.disabled = false; estado(errorGuardar(e), true); }
}
async function marcar(id, hecho){
  const t = TAR.find(x => x.id===id); if(!t) return;
  const nuevo = hecho ? 'hecho' : 'pendiente';
  try { await guardarFila(HOJA_TAR, {id, estado:nuevo}, (hecho ? 'Hecho: ' : 'Volvió a pendiente: ') + t.titulo.slice(0,80), true);
    const r = RAW.tar.find(x => String(x.id)===id); if(r) r.estado = nuevo; armar(); toast(hecho ? '✓ Hecho' : 'Vuelve a pendientes'); }
  catch(e){ render(); estado(errorGuardar(e), true); }
}
function textoWA(){
  const W = semanaDatos(), corto = n => shortName(n), clip = t => t.length > 220 ? t.slice(0,217).trimEnd() + '…' : t;
  const q = r => r.internos.length ? r.internos.map(id => corto(BYID[id].nombre)).join(', ') : 'General';
  const L = [`*ALAS DE LIBERTAD*`, `Semana del ${fDate(W.s)} al ${fDate(W.e)}`, ''];
  L.push('⚠ *URGENTE*'); W.urg.forEach(r => L.push(`• *${q(r)}* (${fDate(r.fecha)}): ${clip(r.texto)}`)); if(!W.urg.length) L.push('• Nada urgente.');
  L.push('', '🩺 *MÉDICOS*'); W.meds.forEach(t => L.push(`• *${corto(t.nombre)}*: ${medTxt(t)}${estMed(t)}`)); if(!W.meds.length) L.push('• No hay médicos anotados.');
  L.push('', '👥 *POR PERSONA*'); W.gente.forEach(g => { L.push(`*${corto(g.p.nombre)}*`); g.regs.forEach(r => L.push(`– ${fDate(r.fecha)}: ${clip(r.texto)}`)); }); if(!W.gente.length) L.push('• Sin novedades.');
  L.push('', '🏠 *GENERAL*'); W.general.forEach(r => L.push(`• ${fDate(r.fecha)}: ${clip(r.texto)}`)); if(!W.general.length) L.push('• Sin novedades.');
  const pend = TAR.filter(t => t.estado!=='hecho'); L.push('', '📋 *TAREAS DE LA CHACRA*'); pend.forEach(t => L.push(`☐ ${t.titulo}`)); if(!pend.length) L.push('• No hay.');
  return L.join('\n');
}
async function copiarWA(){
  const t = textoWA(); let ok = false;
  try { await navigator.clipboard.writeText(t); ok = true; } catch(e){}
  if(ok){ toast('✓ Copiado. Pegalo en el grupo de WhatsApp.'); return; }
  openSheet(`<div class="sh-h"><h2>Resumen</h2><button class="x" onclick="closeSheet()">✕</button></div>
    <div class="sh-b"><p class="nota">Mantené apretado el texto, elegí "Seleccionar todo" y "Copiar".</p><textarea readonly style="min-height:360px;font-size:14px">${esc(t)}</textarea></div>`);
}

/* ============ Ingreso (igual que Internos y Cuartos) ============ */
function modoSetup(on, codigo){ $('setup').hidden = !on; $('pwrow').hidden = on; $('coderow').hidden = !(on && codigo); if(!on) $('ncode').value = '';
  $('ltxt').textContent = on ? (codigo ? 'Escribí el código que te pasaron y elegí tu contraseña nueva.' : 'Es tu primera vez: elegí una contraseña para tu usuario.') : 'Ingresá con el mismo correo y contraseña de la app de Internos.';
  $('lbtn').textContent = on ? 'Crear contraseña e ingresar' : 'Ingresar'; }
$('lf').addEventListener('submit', async e => {
  e.preventDefault(); email = $('em').value.trim().toLowerCase(); $('lmsg').textContent = '';
  const setup = !$('setup').hidden; $('lbtn').disabled = true;
  try {
    if(setup){ const a = $('np1').value, b = $('np2').value;
      if(!$('coderow').hidden && !/^\d{6}$/.test($('ncode').value.trim())){ $('lmsg').textContent = 'Escribí el código de 6 números que te pasaron.'; return; }
      if(a.length < 6){ $('lmsg').textContent = 'La contraseña tiene que tener al menos 6 caracteres.'; return; }
      if(a !== b){ $('lmsg').textContent = 'Las dos contraseñas no coinciden.'; return; }
      pass = ''; token = ''; const r = await api({action:'setPassword', newPassword:a, code:$('ncode').value.trim()});
      if(!r || r.ok!==true){ $('lmsg').textContent = (r && r.error) || 'No se pudo guardar la contraseña.'; return; }
      if(r.token){ token = r.token; pass = ''; } else pass = a; modoSetup(false);
    } else { token = ''; pass = $('pw').value; }
    const res = await api({action:'checkUser'});
    if(res && res.token){ token = res.token; pass = ''; }
    if(res && res.needsSetup){ modoSetup(true, res.needsCode); return; }
    if(!res || !res.allowed){ $('lmsg').textContent = (res && res.error) || 'Ese correo no está autorizado.'; return; }
    role = String(res.role||'');
    try { localStorage.setItem('internos-email', email); } catch(x){} guardarSesion();
    $('pw').value = ''; mostrar(true); render(); await cargar();
  } catch(err){ $('lmsg').textContent = 'No se pudo conectar con la hoja (' + err.message + '). Probá de nuevo.'; }
  finally { $('lbtn').disabled = false; if($('setup').hidden) $('lbtn').textContent = 'Ingresar'; }
});
try { $('em').value = localStorage.getItem('internos-email') || ''; localStorage.removeItem('internos-pw'); if(localStorage.getItem('alas-token')) $('rec').checked = true; const su = localStorage.getItem('internos-api'); if(su) API = su; } catch(e){}
(async()=>{
  const fin = () => $('splash').hidden = true;
  const ses = sesionGuardada();
  if(!ses || !ses.email || !ses.token){ mostrar(false); fin(); return; }
  email = ses.email; token = ses.token || ''; pass = '';
  const cache = leerCache(email);
  if(cache){ soloCopia = true; role = String(cache.role||''); mostrar(true); try { armar(...cache.d); } catch(x){} fin();
    try { await cargar(); guardarSesion(); }
    catch(e){ soloCopia = true; render(); if(token){ const h = new Date(cache.t); estado('Google no contesta: se ve lo guardado a las '+fTime(h)+'. Tocá tu nombre → Actualizar.', true); } }
    return; }
  try { mostrar(true); render(); await cargar();
    if(!role){ const res = await api({action:'checkUser'});
      if(!res || !res.allowed){ const t = res && res.error; borrarSesion(); token=''; email=''; mostrar(false); if(t) $('lmsg').textContent = t; return; }
      role = String(res.role||''); render(); }
    guardarSesion();
  } catch(e){ if(token) estado('No se pudo cargar: '+e.message+'. Tocá tu nombre → Actualizar.', true); }
  finally { fin(); }
})();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));

</script>
