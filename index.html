<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16120e">
<meta name="robots" content="noindex">
<title>Bitácora · Alas de Libertad</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="bloqueo.js?v=2"></script>
<link rel="icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>/* Estilo de las apps de Alas (Médicos y Despensa): fondo oscuro, tarjetas marrones, acento naranja */
:root{--bg:#16120e;--card:#211b15;--card2:#2b241d;--line:#3a3027;--ink:#f0e8da;--mut:#b3a99b;--acc:#f7a823;--accx:#281a08;--soft:#3a2a12;--ok:#8fd19e;--blue:#8db4ff;--red:#ff8f7a}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15.5px/1.4 "Hanken Grotesk",system-ui,-apple-system,Segoe UI,sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:30;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
.top img{width:36px;height:36px;object-fit:contain}
.top .t{flex:1;font:700 26px Fraunces,serif;line-height:1}.top .t small{display:block;font:400 12.5px "Hanken Grotesk",sans-serif;color:var(--mut);margin-top:3px}
.me{border:0;background:none;padding:0}
.av{width:38px;height:38px;border-radius:50%;background:var(--card2);border:1px solid var(--line);color:var(--acc);display:grid;place-items:center;font-weight:700;font-size:14px}
.estado{max-width:560px;margin:0 auto 6px;background:var(--soft);border:1px solid var(--acc);border-radius:12px;font-size:14px;padding:9px 12px;text-align:center}
.estado.err{border-color:var(--red);color:var(--red);background:#2a1512}
main{padding:4px 14px 16px}
h1{font:700 24px/1.15 Fraunces,serif;margin:4px 2px 10px}
.ayuda{border:1px dashed #6a4a16;background:#241a0e;border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.45;color:#f3d9a8;margin-bottom:12px}
.srch{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px;margin-bottom:12px}
.srch input{flex:1;background:none;border:0;color:var(--ink);font:inherit;outline:none;padding:11px 0}
.grp{font-size:11.5px;font-weight:700;letter-spacing:.07em;color:var(--mut);margin:16px 2px 6px;text-transform:uppercase}
.grp.rojo{color:var(--acc)}
.vacio{text-align:center;color:var(--mut);padding:22px 10px;border:1px dashed var(--line);border-radius:14px;font-size:14.5px}
/* lista de internos */
.fila{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px;color:var(--ink)}
.fila.u{border-color:var(--acc);background:linear-gradient(90deg,#2e2214,var(--card) 60%)}
.fila .fn{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.fila .fn b{font-size:16px}
.fila .fn small{color:var(--mut);font-size:12.5px}
.fila .ult{font-size:13.5px;color:#d8cebf;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila .ult i{font-style:normal;color:var(--mut)}
.fila .fl{color:var(--mut);font-size:22px}
em.ur{font-style:normal;font-size:12px;font-weight:700;color:var(--acc);margin-left:4px}
.est{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--mut);font-weight:600}
/* ficha */
.volver{border:0;background:none;color:var(--acc);font-weight:700;font-size:15.5px;padding:4px 0;margin-bottom:4px}
.ficha-h h1{margin:2px 2px 2px}.ficha-h p{color:var(--mut);margin:0 2px 12px;font-size:14px}
.paso{font:700 19px Fraunces,serif;margin:18px 2px 6px;display:flex;align-items:baseline;gap:8px}
.paso small{font:600 12.5px "Hanken Grotesk",sans-serif;color:var(--mut)}
.dia-t{font-size:11.5px;font-weight:700;letter-spacing:.07em;color:var(--mut);margin:14px 2px 6px;text-transform:uppercase}
/* notas */
.it{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 13px;margin-bottom:8px;color:var(--ink)}
.it.urg{border-color:var(--acc);background:linear-gradient(90deg,#2e2214,var(--card) 60%)}
.it.sys{border-style:dashed;background:transparent}
.it.anul{opacity:.55}.it.anul p{text-decoration:line-through}
.it-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.it-top b{font-size:15.5px}
.cuando{margin-left:auto;color:var(--mut);font-size:12.5px;white-space:nowrap}
.it p{margin:5px 0 3px;font-size:15px;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.it small{color:var(--mut);font-size:12px}
.tag{display:inline-block;background:var(--acc);color:var(--accx);font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 9px}
.tag.gris{background:var(--card2);color:var(--mut);border:1px solid var(--line)}
/* botones (como Médicos) */
.b{background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:12px 10px;font:600 14.5px "Hanken Grotesk",sans-serif;text-align:center;text-decoration:none;display:block}
.b.p{background:var(--acc);color:var(--accx);border-color:var(--acc);font-weight:700}
.b.full{width:100%;margin-top:8px}.b.grande{padding:15px;font-size:16px}
.b.red{color:var(--red)}.b.suave{background:transparent;color:var(--mut)}
.b.wa{background:#1f6b3d;border-color:#2f8a52;color:#fff;font-weight:700}
.b:disabled{opacity:.6}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.btns .full{grid-column:1/-1;margin:0}
/* calendario (como Despensa) */
.cal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px}
.mesh{display:flex;align-items:center;gap:8px;margin-bottom:8px}.mesh h2{flex:1;margin:0;font:700 19px Fraunces,serif;text-align:center}
.ic{background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--mut);padding:8px 13px;font:600 16px inherit}
.mes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.mes .h{color:var(--mut);font-size:10.5px;text-align:center;font-weight:700;padding:2px 0}
.mes button{height:44px;border-radius:9px;background:var(--card2);border:1px solid transparent;color:var(--ink);font-weight:600;font-size:13.5px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.mes button i{display:block;width:6px;height:6px;border-radius:50%}
.mes button i.si{background:var(--ink);opacity:.7}.mes button i.ur{background:var(--acc)}
.mes button.v{visibility:hidden}.mes button.hoy{border-color:var(--acc)}.mes button.sel{background:var(--acc);color:var(--accx)}.mes button.sel i.si{background:var(--accx)}
/* viernes */
.semana{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:4px}
.semana>div{flex:1;text-align:center}.semana b{display:block;font:700 17px Fraunces,serif}.semana small{color:var(--ok);font-weight:700;font-size:12.5px}
.semana button{width:42px;height:42px;border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:12px;font-size:19px}.semana button:disabled{opacity:.3}
.bloque{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px;margin-bottom:8px}
.bloque>b{display:block;font-size:15.5px;margin:2px 0 2px}
.ln{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:8px 0;font-size:14.5px;white-space:pre-line;color:var(--ink)}
.bloque>.ln:first-child,.bloque>b+.ln{border-top:0}
.ln span{display:block;color:var(--mut);font-size:12px}
/* barra de abajo (como Médicos y Despensa) */
.nav{position:fixed;left:0;right:0;bottom:0;background:#120f0c;border-top:1px solid var(--line);display:flex;justify-content:center;padding:7px 6px calc(10px + env(safe-area-inset-bottom));z-index:35}
.nav button{position:relative;flex:1;max-width:140px;background:none;border:0;color:var(--mut);font:600 11.5px "Hanken Grotesk",sans-serif;text-align:center}
.nav button i{display:block;font-style:normal;font-size:19px;line-height:28px;width:52px;margin:0 auto 2px;border-radius:99px}
.nav button.on{color:var(--ink)}.nav button.on i{background:#3a2c18}
.badge{position:absolute;top:-3px;left:calc(50% + 12px);background:var(--acc);color:var(--accx);font-size:11px;font-weight:700;border-radius:999px;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center}
/* ventana de abajo (como Médicos) */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:#000b}
.sheet{position:relative;background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;border-top:1px solid var(--line);padding:18px 16px calc(22px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 2px;font:700 22px Fraunces,serif}.sheet .sub{color:var(--mut);margin:0 0 12px;font-size:13.5px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--mut);text-transform:uppercase;margin:12px 0 6px}
textarea{width:100%;min-height:160px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16.5px;color:var(--ink);resize:vertical;outline:none;color-scheme:dark}
textarea:focus,.srch:focus-within,.nuevo input:focus,.inp:focus{border-color:var(--acc)}
.urgbox{display:flex;gap:12px;align-items:flex-start;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.urgbox input{width:24px;height:24px;flex:none;accent-color:var(--acc);margin:0}
.urgbox b{display:block;color:var(--acc)}.urgbox small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.urgbox:has(input:checked){border-color:var(--acc);background:var(--soft)}
.texto{white-space:pre-line;font-size:16.5px;line-height:1.5;background:var(--card2);border-radius:14px;padding:13px;margin-top:8px}
.texto.tachado{text-decoration:line-through;opacity:.7}
.antes{margin-top:10px;font-size:13.5px;color:var(--mut)}.antes summary{cursor:pointer;color:var(--acc);font-weight:600}.antes div{white-space:pre-line;background:var(--card2);border-radius:10px;padding:10px;margin-top:6px}
.err{color:var(--red);font-weight:600;font-size:14px;margin:10px 2px 0;display:none}
.confirmar{background:#2a1512;border:1px solid #6a2c20;border-radius:12px;padding:12px;margin-top:12px;font-size:14.5px}
.nuevo{display:flex;gap:8px}.nuevo input{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--ink);outline:none}
.nuevo .b{padding:11px 14px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#f0e8da;color:#1b140d;padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
/* ingreso */
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center}
.sp-in{display:flex;flex-direction:column;align-items:center;gap:6px}.sp-in b{font:700 20px Fraunces,serif}.sp-in small{color:var(--mut)}
.sp-in img{width:80px;height:80px;object-fit:contain}
#login{min-height:100vh;display:grid;place-items:center;padding:20px 18px}
.lg-box{width:100%;max-width:380px}
.lg-brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;margin-bottom:6px}
.lg-brand img{width:64px;height:64px;object-fit:contain}.lg-brand small{color:var(--mut);font-size:14px}.lg-brand h1{margin:0;font:700 30px Fraunces,serif}
#ltxt{text-align:center;color:var(--mut)}
.lg-form{display:grid;gap:12px}.lg-form label{display:grid;gap:5px;font-size:13px;color:var(--mut)}
.inp{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;color:var(--ink);outline:none;color-scheme:dark}
.lg-rec{display:flex!important;align-items:center;gap:10px;font-size:14px!important}.lg-rec input{width:20px;height:20px;accent-color:var(--acc)}
.btn{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:13px;font-weight:700;color:var(--ink)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--accx)}
.muted{color:var(--mut)}.soft{color:var(--mut)}
</style>
</head>
<body>
<div id="splash" role="status" aria-live="polite"><div class="sp-in"><img src="logo.png" alt=""><b>Alas de Libertad</b><small>Cargando la bitácora…</small></div></div>

<!-- Ingreso (mismo usuario y contraseña que la app de Internos) -->
<section id="login" hidden>
  <div class="lg-box">
    <div class="lg-brand"><img src="logo.png" alt="Logo de Alas de Libertad"><div><small>Alas de Libertad</small><h1>Bitácora</h1></div></div>
    <p id="ltxt" class="muted">Ingresá con el mismo correo y contraseña de la app de Internos.</p>
    <form id="lf" class="lg-form">
      <label>Correo electrónico<input id="em" type="email" required autocomplete="username" placeholder="nombre@correo.com" class="inp"></label>
      <label id="pwrow">Contraseña<input id="pw" type="password" autocomplete="current-password" class="inp"></label>
      <div id="setup" hidden class="lg-form">
        <label id="coderow" hidden>Código de 6 números que te pasaron<input id="ncode" class="inp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 números"></label>
        <label>Elegí tu contraseña (mínimo 6 caracteres)<input id="np1" class="inp" type="password" autocomplete="new-password"></label>
        <label>Repetila<input id="np2" class="inp" type="password" autocomplete="new-password"></label>
      </div>
      <label class="lg-rec"><input id="rec" type="checkbox"> Recordarme en este dispositivo (30 días)</label>
      <div class="err" id="lmsg" role="alert" style="display:block"></div>
      <button class="btn primary" id="lbtn" type="submit" style="padding:15px">Ingresar</button>
      <small class="soft" style="text-align:center">¿Te olvidaste la contraseña? Pedile un código nuevo a Nicolás.</small>
    </form>
  </div>
</section>

<div id="app" hidden>
  <header class="top">
    <img src="logo.png" alt="">
    <div class="t">Bitácora<small>Alas de Libertad</small></div>
    <button class="me" id="meBtn" onclick="abrirMenu()" aria-label="Tu usuario"></button>
  </header>
  <div class="estado" id="estado" role="status" hidden></div>
  <main id="main"></main>
</div>
<nav class="nav" id="nav" hidden>
  <button data-v="internos" onclick="go('internos')"><i>👥</i>Internos</button>
  <button data-v="registro" onclick="go('registro')"><i>📅</i>Registro</button>
  <button data-v="viernes" onclick="go('viernes')"><i>🗓️</i>Viernes</button>
</nav>
<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="backdrop" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast"></div>
<datalist id="dlPersonas"></datalist>

<script>
/* ============================================================
   Bitácora · Alas de Libertad
   - Los internos NO se cargan acá: vienen de Base_Internos (pestañas "Internos" y "Egresados")
     por el mismo Apps Script de la app de Internos, y se actualizan solos en tiempo real (Firebase).
   - Lo que se anota en la bitácora se guarda en la pestaña "Bitacora" y las tareas en "Tareas Bitacora".
   ============================================================ */
const DEFAULT_API = "https://script.google.com/macros/s/AKfycbzYLuWCtvRv-sQobVzwXxUhTbjfhDuul9raoOD4RbxFOkBVaPI5FLEOU4TI5z3pQl9_/exec";
let API = DEFAULT_API;
const MED_API = "https://script.google.com/macros/s/AKfycbzYithfRv1aTYL1CrPeYHpAcq7XccGY3Gm7Bvlb56aCn65ZlT-FS7a6ePZ7-OumAz5LRw/exec"; // app de Médicos
const HOJA_BIT = "Bitacora", HOJA_TAR = "Tareas Bitacora", HOJA_EGR = "Egresados";
const DUR_MESES = 9;

/* ============ Utilidades ============ */
const DAY = 864e5;
const DN = ['dom','lun','mar','mié','jue','vie','sáb'];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const D = x => x instanceof Date ? x : new Date(x);
const fDate = x => { const d = D(x); return `${DN[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth()+1)}`; };
const fDateY = x => { if(!x) return '—'; const d = D(x); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`; };
const fTime = x => { const d = D(x); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const midnight = x => { const d = new Date(D(x)); d.setHours(0,0,0,0); return d; };
const dayDiff = (a,b) => Math.round((midnight(a)-midnight(b))/DAY);
function relDay(x){ const k = dayDiff(new Date(), x); if(k===0) return 'Hoy'; if(k===1) return 'Ayer'; return fDate(x); }
function toLocalInput(x){ const d = D(x); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
const aHoja = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
function toISO(v){ v = String(v||'').trim(); if(/^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0,10); const m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); return m ? m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0') : ''; }
// "2026-11-18 15:20", "2026-11-18" o ISO -> Date local
function fechaDe(v){ v = String(v||'').trim(); const m = v.match(/^(\d{4})-(\d{2})-(\d{2})(?:[ T](\d{1,2}):(\d{2}))?/); if(m) return new Date(+m[1], +m[2]-1, +m[3], +(m[4]||0), +(m[5]||0)); const d = new Date(v); return isNaN(d) ? new Date(0) : d; }
const diaLocal = s => s ? fechaDe(s) : null;
function durTxt(from, to=new Date()){ const d = Math.max(0, dayDiff(to, from)); if(d < 31) return `${d} días`; const m = Math.floor(d/30.44); return m===1 ? '1 mes' : `${m} meses`; }
function mesDe(ing){ const d = Math.max(0, dayDiff(new Date(), ing)); return Math.min(DUR_MESES, Math.floor(d/30.44)+1); }
function lastFriday(ref = new Date()){ const d = new Date(ref); d.setHours(10,0,0,0); d.setDate(d.getDate() - ((d.getDay()-5+7)%7)); if(d > ref) d.setDate(d.getDate()-7); return d; }
const shortName = n => { const p = String(n).trim().split(/\s+/); return p.length>1 ? `${p[0]} ${p[p.length-1][0]}.` : String(n); };
const initials = n => String(n).trim().split(/\s+/).map(w=>w[0]||'').slice(0,2).join('').toUpperCase();
const normCed = c => String(c||'').replace(/\D/g,'');
const nid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const lista = (s, sep=',') => String(s||'').split(sep).map(x=>x.trim()).filter(Boolean);

const CATS = {
  conducta:{label:'Evolución / Conducta', short:'Conducta', icon:'🧭', color:'var(--c-conducta)', hint:'Crisis, desmotivación, intención de abandono, avances'},
  familia:{label:'Contacto familiar / externo', short:'Familia', icon:'📞', color:'var(--c-familia)', hint:'Llamadas, reclamos, visitas'},
  equipo:{label:'Incidencia de equipo', short:'Equipo', icon:'🤝', color:'var(--c-equipo)', hint:'Conflictos, trato hacia internos, alertas legales'},
  general:{label:'Novedad general', short:'General', icon:'🏠', color:'var(--c-general)', hint:'Mantenimiento, convivencia, insumos'}
};

let MED = [];
let PERS = [], BYID = {}, REGS = [], TAR = [];
const S = { view:'bitacora', filtro:'todos', q:'', intTab:'activos', intSel:null, intCat:'todos', intQ:'', weekOffset:0, tFiltro:'abiertas', form:null, task:null, wa:{equipo:false, abrev:true, tareas:true}, ocupado:false };

// Siempre por fecha de ingreso: el que más tiempo lleva en la casa, primero
const porIngreso = (a,b) => (a.ingreso ? +a.ingreso : 9e15) - (b.ingreso ? +b.ingreso : 9e15) || a.nombre.localeCompare(b.nombre,'es');
const activos = () => PERS.filter(p => p.estado==='Activo').sort(porIngreso);
const bajas = () => PERS.filter(p => p.estado!=='Activo').sort((a,b)=>(b.baja?+b.baja:0)-(a.baja?+a.baja:0));
function weekRange(offset){ const F = lastFriday(); const s = new Date(F.getTime()+offset*7*DAY); return [s, new Date(s.getTime()+7*DAY)]; }
const inRange = (x,[s,e]) => { const t = D(x); return t>=s && t<e; };

/* ============ Armar los datos que vienen de la planilla ============ */
function armar(int, egr, reg, tar, med){
  if(Array.isArray(med)) RAW.med = med;
  if(Array.isArray(int)) RAW.int = int; if(Array.isArray(egr)) RAW.egr = egr; if(Array.isArray(reg)) RAW.reg = reg; if(Array.isArray(tar)) RAW.tar = tar;
  const act = RAW.int.filter(o => String(o.nombre||'').trim()).map(o => ({
    id:String(o.id||''), nombre:String(o.nombre).trim(), cedula:String(o.cedula||''), ingreso:diaLocal(toISO(o.ingreso)), tipo:String(o.tipo||''), estado:'Activo', baja:null }));
  const actIds = new Set(act.map(p=>p.id)), actCed = new Set(act.map(p=>normCed(p.cedula)).filter(Boolean));
  const egMap = new Map();
  RAW.egr.filter(o => String(o.nombre||'').trim()).forEach(o => {
    const p = { id:String(o.id || ('egr-'+(normCed(o.cedula) || o._fila))), nombre:String(o.nombre).trim(), cedula:String(o.cedula||''), ingreso:diaLocal(toISO(o.fechadeingreso)),
      tipo:String(o.tipo||''), estado:String(o.motivo||'').trim() || 'Egresado', baja:diaLocal(toISO(o.fechadeegreso)), nota:String(o.nota||'') };
    if(actIds.has(p.id) || (p.cedula && actCed.has(normCed(p.cedula)))) return; // volvió a ingresar: cuenta como activo
    const k = normCed(p.cedula) || p.id, ya = egMap.get(k);
    if(!ya || (p.baja && (!ya.baja || p.baja > ya.baja))) egMap.set(k, Object.assign(p, {otrosIds: ya ? [ya.id, ...(ya.otrosIds||[])] : []}));
  });
  PERS = [...act, ...egMap.values()];
  BYID = {}; PERS.forEach(p => { BYID[p.id] = p; (p.otrosIds||[]).forEach(x => BYID[x] = BYID[x] || p); });
  const byCed = {}; PERS.forEach(p => { const c = normCed(p.cedula); if(c && (!byCed[c] || p.estado==='Activo')) byCed[c] = p; });

  REGS = RAW.reg.filter(o => o.id).map(o => {
    const ids = lista(o.internos), noms = lista(o.nombres,'|'), ceds = lista(o.cedulas);
    const internos = ids.map((id,k) => {
      if(BYID[id]) return BYID[id].id;
      const c = normCed(ceds[k]); if(c && byCed[c]) return byCed[c].id;
      // ya no está en Internos ni en Egresados (por ejemplo, se borró la fila): se conserva con el nombre guardado
      const p = {id, nombre: noms[k] || 'Sin nombre', cedula: ceds[k]||'', ingreso:null, tipo:'', estado:'Sin datos en Internos', baja:null, fantasma:true};
      PERS.push(p); BYID[id] = p; return id;
    });
    return { id:String(o.id), fecha:fechaDe(o.fecha), cat: CATS[o.categoria] ? o.categoria : 'general', prio: PRIOS[o.prioridad] ? o.prioridad : 'normal',
      internos, nombres:noms, cedulas:ceds, personal:String(o.personal||''), texto:String(o.texto||''), operador:String(o.operador||''), email:String(o.email||''),
      editado:String(o.editado||''), anulado:String(o.anulado||''), antes:String(o.antes||''), _fila:o._fila };
  }).sort((a,b)=>b.fecha-a.fecha);
  // Bajas: una línea automática en la bitácora el día del egreso (no se guarda, se arma de la pestaña Egresados)
  bajas().filter(p=>!p.fantasma && p.baja).forEach(p => REGS.push({ id:'egr:'+p.id, fecha:new Date(p.baja.getFullYear(),p.baja.getMonth(),p.baja.getDate(),8,0), cat:'conducta', prio:'urgente',
    internos:[p.id], nombres:[p.nombre], cedulas:[p.cedula], personal:'', operador:'App de Internos', email:'', sistema:true,
    texto:`Egreso registrado en la app de Internos (motivo: ${p.estado})${p.nota?'. Nota: '+p.nota:''}. Sale de la lista de activos; sus registros quedan guardados.` }));
  REGS.sort((a,b)=>b.fecha-a.fecha);

  // Turnos de la app de Médicos: se unen a cada persona por el nombre
  const kN = x => String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
  const porNombre = {}; PERS.forEach(p => { const k = kN(p.nombre); if(!porNombre[k] || p.estado==='Activo') porNombre[k] = p; });
  MED = RAW.med.filter(t => t && t.interno && /^\d{4}-\d{2}-\d{2}/.test(String(t.fecha||''))).map(t => {
    const d = fechaDe(String(t.fecha).slice(0,10) + (/^\d{1,2}:\d{2}/.test(String(t.hora||'')) ? ' ' + String(t.hora).slice(0,5) : ''));
    const p = porNombre[kN(t.interno)];
    return { id:String(t.id||''), nombre:String(t.interno).trim(), pid: p ? p.id : '', fecha:d, hora:/^\d{1,2}:\d{2}/.test(String(t.hora||'')) ? String(t.hora).slice(0,5) : '',
      lugar:String(t.lugar||''), esp:String(t.especialidad||''), estado:String(t.estado||'pendiente') };
  }).sort((a,b) => a.fecha - b.fecha);
  TAR = RAW.tar.filter(o => o.id && String(o.titulo||'').trim()).map(o => ({ id:String(o.id), titulo:String(o.titulo), estado: TSTATE[o.estado] ? o.estado : 'pendiente',
    resp:String(o.responsable||''), limite:toISO(o.limite), origen:String(o.origen||''), creada:String(o.creada||''), creadapor:String(o.creadapor||''), _fila:o._fila }));

  const nombres = new Set([miNombre()]);
  REGS.forEach(r => { if(r.personal) nombres.add(r.personal); if(r.operador && !r.sistema) nombres.add(r.operador); });
  TAR.forEach(t => t.resp && nombres.add(t.resp)); nombres.add('Coordinación');
  $('dlPersonas').innerHTML = [...nombres].sort((a,b)=>a.localeCompare(b,'es')).map(n=>`<option value="${esc(n)}">`).join('');
  if(S.intSel && !BYID[S.intSel]) S.intSel = null;
  render();
}

/* ============ Comunicación con la hoja (mismo script que Internos) ============ */
const REPETIBLE = a => /^(get|check|list)/i.test(a||'') || ['updateRow','inicio'].includes(a);
async function postGoogle(url, datos){
  const body = JSON.stringify(datos), esperas = REPETIBLE(datos.action) ? [7000,8000,9000,10000,12000] : [0]; let err;
  for(const ms of esperas){
    const ctl = ms ? new AbortController() : null, tm = ms ? setTimeout(()=>ctl.abort(), ms) : 0;
    try { const r = await fetch(url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body, signal: ctl ? ctl.signal : undefined});
      const t = await r.text(); clearTimeout(tm); return {r, t}; }
    catch(e){ clearTimeout(tm); err = e.name==='AbortError' ? new Error('Google no contestó') : e; }
  }
  throw err;
}
async function api(datos){
  const {r, t} = await postGoogle(API, Object.assign(credenciales(), datos));
  if(!r.ok) throw new Error('HTTP '+r.status);
  let o; try { o = JSON.parse(t); } catch(e){ throw new Error('respuesta inesperada de la hoja'); }
  if(o && o.auth===false && datos.action!=='logout'){ sesionVencida(o.error); throw new Error(o.error||'sesión vencida'); }
  return o;
}
function sesionVencida(txt){ borrarSesion(); token=''; pass=''; role=''; mostrar(false); modoSetup(false); $('lmsg').textContent = txt || 'Tu sesión venció. Ingresá de nuevo con tu contraseña.'; }
function leerCache(em){ try { const c = JSON.parse(localStorage.getItem('alas-cache-bitacora')||'null'); return c && c.email===em && c.d ? c : null; } catch(x){ return null; } }
function guardarCache(){ try { if(token && localStorage.getItem('alas-token')) localStorage.setItem('alas-cache-bitacora', JSON.stringify({email, role, t:Date.now(), d:[RAW.int, RAW.egr, RAW.reg, RAW.tar, RAW.med]})); } catch(x){} }
const datos = r => (r && Array.isArray(r.data)) ? r.data : [];

async function cargar(){
  estado('Actualizando…');
  const [r, bit, tar] = await Promise.all([
    api({action:'inicio', hojas:[HOJA_EGR]}),
    api({action:'getSheet', sheet:HOJA_BIT}),
    api({action:'getSheet', sheet:HOJA_TAR})
  ]);
  let int, egr;
  if(r && Array.isArray(r.internos)){ if(r.role) role = String(r.role); int = r.internos; egr = (r.hojas||{})[HOJA_EGR] || []; FSC.tCarga = Number(r.tServidor)||0; }
  else if(r && r.allowed===false){ sesionVencida(r.error); throw new Error(r.error||'sesión vencida'); }
  else { const [i2, e2] = await Promise.all([api({action:'getInternos'}), api({action:'getSheet', sheet:HOJA_EGR})]); int = i2; egr = datos(e2); }
  if(!Array.isArray(int)) throw new Error((int && int.error) || 'no se pudo leer Internos');
  soloCopia = false;
  armar(int, egr, datos(bit), datos(tar));
  guardarCache();
  estado('');
  FSC.datos = {internos:int, ['hoja_'+HOJA_EGR]:egr}; Object.keys(FSC.datos).forEach(k => FSC.ult[k] = JSON.stringify(FSC.datos[k]));
  setTimeout(fsEscuchar, 0);
}

  if(!token || S.ocupado) return;

/* ============ Guardar en la planilla ============ */
// Busca la fila actual de un registro por su id (las filas pueden correrse si otro borró algo)
async function filaDe(hoja, id){ const r = await api({action:'getSheet', sheet:hoja}); const o = datos(r).find(x => String(x.id)===String(id)); return o ? o._fila : 0; }
function errorGuardar(e){
  const m = String(e && e.message || e);
  if(/Solo un Admin/i.test(m)) return 'Tu usuario todavía no puede anotar en la bitácora (falta habilitarlo en el script). Avisale a Nicolás.';
  return 'No se pudo guardar: ' + m + '. Revisá la conexión y probá de nuevo.';
}
async function guardarFila(hoja, rec, log, editar){
  S.ocupado = true;
  try {
    let r;
    if(editar){ const fila = await filaDe(hoja, rec.id); if(!fila) throw new Error('ya no existe en la planilla');
      r = await api({action:'updateRow', sheet:hoja, fila, record:rec, log}); }
    else r = await api({action:'addRow', sheet:hoja, record:rec, log});
    if(!r || r.ok!==true) throw new Error((r && r.error) || 'la hoja no confirmó');
  } finally { S.ocupado = false; }
}
async function borrarFila(hoja, id, log){
  S.ocupado = true;
  try { const fila = await filaDe(hoja, id); if(!fila) throw new Error('ya no existe en la planilla');
    const r = await api({action:'deleteRow', sheet:hoja, fila, log}); if(!r || r.ok!==true) throw new Error((r && r.error) || 'la hoja no confirmó'); }
  finally { S.ocupado = false; }
}

function nota(r, conNombre){
  return `<button class="it ${r.prio==='urgente'&&!r.anulado?'urg':''} ${r.sistema?'sys':''} ${r.anulado?'anul':''}" onclick="ver('${esc(r.id)}')">

// Notas agrupadas por día (como el registro de Despensa)
function porDias(lista, conNombre){
  let h = '', last = '';
  lista.forEach(r => { const k = midnight(r.fecha).getTime(); if(k!==last){ h += `<div class="dia-t">${relDay(r.fecha)}${dayDiff(new Date(), r.fecha) > 1 ? '' : ' · ' + fDate(r.fecha)}</div>`; last = k; } h += nota(r, conNombre); });
  return h;
}
function filtrar(q){ V.q = q; q = q.trim().toLowerCase(); document.querySelectorAll('[data-n]').forEach(b => b.hidden = !!q && !b.dataset.n.includes(q)); }

/* ---- INTERNOS (pantalla principal) ---- */
function vInternos(){
  const lista = V.verEgr ? bajas() : activos(), wk = weekRange(0);
  const ultima = id => vivas().find(r => !r.sistema && (id==='' ? !r.internos.length : r.internos.includes(id)));
  const fila = (id, nombre, sub) => { const u = ultima(id);
    const urg = !V.verEgr && vivas().some(r => r.prio==='urgente' && !r.sistema && inRange(r.fecha, wk) && (id==='' ? !r.internos.length : r.internos.includes(id)));
    return `<button class="fila${urg?' u':''}" data-n="${esc(nombre.toLowerCase())}" onclick="abrir('${esc(id)}')">
      <span class="fn"><b>${esc(nombre)}${urg ? ' <em class="ur">⚠ urgente</em>' : ''}</b><small>${sub}</small>
      <span class="ult">${u ? `<i>${hace(u.fecha)}:</i> ${esc(u.texto.slice(0,90))}${u.texto.length>90?'…':''}` : '<i>Todavía no hay nada anotado.</i>'}</span></span><span class="fl">›</span></button>`; };
  return `
  ${V.verEgr ? `<button class="volver" onclick="V.verEgr=false;render();scrollTo(0,0)">‹ Volver a los internos</button><h1>Los que ya se fueron</h1>
    <div class="ayuda">Solo para consultar: todo lo que se anotó de ellos queda guardado.</div>`
  : `<div class="ayuda">📝 Tocá a un interno para <b>anotar cómo le va</b> o ver <b>todo lo que se anotó</b> de él. Están ordenados por ingreso: el que más tiempo lleva, primero.</div>`}
  ${lista.length > 8 ? `<div class="srch"><span>🔍</span><input type="search" placeholder="Buscar nombre…" value="${esc(V.q)}" oninput="filtrar(this.value)"></div>` : ''}
  ${V.verEgr ? '' : fila('', '🏠 General', 'La casa, el equipo, la convivencia')}
  ${V.verEgr ? '' : `<div class="grp">Internos (${lista.length})</div>`}
  ${lista.map(p => fila(p.id, p.nombre, V.verEgr ? `<span class="est">${esc(p.estado)}</span>${p.baja ? ' · ' + fDateY(p.baja) : ''}` : (p.ingreso ? `Mes ${mesDe(p.ingreso)} de ${DUR_MESES} · ingresó el ${fDateY(p.ingreso)}` : ''))).join('') || '<div class="vacio">No hay nadie en esta lista.</div>'}
  ${V.verEgr ? '' : `<button class="b full suave" onclick="V.verEgr=true;V.q='';render();scrollTo(0,0)">Ver los que ya se fueron (${bajas().length})</button>`}`;
}
function abrir(id){ V.intSel = id==='' ? '__general' : id; render(); scrollTo(0,0); }

/* ---- FICHA de un interno: anotar + su historial ---- */
function vFicha(){
  const gen = V.intSel==='__general', p = gen ? null : BYID[V.intSel];
  if(!gen && !p){ V.intSel = null; return vInternos(); }
  const id = gen ? '' : p.id, act = gen || p.estado==='Activo';
  const notas = de(id), n = notas.filter(r => !r.anulado && !r.sistema).length;
  return `
  <button class="volver" onclick="V.intSel=null;render();if(V.q)filtrar(V.q)">‹ Internos</button>
  <div class="ficha-h">
    <h1>${gen ? '🏠 General' : esc(p.nombre)}</h1>
    <p>${gen ? 'La casa, el equipo, la convivencia' : act ? (p.ingreso ? `Mes ${mesDe(p.ingreso)} de ${DUR_MESES} · ingresó el ${fDateY(p.ingreso)}${p.tipo ? ' · ' + esc(p.tipo) : ''}` : '') : `<span class="est">${esc(p.estado)}</span> ${p.baja ? 'el ' + fDateY(p.baja) : ''}`}</p>
  </div>
  ${act ? `<button class="b p full grande" onclick="anotar('${esc(id)}')">✏️ Anotar ${gen ? 'algo general' : 'cómo le va a ' + esc(p.nombre.split(' ')[0])}</button>` : ''}
  <div class="paso">Todo lo anotado <small>${n} nota${n===1?'':'s'}</small></div>
  ${porDias(notas, false) || '<div class="vacio">Todavía no hay nada anotado.</div>'}`;
}

/* ---- Anotar / ver / corregir / anular ---- */
function anotar(id){
  const p = id ? BYID[id] : null;
  openSheet(`
    <h2>${p ? esc(p.nombre) : '🏠 General'}</h2><p class="sub">${fDate(new Date())} · ${fTime(new Date())} · anota ${esc(miNombre())}</p>
    <textarea id="aTxt" placeholder="¿Cómo le fue? ¿Qué dijo? ¿Qué pasó? (podés dictar con el 🎤 del teclado)"></textarea>
    <label class="urgbox"><input type="checkbox" id="aUrg"><span><b>⚠ Es urgente</b><small>Riesgo de que se vaya, problema grave, reclamo fuerte… Sale primero en el resumen del viernes.</small></span></label>
    <p class="err" id="aErr"></p>
    <div class="btns"><button class="b" onclick="closeSheet()">Cancelar</button><button class="b p" id="aSave" onclick="guardarNota('${p ? esc(p.id) : ''}')">Guardar</button></div>`);
}
async function guardarNota(id, editId){
  const txt = $('aTxt').value.trim(), err = $('aErr');
  if(!txt){ err.textContent = 'Escribí qué pasó.'; err.style.display = 'block'; $('aTxt').focus(); return; }
  const urg = $('aUrg').checked;
  let rec;
  if(editId){ const viejo = REGS.find(x => x.id===editId);
    // al corregir, lo que decía antes queda guardado
    const antes = (viejo.antes ? viejo.antes + '\n' : '') + `[${aHoja(new Date())} · ${miNombre()}] decía: ${viejo.texto}`;
    rec = {id:editId, texto:txt, prioridad: urg ? 'urgente' : 'normal', editado: aHoja(new Date()) + ' por ' + miNombre(), antes}; }
  else { const p = id ? BYID[id] : null;
    rec = { id:nid('b'), fecha:aHoja(new Date()), categoria: p ? 'conducta' : 'general', prioridad: urg ? 'urgente' : 'normal',
      internos: p ? p.id : '', nombres: p ? p.nombre : '', cedulas: p ? p.cedula : '', personal:'', texto:txt, operador:miNombre(), email }; }
  const b = $('aSave'); b.disabled = true; b.textContent = 'Guardando…';
  try {
    await guardarFila(HOJA_BIT, rec, editId ? 'Corrigió una nota de la bitácora' : 'Bitácora: ' + (rec.nombres || 'General'), !!editId);
    const i = RAW.reg.findIndex(x => String(x.id)===rec.id); if(i >= 0) RAW.reg[i] = Object.assign({}, RAW.reg[i], rec); else RAW.reg.push(rec);
    closeSheet(); armar(); guardarCache(); toast(urg ? '✓ Guardado como urgente' : '✓ Guardado');
  } catch(e){ err.textContent = errorGuardar(e); err.style.display = 'block'; b.disabled = false; b.textContent = 'Guardar'; }
}
function ver(id){
  const r = REGS.find(x => x.id===id); if(!r) return;
  const puede = !r.sistema && !r.anulado && (isAdmin() || (r.email && r.email===email));
  openSheet(`
    <h2>${esc(quien(r))}</h2><p class="sub">${fDate(r.fecha)}/${r.fecha.getFullYear()} a las ${fTime(r.fecha)} · ${r.sistema ? 'automático' : 'anotó ' + esc(r.operador)}</p>
    ${r.prio==='urgente'?'<span class="tag">⚠ Urgente</span>':''}${r.anulado?`<div class="ayuda" style="margin-top:8px">Nota anulada (${esc(r.anulado)}). Queda guardada pero no cuenta en el resumen.</div>`:''}
    <div class="texto${r.anulado?' tachado':''}">${esc(r.texto)}</div>
    ${r.editado ? `<p class="sub">Corregida: ${esc(r.editado)}</p>` : ''}
    ${r.antes ? `<details class="antes"><summary>Ver lo que decía antes</summary><div>${esc(r.antes)}</div></details>` : ''}
    <p class="err" id="vErr"></p><div id="vDel"></div>
    <div class="btns">${puede ? `<button class="b red" onclick="confirmarAnular('${esc(r.id)}')">Anular</button><button class="b p" onclick="corregir('${esc(r.id)}')">Corregir</button>` : `<button class="b full" onclick="closeSheet()">Cerrar</button>`}</div>`);
}
function corregir(id){
  const r = REGS.find(x => x.id===id);
  openSheet(`
    <h2>Corregir · ${esc(quien(r))}</h2><p class="sub">Lo que decía antes queda guardado.</p>
    <textarea id="aTxt">${esc(r.texto)}</textarea>
    <label class="urgbox"><input type="checkbox" id="aUrg" ${r.prio==='urgente'?'checked':''}><span><b>⚠ Es urgente</b><small>Sale primero en el resumen del viernes.</small></span></label>
    <p class="err" id="aErr"></p>
    <div class="btns"><button class="b" onclick="ver('${esc(r.id)}')">Cancelar</button><button class="b p" id="aSave" onclick="guardarNota('', '${esc(r.id)}')">Guardar cambios</button></div>`);
}
function confirmarAnular(id){ $('vDel').innerHTML = `<div class="confirmar">¿Anular esta nota? No se borra: queda guardada como anulada.<div class="btns"><button class="b" onclick="$('vDel').innerHTML=''">No</button><button class="b red" onclick="anular('${esc(id)}')">Sí, anular</button></div></div>`; }
async function anular(id){
  const rec = {id, anulado: aHoja(new Date()) + ' por ' + miNombre()};
  try { await guardarFila(HOJA_BIT, rec, 'Anuló una nota de la bitácora', true);
    const r = RAW.reg.find(x => String(x.id)===id); if(r) r.anulado = rec.anulado; closeSheet(); armar(); guardarCache(); toast('Nota anulada (queda guardada)'); }
  catch(e){ $('vErr').textContent = errorGuardar(e); $('vErr').style.display = 'block'; }
}

/* ---- REGISTRO: calendario, tocás un día y ves todo lo anotado ---- */
function vRegistro(){
  const hoy = new Date(); if(!V.cal) V.cal = {y:hoy.getFullYear(), m:hoy.getMonth()}; if(!V.dia) V.dia = midnight(hoy).getTime();
  const {y, m} = V.cal, off = (new Date(y, m, 1).getDay() + 6) % 7, nd = new Date(y, m + 1, 0).getDate();
  const MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','setiembre','octubre','noviembre','diciembre'];
  const dias = {}; vivas().forEach(r => { const k = midnight(r.fecha).getTime(); (dias[k] = dias[k] || []).push(r); });
  let g = ['L','M','M','J','V','S','D'].map(d => `<div class="h">${d}</div>`).join('') + '<button class="v" tabindex="-1" aria-hidden="true"></button>'.repeat(off);
  for(let d = 1; d <= nd; d++){ const k = new Date(y, m, d).getTime(), l = dias[k] || [];
    g += `<button class="${k===midnight(hoy).getTime()?'hoy ':''}${k===V.dia?'sel':''}" onclick="V.dia=${k};render()">${d}<i class="${l.length ? (l.some(r=>r.prio==='urgente')?'ur':'si') : ''}"></i></button>`; }
  const sel = (dias[V.dia] || []).slice().sort((a,b) => a.fecha - b.fecha);
  return `
  <div class="ayuda">📅 Tocá un día y ves <b>todo lo que se anotó</b> ese día, de todos. ● hay notas · <span style="color:var(--acc)">●</span> hubo algo urgente.</div>
  <div class="cal">
    <div class="mesh"><button class="ic" onclick="V.cal.m--;if(V.cal.m<0){V.cal.m=11;V.cal.y--}render()" aria-label="Mes anterior">‹</button><h2>${MES[m][0].toUpperCase()+MES[m].slice(1)} ${y}</h2><button class="ic" onclick="V.cal.m++;if(V.cal.m>11){V.cal.m=0;V.cal.y++}render()" aria-label="Mes siguiente">›</button></div>
    <div class="mes">${g}</div>
  </div>
  <div class="paso">${relDay(new Date(V.dia))}${dayDiff(new Date(), new Date(V.dia)) > 1 ? '' : ' · ' + fDate(new Date(V.dia))} <small>${sel.length} nota${sel.length===1?'':'s'}</small></div>
  ${sel.map(r => nota(r, true)).join('') || '<div class="vacio">Ese día no se anotó nada.</div>'}`;
}

/* ---- VIERNES: resumen de la semana para la reunión ---- */
function semanaDatos(){
  const rng = weekRange(V.semana), [s, e] = rng;
  const regs = vivas().filter(r => inRange(r.fecha, rng)).sort((a,b) => a.fecha - b.fecha);
  const urg = regs.filter(r => r.prio==='urgente');
  const resto = regs.filter(r => r.prio!=='urgente');
  const gente = PERS.filter(p => resto.some(r => r.internos.includes(p.id))).sort(porIngreso).map(p => ({p, regs: resto.filter(r => r.internos.includes(p.id))}));
  const general = resto.filter(r => !r.internos.length);
  const sinNada = activos().filter(p => !regs.some(r => r.internos.includes(p.id)));
  return {s, e, regs, urg, gente, general, sinNada};
}
function vViernes(){
  const W = semanaDatos(), enCurso = new Date() >= W.s && new Date() < W.e;
  const linea = r => `<button class="ln" onclick="ver('${esc(r.id)}')"><span>${fDate(r.fecha)} · ${fTime(r.fecha)}</span>${esc(r.texto)}</button>`;
  return `
  <div class="ayuda">🗓️ Lo de la semana <b>de viernes a viernes</b>, para leer en la reunión del cambio de guardia.</div>
  <div class="semana">
    <button onclick="V.semana--;render()" aria-label="Semana anterior">‹</button>
    <div><b>Del ${fDate(W.s)} al ${fDate(W.e)}</b>${enCurso ? '<small>esta semana</small>' : ''}</div>
    <button onclick="V.semana++;render()" ${V.semana >= 0 ? 'disabled' : ''} aria-label="Semana siguiente">›</button>
  </div>
  <button class="b wa full grande" onclick="copiarWA()">📋 Copiar resumen para WhatsApp</button>
  <div class="grp rojo">⚠ Urgente (${W.urg.length})</div>
  ${W.urg.map(r => nota(r, true)).join('') || '<div class="vacio">Nada urgente esta semana.</div>'}
  <div class="grp">Cómo le fue a cada uno</div>
  ${W.gente.map(g => `<div class="bloque"><b>${esc(g.p.nombre)}${g.p.estado!=='Activo' ? ` <span class="est">${esc(g.p.estado)}</span>` : ''}</b>${g.regs.map(linea).join('')}</div>`).join('') || '<div class="vacio">No se anotó nada de los internos esta semana.</div>'}
  ${W.sinNada.length && V.semana===0 ? `<div class="ayuda">Sin nada anotado esta semana: <b>${W.sinNada.map(p => esc(p.nombre)).join(', ')}</b>.</div>` : ''}
  <div class="grp">🏠 General</div>
  ${W.general.length ? `<div class="bloque">${W.general.map(linea).join('')}</div>` : '<div class="vacio">Sin novedades generales.</div>'}`;
}
function textoWA(){
  const W = semanaDatos(), corto = n => shortName(n), clip = t => t.length > 220 ? t.slice(0,217).trimEnd() + '…' : t;
  const q = r => r.internos.length ? r.internos.map(id => corto(BYID[id].nombre)).join(', ') : 'General';
  const L = [`*ALAS DE LIBERTAD · BITÁCORA*`, `Semana del ${fDate(W.s)} al ${fDate(W.e)}`, ''];
  L.push('⚠ *URGENTE*'); W.urg.forEach(r => L.push(`• *${q(r)}* (${fDate(r.fecha)}): ${clip(r.texto)}`)); if(!W.urg.length) L.push('• Nada urgente.');
  L.push('', '👥 *CÓMO LE FUE A CADA UNO*'); W.gente.forEach(g => { L.push(`*${corto(g.p.nombre)}*`); g.regs.forEach(r => L.push(`– ${fDate(r.fecha)}: ${clip(r.texto)}`)); }); if(!W.gente.length) L.push('• Sin novedades.');
  L.push('', '🏠 *GENERAL*'); W.general.forEach(r => L.push(`• ${fDate(r.fecha)}: ${clip(r.texto)}`)); if(!W.general.length) L.push('• Sin novedades.');
  return L.join('\n');
}
async function copiarWA(){
  const t = textoWA(); let ok = false;
  try { await navigator.clipboard.writeText(t); ok = true; } catch(e){}
  if(ok){ toast('✓ Copiado. Pegalo en el grupo de WhatsApp.'); return; }
  openSheet(`<h2>Resumen</h2><p class="sub">Mantené apretado el texto, elegí "Seleccionar todo" y "Copiar".</p><textarea readonly style="min-height:360px;font-size:14px">${esc(t)}</textarea><div class="btns"><button class="b full" onclick="closeSheet()">Cerrar</button></div>`);
}

/* ---- menú del usuario ---- */
let instalar = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); instalar = e; });
window.addEventListener('appinstalled', () => { instalar = null; toast('Bitácora instalada'); });
function abrirMenu(){
  openSheet(`
    <h2>Tu usuario</h2><p class="sub">${esc(email)}${role ? ' · ' + esc(role) : ''}</p>
    <div class="lbl">Tu nombre en las notas</div>
    <div class="nuevo"><input id="mNom" value="${esc(miNombre())}" maxlength="40"><button class="b p" onclick="guardarNombre()">Guardar</button></div>
    <div style="display:grid;gap:8px;margin-top:18px">
      ${instalar ? `<button class="b full" onclick="instalarApp()">📲 Instalar en este celular</button>` : ''}
      <button class="b full" onclick="closeSheet();cargar().then(()=>toast('Actualizado')).catch(e=>estado('No se pudo actualizar: '+e.message,true))">⟳ Actualizar</button>
      <a class="b full" data-pasa href="https://reboirasnicolas4-dev.github.io/registro-k7x2/">Ir a Internos</a>
      <button class="b full red" onclick="salir()">Salir</button>
    </div>`);
}
function guardarNombre(){ const v = $('mNom').value.trim(); if(!v) return; try { localStorage.setItem('alas-bit-nombre', v); } catch(e){} closeSheet(); render(); toast('Vas a figurar como ' + v); }
async function instalarApp(){ if(!instalar) return; instalar.prompt(); try { await instalar.userChoice; } catch(e){} instalar = null; closeSheet(); }
function salir(){ closeSheet(); cerrarSesion(); email=''; role=''; RAW.int=[]; RAW.egr=[]; RAW.reg=[]; RAW.tar=[]; PERS=[]; REGS=[]; TAR=[]; $('lmsg').textContent=''; mostrar(false); modoSetup(false); }

function openSheet(html){ $('sheet').innerHTML = html; $('sheetWrap').hidden = false; document.body.style.overflow = 'hidden'; }
function closeSheet(){ $('sheetWrap').hidden = true; document.body.style.overflow = ''; }
document.addEventListener('keydown', e => { if(e.key==='Escape') closeSheet(); });
function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(window._tt); window._tt = setTimeout(() => el.classList.remove('show'), 2600); }
/* ============ Ingreso (igual que Internos y Cuartos) ============ */
function modoSetup(on, codigo){ $('setup').hidden = !on; $('pwrow').hidden = on; $('coderow').hidden = !(on && codigo); if(!on) $('ncode').value = '';
  $('ltxt').textContent = on ? (codigo ? 'Escribí el código que te pasaron y elegí tu contraseña nueva.' : 'Es tu primera vez: elegí una contraseña para tu usuario.') : 'Ingresá con el mismo correo y contraseña de la app de Internos.';
  $('lbtn').textContent = on ? 'Crear contraseña e ingresar' : 'Ingresar'; }
$('lf').addEventListener('submit', async e => {
  e.preventDefault(); email = $('em').value.trim().toLowerCase(); $('lmsg').textContent = '';
  const setup = !$('setup').hidden; $('lbtn').disabled = true;
  try {
    if(setup){ const a = $('np1').value, b = $('np2').value;
      if(!$('coderow').hidden && !/^\d{6}$/.test($('ncode').value.trim())){ $('lmsg').textContent = 'Escribí el código de 6 números que te pasaron.'; return; }
      if(a.length < 6){ $('lmsg').textContent = 'La contraseña tiene que tener al menos 6 caracteres.'; return; }
      if(a !== b){ $('lmsg').textContent = 'Las dos contraseñas no coinciden.'; return; }
      pass = ''; token = ''; const r = await api({action:'setPassword', newPassword:a, code:$('ncode').value.trim()});
      if(!r || r.ok!==true){ $('lmsg').textContent = (r && r.error) || 'No se pudo guardar la contraseña.'; return; }
      if(r.token){ token = r.token; pass = ''; } else pass = a; modoSetup(false);
    } else { token = ''; pass = $('pw').value; }
    const res = await api({action:'checkUser'});
    if(res && res.token){ token = res.token; pass = ''; }
    if(res && res.needsSetup){ modoSetup(true, res.needsCode); return; }
    if(!res || !res.allowed){ $('lmsg').textContent = (res && res.error) || 'Ese correo no está autorizado.'; return; }
    role = String(res.role||'');
    try { localStorage.setItem('internos-email', email); } catch(x){} guardarSesion();
    $('pw').value = ''; mostrar(true); render(); await cargar();
  } catch(err){ $('lmsg').textContent = 'No se pudo conectar con la hoja (' + err.message + '). Probá de nuevo.'; }
  finally { $('lbtn').disabled = false; if($('setup').hidden) $('lbtn').textContent = 'Ingresar'; }
});
try { $('em').value = localStorage.getItem('internos-email') || ''; localStorage.removeItem('internos-pw'); if(localStorage.getItem('alas-token')) $('rec').checked = true; const su = localStorage.getItem('internos-api'); if(su) API = su; } catch(e){}
(async()=>{
  const fin = () => $('splash').hidden = true;
  const ses = sesionGuardada();
  if(!ses || !ses.email || !ses.token){ mostrar(false); fin(); return; }
  email = ses.email; token = ses.token || ''; pass = '';
  const cache = leerCache(email);
  if(cache){ soloCopia = true; role = String(cache.role||''); mostrar(true); try { armar(...cache.d); } catch(x){} fin();
    try { await cargar(); guardarSesion(); }
    catch(e){ soloCopia = true; render(); if(token){ const h = new Date(cache.t); estado('Google no contesta: se ve lo guardado a las '+fTime(h)+'. Tocá tu nombre → Actualizar.', true); } }
    return; }
  try { mostrar(true); render(); await cargar();
    if(!role){ const res = await api({action:'checkUser'});
      if(!res || !res.allowed){ const t = res && res.error; borrarSesion(); token=''; email=''; mostrar(false); if(t) $('lmsg').textContent = t; return; }
      role = String(res.role||''); render(); }
    guardarSesion();
  } catch(e){ if(token) estado('No se pudo cargar: '+e.message+'. Tocá tu nombre → Actualizar.', true); }
  finally { fin(); }
})();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
