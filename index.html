<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16120e">
<meta name="robots" content="noindex">
<title>Bitácora · Alas de Libertad</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="bloqueo.js?v=2"></script>
<link rel="icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#16120e;--card:#211b15;--card2:#2b241d;--line:#3a3027;--ink:#f0e8da;--mut:#b3a99b;--acc:#f7a823;--accx:#281a08;--soft:#3a2a12;
  --urg:#ff7a5c;--fam:#a9a3ff;--int:#7fcf8f;--com:#e0b26a}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15.5px/1.4 "Hanken Grotesk",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;padding:0 14px 120px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:14px 0 10px}
.logo{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 60% 40%,#ffb43a,#e2531c 60%,#2a1206 62%);flex:none}
.top h1{font:700 26px Fraunces,serif;margin:0;line-height:1}.top small{display:block;color:var(--mut);font-size:12.5px;margin-top:3px}
.tag{font-size:10.5px;font-weight:700;color:var(--accx);background:var(--acc);border-radius:99px;padding:1px 7px;letter-spacing:.03em}
.ayuda{border:1px dashed #6a4a16;background:#241a0e;border-radius:12px;padding:9px 12px;font-size:13.5px;line-height:1.45;color:#f3d9a8;margin-bottom:12px}
.grp{font-size:11.5px;font-weight:700;letter-spacing:.07em;color:var(--mut);margin:18px 2px 7px;text-transform:uppercase;display:flex;gap:6px;align-items:center}
.grp.u{color:var(--urg)}
.vacio{text-align:center;color:var(--mut);padding:22px 10px;border:1px dashed var(--line);border-radius:14px;font-size:14.5px}
/* filtros */
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -14px 10px;padding:0 14px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 12px;font-size:13.5px;font-weight:600;color:var(--mut)}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--accx)}
/* tarjeta de nota (muro) */
.n{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.n.urg{background:linear-gradient(90deg,#2e1a14,var(--card) 65%);border-color:#5a2a1e;border-left-color:var(--urg)}
.n-h{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.n-h b{font-size:15px}
.t{font-size:11.5px;font-weight:700;border-radius:99px;padding:1px 8px;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent)}
.hora{margin-left:auto;color:var(--mut);font-size:12.5px}
.n p{margin:5px 0 3px;white-space:pre-line;font-size:15px}
.n small{color:var(--mut);font-size:12px}
.n.anul{opacity:.5}.n.anul p{text-decoration:line-through}
/* botón flotante gigante */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:74px;width:min(532px,calc(100% - 28px));padding:16px;border-radius:16px;border:0;background:var(--acc);color:var(--accx);font:700 17px "Hanken Grotesk",sans-serif;box-shadow:0 10px 30px #000a;z-index:6}
/* barra de abajo */
.nav{position:fixed;left:0;right:0;bottom:0;background:#120f0c;border-top:1px solid var(--line);display:flex;justify-content:center;padding:7px 6px 10px;z-index:6}
.nav button{position:relative;flex:1;max-width:140px;background:none;border:0;color:var(--mut);font:600 11.5px "Hanken Grotesk",sans-serif}
.nav button i{display:block;font-style:normal;font-size:19px;line-height:28px;width:52px;margin:0 auto 2px;border-radius:99px}
.nav button.on{color:var(--ink)}.nav button.on i{background:#3a2c18}
.badge{position:absolute;top:-3px;left:calc(50% + 12px);background:var(--urg);color:#1b0d09;font-size:11px;font-weight:700;border-radius:99px;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center}
/* internos */
.sync{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px;font-size:13.5px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--int);box-shadow:0 0 0 4px #1d3322;flex:none}
.sync div{flex:1;line-height:1.3}.sync span{color:var(--mut)}
.srch{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px;margin-bottom:10px}
.srch input{flex:1;background:none;border:0;outline:none;padding:11px 0;color:var(--ink)}
.f{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:7px;color:var(--ink)}
.f .x{flex:1;min-width:0}.f b{display:block;font-size:15.5px}
.f small{display:block;color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.f .cnt{font-size:12px;color:var(--mut);text-align:right;white-space:nowrap}.f .cnt b{font-size:15px;color:var(--ink)}
.f .pu{width:9px;height:9px;border-radius:50%;background:var(--urg);flex:none}
.ini{width:38px;height:38px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13.5px;color:var(--acc);flex:none}
.b{background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:12px 10px;font-weight:600;font-size:14.5px;text-align:center;width:100%}
.b.p{background:var(--acc);border-color:var(--acc);color:var(--accx);font-weight:700}
.b.wa{background:#1f6b3d;border-color:#2f8a52;color:#fff;font-weight:700}
.b.s{background:transparent;color:var(--mut)}
.b:disabled{opacity:.45}
/* viernes */
.sem{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;text-align:center}
.sem b{font:700 18px Fraunces,serif;display:block}.sem span{color:var(--mut);font-size:13px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.kp div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 10px}.kp b{font:700 22px Fraunces,serif;display:block}.kp span{font-size:12px;color:var(--mut)}
.bl{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.bl>b{display:block;font-size:15px;margin-bottom:2px}
.ln{border-top:1px solid var(--line);padding:7px 0;font-size:14.5px}.bl>b+.ln,.bl>.ln:first-child{border-top:0}
.ln span{color:var(--mut);font-size:12px;display:block}
/* panel (hoja de abajo) */
.sheet-wrap{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;z-index:9}.backdrop{position:absolute;inset:0;background:#000b}
.sh{position:relative;background:var(--card);border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:16px 16px 22px;border-top:1px solid var(--line);animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.shh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.shh h2{flex:1;margin:0;font:700 22px Fraunces,serif;line-height:1.15}.shh h2 small{display:block;font:500 13px "Hanken Grotesk",sans-serif;color:var(--mut);margin-top:2px}
.xx{width:38px;height:38px;border-radius:12px;background:var(--card2);border:1px solid var(--line);color:var(--mut)}
.paso{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--mut);text-transform:uppercase;margin:14px 0 7px;display:flex;gap:6px;align-items:center}
.paso i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--soft);color:var(--acc);display:grid;place-items:center;font-size:11.5px}
.quien{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.op{background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:10px 6px;font-weight:600;font-size:14px;color:var(--mut)}
.op.on{border-color:var(--acc);color:var(--ink);background:var(--soft)}
.lista{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;max-height:150px;overflow-y:auto}
.nm{background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:7px 12px;font-size:14px;color:var(--ink)}
.nm.on{background:var(--acc);border-color:var(--acc);color:var(--accx);font-weight:700}
.tipos{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tp{background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:11px 8px;font-weight:700;font-size:14.5px;color:var(--mut);text-align:left;display:flex;gap:8px;align-items:center}
.tp.on{border-color:var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--card2))}
.txt{position:relative}
textarea{width:100%;min-height:120px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 50px 12px 12px;font-size:16px;color:var(--ink);outline:none;resize:vertical}
textarea:focus{border-color:var(--acc)}
.mic{position:absolute;right:8px;top:8px;width:38px;height:38px;border-radius:50%;background:var(--soft);border:1px solid #6a4a16;font-size:17px}
.mic.on{background:var(--urg);border-color:var(--urg);animation:pl 1s infinite}
@keyframes pl{50%{opacity:.6}}
.hist{margin-top:18px;border-top:1px solid var(--line);padding-top:4px}
.toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%) translateY(10px);background:#f0e8da;color:#1b140d;padding:10px 16px;border-radius:12px;font-weight:600;z-index:20;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translateX(-50%)}
.sel{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px;color:var(--ink);margin-top:8px}
.dia{font-size:11.5px;font-weight:700;letter-spacing:.07em;color:var(--mut);margin:16px 2px 7px;text-transform:uppercase}

/* extras de la app real */
.n{display:block;width:100%;text-align:left;color:var(--ink);font:inherit}
.top img{width:44px;height:44px;object-fit:contain}
.me{border:0;background:none;padding:0}
.av{width:38px;height:38px;border-radius:50%;background:var(--card2);border:1px solid var(--line);color:var(--acc);display:grid;place-items:center;font-weight:700;font-size:14px}
.estado{max-width:560px;margin:0 auto 8px;background:var(--soft);border:1px solid var(--acc);border-radius:12px;font-size:14px;padding:9px 12px;text-align:center}
.estado.err{border-color:var(--urg);color:var(--urg);background:#2a1512}
.b.grande{padding:15px;font-size:16px;margin-top:12px}.b.red{color:var(--urg)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.err{color:var(--urg);font-weight:600;font-size:14px;margin:8px 2px 0;display:none}
.texto{white-space:pre-line;font-size:16px;line-height:1.5;background:var(--card2);border-radius:14px;padding:13px}
.antes{margin-top:10px;font-size:13.5px;color:var(--mut)}.antes summary{cursor:pointer;color:var(--acc);font-weight:600}.antes div{white-space:pre-line;background:var(--card2);border-radius:10px;padding:10px;margin-top:6px}
.confirmar{background:#2a1512;border:1px solid #6a2c20;border-radius:12px;padding:12px;margin-top:12px;font-size:14.5px}
.nota{color:var(--mut);font-size:13.5px;margin:8px 2px}
.otro{width:100%;margin-top:8px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);outline:none}
.sem{display:flex;align-items:center;gap:8px}.sem>div{flex:1}.sem button{width:42px;height:42px;border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:12px;font-size:19px}.sem button:disabled{opacity:.3}
.sem span{display:block}
.hecha{background:#16261a;border:1px solid #2f4a35;color:var(--int);border-radius:12px;padding:9px 12px;font-weight:600;font-size:14px;margin-bottom:10px;text-align:center}
.ln{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);color:var(--ink);font:inherit;font-size:14.5px}
.f .fl{color:var(--mut);font-size:22px}
.est{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--mut);font-weight:600}
.nuevo{display:flex;gap:8px}.nuevo input{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--ink);outline:none}
a.b{display:block}
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center}
.sp-in{display:flex;flex-direction:column;align-items:center;gap:6px}.sp-in b{font:700 20px Fraunces,serif}.sp-in small{color:var(--mut)}.sp-in img{width:80px;height:80px;object-fit:contain}
#login{min-height:100vh;display:grid;place-items:center;padding:20px 18px}
.lg-box{width:100%;max-width:380px}
.lg-brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;margin-bottom:6px}
.lg-brand img{width:64px;height:64px;object-fit:contain}.lg-brand small{color:var(--mut);font-size:14px}.lg-brand h1{margin:0;font:700 30px Fraunces,serif}
#ltxt{text-align:center;color:var(--mut)}
.lg-form{display:grid;gap:12px}.lg-form label{display:grid;gap:5px;font-size:13px;color:var(--mut)}
.inp{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;color:var(--ink);outline:none;color-scheme:dark}
.lg-rec{display:flex!important;align-items:center;gap:10px;font-size:14px!important}.lg-rec input{width:20px;height:20px;accent-color:var(--acc)}
.btn{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:13px;font-weight:700;color:var(--ink)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--accx)}
.muted{color:var(--mut)}.soft{color:var(--mut)}
.avisos{background:var(--soft);border:1px solid var(--acc);border-radius:14px;padding:12px;margin-bottom:12px}
.avisos b{display:block;font-size:15.5px;color:var(--acc)}.avisos span{display:block;color:#f3d9a8;font-size:13.5px;margin-top:3px}.avisos .btns{margin-top:10px}
.egr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}.egr div{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 10px}.egr span{display:block;font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;font-weight:700}.egr b{font-size:15px}
.tipos.t3{grid-template-columns:repeat(3,1fr)}.tipos.t3 .tp{flex-direction:column;align-items:center;gap:3px;padding:12px 4px;text-align:center}.tipos.t3 .tp span{font-size:20px}
.badge.bn{background:var(--acc);color:var(--accx)}
.nueva{display:flex;gap:8px;margin-bottom:6px}.nueva input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--ink);outline:none;font-size:15.5px}.nueva input:focus{border-color:var(--acc)}.nueva .b{width:auto;padding:12px 16px}
.tarea{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:7px}
.tarea.hecha{opacity:.45;background:transparent}.tarea.hecha b{text-decoration:line-through}
.chk{position:relative;flex:none;width:30px;height:30px}.chk input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chk span{display:block;width:30px;height:30px;border-radius:9px;border:2px solid var(--mut);background:var(--card2)}
.chk input:checked+span{background:var(--int);border-color:var(--int)}.chk input:checked+span::after{content:'✓';display:grid;place-items:center;height:100%;color:#10210f;font-weight:800;font-size:18px}
.tt{flex:1;min-width:0;background:none;border:0;text-align:left;color:var(--ink);padding:0}.tt b{display:block;font-size:15.5px;font-weight:600}.tt small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
body.confab .app{padding-bottom:190px}
.filtros{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin-bottom:12px}
.fi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 2px 6px;font:600 11.5px "Hanken Grotesk",sans-serif;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi span{font-size:17px;line-height:1.1}
.fi.on{background:var(--acc);border-color:var(--acc);color:var(--accx)}
.fab{left:auto;right:max(16px,calc((100vw - 560px)/2 + 16px));transform:none;width:auto;bottom:82px;padding:13px 20px 13px 16px;border-radius:99px;font:700 15.5px "Hanken Grotesk",sans-serif;display:flex;align-items:center;gap:6px;box-shadow:0 6px 18px #000b}
.fab b{font-size:22px;line-height:1;font-weight:700}
body.confab .app{padding-bottom:150px}
.quien.q2{grid-template-columns:1fr 1fr}
.filtros.f4{grid-template-columns:repeat(4,minmax(0,1fr))}
.busca{display:flex;gap:8px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.busca:focus-within{border-color:var(--acc)}.busca input{flex:1;min-width:0;background:none;border:0;outline:none;padding:12px 0;color:var(--ink);font-size:16px}
.bres{margin-top:6px;display:grid;gap:5px}.bres .nota{margin:4px 2px}
.res1{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--ink);font-size:15.5px;font-weight:600}
.res1:active{border-color:var(--acc);background:var(--soft)}
.elegido{display:flex;align-items:center;gap:10px;background:var(--soft);border:1px solid var(--acc);border-radius:12px;padding:9px 10px 9px 12px}
.elegido b{flex:1;font-size:16px}.elegido button{background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:7px 12px;font-weight:600;font-size:13.5px}
.pend{color:var(--acc);font-weight:600}
.tarea .hecho{flex:none;background:#16261a;border:1px solid #2f6b3d;color:var(--int);border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px}
.tarea .hecho:active{background:var(--int);color:#10210f}
.tarea .deshacer{flex:none;background:none;border:1px solid var(--line);color:var(--mut);border-radius:12px;padding:8px 10px;font-weight:600;font-size:12.5px}
.tarea.hecha{opacity:1}.tarea.hecha .tt{opacity:.45}

.tarea .hecho:disabled,.tarea .deshacer:disabled{opacity:.5}
.toast.conbtn{pointer-events:auto;display:flex;align-items:center;gap:14px}.toast button{background:#1b140d;color:#f0e8da;border:0;border-radius:9px;padding:7px 12px;font-weight:700}
.anular-conf{text-align:center;padding:6px 2px}.anular-conf .ic{font-size:40px;margin-bottom:4px}.anular-conf h2{margin:0 0 12px;font-size:20px}.anular-conf .texto{text-align:left}
.anular-conf .btns .b{padding:15px 10px;font-size:16px}
.b:active,.tt:active{transform:scale(.96)}.b{transition:transform .08s}
.gira{display:inline-block;width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:gira .7s linear infinite;vertical-align:-2px}@keyframes gira{to{transform:rotate(360deg)}}
.tarea.anulando{background:#2a1512;border-color:#6a2c20;transition:opacity .9s,transform .9s}.tarea.anulando b{text-decoration:line-through;color:#e9a99a}.tarea.anulando small{color:#ff9a85;font-weight:700}
.tarea.anulando.fuera{opacity:.35;transform:translateX(30px)}

<script>
const APP_VER = "20261119223302";
/* ============================================================
   Bitácora · Alas de Libertad
   - Los internos NO se cargan acá: vienen de Base_Internos (pestañas "Internos" y "Egresados")
     por el mismo Apps Script de la app de Internos, y se actualizan solos en tiempo real (Firebase).
   - Lo que se anota en la bitácora se guarda en la pestaña "Bitacora" y las tareas en "Tareas Bitacora".
   ============================================================ */
const DEFAULT_API = "https://script.google.com/macros/s/AKfycbzYLuWCtvRv-sQobVzwXxUhTbjfhDuul9raoOD4RbxFOkBVaPI5FLEOU4TI5z3pQl9_/exec";
let API = DEFAULT_API;
const MED_API = "https://script.google.com/macros/s/AKfycbzYithfRv1aTYL1CrPeYHpAcq7XccGY3Gm7Bvlb56aCn65ZlT-FS7a6ePZ7-OumAz5LRw/exec"; // app de Médicos
const HOJA_BIT = "Bitacora", HOJA_TAR = "Tareas Bitacora", HOJA_EGR = "Egresados";
const DUR_MESES = 9;

/* ============ Utilidades ============ */
const DAY = 864e5;
const DN = ['dom','lun','mar','mié','jue','vie','sáb'];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const D = x => x instanceof Date ? x : new Date(x);
const fDate = x => { const d = D(x); return `${DN[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth()+1)}`; };
const fDateY = x => { if(!x) return '—'; const d = D(x); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`; };
const fTime = x => { const d = D(x); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const midnight = x => { const d = new Date(D(x)); d.setHours(0,0,0,0); return d; };
const dayDiff = (a,b) => Math.round((midnight(a)-midnight(b))/DAY);
function relDay(x){ const k = dayDiff(new Date(), x); if(k===0) return 'Hoy'; if(k===1) return 'Ayer'; return fDate(x); }
function toLocalInput(x){ const d = D(x); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
const aHoja = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
function toISO(v){ v = String(v||'').trim(); if(/^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0,10); const m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); return m ? m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0') : ''; }
// "2026-11-18 15:20", "2026-11-18" o ISO -> Date local
function fechaDe(v){ v = String(v||'').trim(); const m = v.match(/^(\d{4})-(\d{2})-(\d{2})(?:[ T](\d{1,2}):(\d{2}))?/); if(m) return new Date(+m[1], +m[2]-1, +m[3], +(m[4]||0), +(m[5]||0)); const d = new Date(v); return isNaN(d) ? new Date(0) : d; }
const diaLocal = s => s ? fechaDe(s) : null;
function durTxt(from, to=new Date()){ const d = Math.max(0, dayDiff(to, from)); if(d < 31) return `${d} días`; const m = Math.floor(d/30.44); return m===1 ? '1 mes' : `${m} meses`; }
function mesDe(ing){ const d = Math.max(0, dayDiff(new Date(), ing)); return Math.min(DUR_MESES, Math.floor(d/30.44)+1); }
function lastFriday(ref = new Date()){ const d = new Date(ref); d.setHours(10,0,0,0); d.setDate(d.getDate() - ((d.getDay()-5+7)%7)); if(d > ref) d.setDate(d.getDate()-7); return d; }
const shortName = n => { const p = String(n).trim().split(/\s+/); return p.length>1 ? `${p[0]} ${p[p.length-1][0]}.` : String(n); };
const initials = n => String(n).trim().split(/\s+/).map(w=>w[0]||'').slice(0,2).join('').toUpperCase();
const normCed = c => String(c||'').replace(/\D/g,'');
const nid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const lista = (s, sep=',') => String(s||'').split(sep).map(x=>x.trim()).filter(Boolean);

const CATS = {
  conducta:{label:'Evolución / Conducta', short:'Conducta', icon:'🧭', color:'var(--c-conducta)', hint:'Crisis, desmotivación, intención de abandono, avances'},
  familia:{label:'Contacto familiar / externo', short:'Familia', icon:'📞', color:'var(--c-familia)', hint:'Llamadas, reclamos, visitas'},
  equipo:{label:'Incidencia de equipo', short:'Equipo', icon:'🤝', color:'var(--c-equipo)', hint:'Conflictos, trato hacia internos, alertas legales'},
  general:{label:'Novedad general', short:'General', icon:'🏠', color:'var(--c-general)', hint:'Mantenimiento, convivencia, insumos'}
};
const PRIOS = {normal:'Normal', importante:'Importante', urgente:'Urgente / Delicado'};
const TSTATE = {pendiente:'Pendiente', proceso:'En proceso', hecho:'Hecho'};
const estCls = e => /termin|derivad|finaliz|egresad/i.test(e) ? 'ok' : /(fue|estall|abandon|fuga)/i.test(e) ? 'bad' : 'neu';

/* ============ Estado ============ */
let email = "", pass = "", role = "", token = "", soloCopia = false;
const isAdmin = () => /admin/i.test(role) && !soloCopia;
const RAW = {int:[], egr:[], reg:[], tar:[], med:[]};
let MED = [];
let PERS = [], BYID = {}, REGS = [], TAR = [];
const S = { view:'bitacora', filtro:'todos', q:'', intTab:'activos', intSel:null, intCat:'todos', intQ:'', weekOffset:0, tFiltro:'abiertas', form:null, task:null, wa:{equipo:false, abrev:true, tareas:true}, ocupado:false };

function miNombre(){ try { const n = localStorage.getItem('alas-bit-nombre'); if(n) return n; } catch(e){} const u = email.split('@')[0] || 'Usuario'; return u.charAt(0).toUpperCase()+u.slice(1); }
// Siempre por fecha de ingreso: el que más tiempo lleva en la casa, primero
const porIngreso = (a,b) => (a.ingreso ? +a.ingreso : 9e15) - (b.ingreso ? +b.ingreso : 9e15) || a.nombre.localeCompare(b.nombre,'es');
const activos = () => PERS.filter(p => p.estado==='Activo').sort(porIngreso);
const bajas = () => PERS.filter(p => p.estado!=='Activo').sort((a,b)=>(b.baja?+b.baja:0)-(a.baja?+a.baja:0));
function weekRange(offset){ const F = lastFriday(); const s = new Date(F.getTime()+offset*7*DAY); return [s, new Date(s.getTime()+7*DAY)]; }
const inRange = (x,[s,e]) => { const t = D(x); return t>=s && t<e; };

/* ============ Armar los datos que vienen de la planilla ============ */
function armar(int, egr, reg, tar, med){
  if(Array.isArray(med)) RAW.med = med;
  if(Array.isArray(int)) RAW.int = int; if(Array.isArray(egr)) RAW.egr = egr; if(Array.isArray(reg)) RAW.reg = reg; if(Array.isArray(tar)) RAW.tar = tar;
  const act = RAW.int.filter(o => String(o.nombre||'').trim()).map(o => ({
    id:String(o.id||''), nombre:String(o.nombre).trim(), cedula:String(o.cedula||''), ingreso:diaLocal(toISO(o.ingreso)), tipo:String(o.tipo||''), estado:'Activo', baja:null }));
  const actIds = new Set(act.map(p=>p.id)), actCed = new Set(act.map(p=>normCed(p.cedula)).filter(Boolean));
  const egMap = new Map();
  RAW.egr.filter(o => String(o.nombre||'').trim()).forEach(o => {
    const p = { id:String(o.id || ('egr-'+(normCed(o.cedula) || o._fila))), nombre:String(o.nombre).trim(), cedula:String(o.cedula||''), ingreso:diaLocal(toISO(o.fechadeingreso)),
      tipo:String(o.tipo||''), estado:String(o.motivo||'').trim() || 'Egresado', baja:diaLocal(toISO(o.fechadeegreso)), nota:String(o.nota||'') };
    if(actIds.has(p.id) || (p.cedula && actCed.has(normCed(p.cedula)))) return; // volvió a ingresar: cuenta como activo
    const k = normCed(p.cedula) || p.id, ya = egMap.get(k);
    if(!ya || (p.baja && (!ya.baja || p.baja > ya.baja))) egMap.set(k, Object.assign(p, {otrosIds: ya ? [ya.id, ...(ya.otrosIds||[])] : []}));
  });
  PERS = [...act, ...egMap.values()];
  BYID = {}; PERS.forEach(p => { BYID[p.id] = p; (p.otrosIds||[]).forEach(x => BYID[x] = BYID[x] || p); });
  const byCed = {}; PERS.forEach(p => { const c = normCed(p.cedula); if(c && (!byCed[c] || p.estado==='Activo')) byCed[c] = p; });

  REGS = RAW.reg.filter(o => o.id).map(o => {
    const ids = lista(o.internos), noms = lista(o.nombres,'|'), ceds = lista(o.cedulas);
    const internos = ids.map((id,k) => {
      if(BYID[id]) return BYID[id].id;
      const c = normCed(ceds[k]); if(c && byCed[c]) return byCed[c].id;
      // ya no está en Internos ni en Egresados (por ejemplo, se borró la fila): se conserva con el nombre guardado
      const p = {id, nombre: noms[k] || 'Sin nombre', cedula: ceds[k]||'', ingreso:null, tipo:'', estado:'Sin datos en Internos', baja:null, fantasma:true};
      PERS.push(p); BYID[id] = p; return id;
    });
    return { id:String(o.id), fecha:fechaDe(o.fecha), cat: CATS[o.categoria] ? o.categoria : 'general', prio: PRIOS[o.prioridad] ? o.prioridad : 'normal',
      internos, nombres:noms, cedulas:ceds, personal:String(o.personal||''), texto:String(o.texto||''), operador:String(o.operador||''), email:String(o.email||''),
      editado:String(o.editado||''), anulado:String(o.anulado||''), antes:String(o.antes||''), categoria:String(o.categoria||''), quienTipo:String(o.quien||''), _pend:!!o._pend, _fila:o._fila };
  }).sort((a,b)=>b.fecha-a.fecha);
  // Bajas: una línea automática en la bitácora el día del egreso (no se guarda, se arma de la pestaña Egresados)
  bajas().filter(p=>!p.fantasma && p.baja).forEach(p => REGS.push({ id:'egr:'+p.id, fecha:new Date(p.baja.getFullYear(),p.baja.getMonth(),p.baja.getDate(),8,0), cat:'conducta', prio:'urgente',
    internos:[p.id], nombres:[p.nombre], cedulas:[p.cedula], personal:'', operador:'App de Internos', email:'', sistema:true,
    texto:`Egreso registrado en la app de Internos (motivo: ${p.estado})${p.nota?'. Nota: '+p.nota:''}. Sale de la lista de activos; sus registros quedan guardados.` }));
  REGS.sort((a,b)=>b.fecha-a.fecha);

  // Turnos de la app de Médicos: se unen a cada persona por el nombre
  const kN = x => String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
  const porNombre = {}; PERS.forEach(p => { const k = kN(p.nombre); if(!porNombre[k] || p.estado==='Activo') porNombre[k] = p; });
  MED = RAW.med.filter(t => t && t.interno && /^\d{4}-\d{2}-\d{2}/.test(String(t.fecha||''))).map(t => {
    const d = fechaDe(String(t.fecha).slice(0,10) + (/^\d{1,2}:\d{2}/.test(String(t.hora||'')) ? ' ' + String(t.hora).slice(0,5) : ''));
    const p = porNombre[kN(t.interno)];
    return { id:String(t.id||''), nombre:String(t.interno).trim(), pid: p ? p.id : '', fecha:d, hora:/^\d{1,2}:\d{2}/.test(String(t.hora||'')) ? String(t.hora).slice(0,5) : '',
      lugar:String(t.lugar||''), esp:String(t.especialidad||''), estado:String(t.estado||'pendiente') };
  }).sort((a,b) => a.fecha - b.fecha);
  TAR = RAW.tar.filter(o => o.id && String(o.titulo||'').trim()).map(o => ({ id:String(o.id), titulo:String(o.titulo), estado: TSTATE[o.estado] ? o.estado : 'pendiente',
    resp:String(o.responsable||''), limite:toISO(o.limite), origen:String(o.origen||''), creada:String(o.creada||''), creadapor:String(o.creadapor||''), hecha:String(o.hecha||''), anulado:String(o.anulado||''), _pend:!!o._pend, _fila:o._fila }));

  const nombres = new Set([miNombre()]);
  REGS.forEach(r => { if(r.personal) nombres.add(r.personal); if(r.operador && !r.sistema) nombres.add(r.operador); });
  TAR.forEach(t => t.resp && nombres.add(t.resp)); nombres.add('Coordinación');
  $('dlPersonas').innerHTML = [...nombres].sort((a,b)=>a.localeCompare(b,'es')).map(n=>`<option value="${esc(n)}">`).join('');
  if(S.intSel && !BYID[S.intSel]) S.intSel = null;
  render();
}

/* ============ Sesión (igual que Internos y Cuartos: se guarda un código, nunca la contraseña) ============ */
function credenciales(){ return token ? {email, token} : {email, password:pass}; }
function guardarSesion(){ try { const rec = $('rec').checked;
  if(rec && token) localStorage.setItem('alas-token', JSON.stringify({email, token})); else localStorage.removeItem('alas-token');
  localStorage.removeItem('internos-pw'); sessionStorage.removeItem('alas-sesion'); } catch(x){} }
function pasarSesion(){ try { if(token) sessionStorage.setItem('alas-paso', JSON.stringify({email, token, t:Date.now()})); } catch(x){} }
function sesionGuardada(){ try { const p = JSON.parse(sessionStorage.getItem('alas-paso')||'null'); sessionStorage.removeItem('alas-paso'); sessionStorage.removeItem('alas-sesion');
  if(p && p.token && Date.now()-p.t < 60000) return p; return JSON.parse(localStorage.getItem('alas-token')||'null'); } catch(x){ return null; } }
function borrarSesion(){ try { ['alas-cache','alas-cache-cuartos','alas-cache-med','alas-cache-bitacora','alas-token','internos-pw'].forEach(k=>localStorage.removeItem(k)); sessionStorage.removeItem('alas-sesion'); sessionStorage.removeItem('alas-paso'); } catch(x){} }
function cerrarSesion(){ const uid = FSC.uid; fsSalir(); if(token) api({action:'logout', uid}).catch(()=>{}); borrarSesion(); token=''; pass=''; try { AlasBloqueo.olvidar(); } catch(x){} }
document.addEventListener('click', e => { if(e.target.closest('a[data-pasa]')) pasarSesion(); });

/* ============ Comunicación con la hoja (mismo script que Internos) ============ */
const REPETIBLE = a => /^(get|check|list)/i.test(a||'') || ['updateRow','inicio'].includes(a);
async function postGoogle(url, datos){
  const body = JSON.stringify(datos), esperas = REPETIBLE(datos.action) ? [7000,8000,9000,10000,12000] : [0]; let err;
  for(const ms of esperas){
    const ctl = ms ? new AbortController() : null, tm = ms ? setTimeout(()=>ctl.abort(), ms) : 0;
    try { const r = await fetch(url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body, signal: ctl ? ctl.signal : undefined});
      const t = await r.text(); clearTimeout(tm); return {r, t}; }
    catch(e){ clearTimeout(tm); err = e.name==='AbortError' ? new Error('Google no contestó') : e; }
  }
  throw err;
}
async function api(datos){
  const {r, t} = await postGoogle(API, Object.assign(credenciales(), datos));
  if(!r.ok) throw new Error('HTTP '+r.status);
  let o; try { o = JSON.parse(t); } catch(e){ throw new Error('respuesta inesperada de la hoja'); }
  if(o && o.auth===false && datos.action!=='logout'){ sesionVencida(o.error); throw new Error(o.error||'sesión vencida'); }
  return o;
}
function sesionVencida(txt){ borrarSesion(); token=''; pass=''; role=''; mostrar(false); modoSetup(false); $('lmsg').textContent = txt || 'Tu sesión venció. Ingresá de nuevo con tu contraseña.'; }
function leerCache(em){ try { const c = JSON.parse(localStorage.getItem('alas-cache-bitacora')||'null'); return c && c.email===em && c.d ? c : null; } catch(x){ return null; } }
function guardarCache(){ try { if(token && localStorage.getItem('alas-token')) localStorage.setItem('alas-cache-bitacora', JSON.stringify({email, role, t:Date.now(), d:[RAW.int, RAW.egr, RAW.reg, RAW.tar, RAW.med]})); } catch(x){} }
const datos = r => (r && Array.isArray(r.data)) ? r.data : [];

async function cargar(){
  estado('Actualizando…');
  const [r, bit, tar] = await Promise.all([
    api({action:'inicio', hojas:[HOJA_EGR]}),
    api({action:'getSheet', sheet:HOJA_BIT}),
    api({action:'getSheet', sheet:HOJA_TAR})
  ]);
  let int, egr;
  if(r && Array.isArray(r.internos)){ if(r.role) role = String(r.role); int = r.internos; egr = (r.hojas||{})[HOJA_EGR] || []; FSC.tCarga = Number(r.tServidor)||0; }
  else if(r && r.allowed===false){ sesionVencida(r.error); throw new Error(r.error||'sesión vencida'); }
  else { const [i2, e2] = await Promise.all([api({action:'getInternos'}), api({action:'getSheet', sheet:HOJA_EGR})]); int = i2; egr = datos(e2); }
  if(!Array.isArray(int)) throw new Error((int && int.error) || 'no se pudo leer Internos');
  soloCopia = false;
  armar(int, egr, datos(bit), datos(tar));
  guardarCache();
  estado('');
  FSC.datos = {internos:int, ['hoja_'+HOJA_EGR]:egr}; Object.keys(FSC.datos).forEach(k => FSC.ult[k] = JSON.stringify(FSC.datos[k]));
  setTimeout(fsEscuchar, 0);
}

// Tareas: lo que este celular acaba de tocar manda sobre lo que llega de la planilla,
// hasta que la planilla lo confirme (así nada "vuelve para atrás" ni desaparece un rato)
const TAR_LOCAL = new Map(), TAR_NUEVAS = new Map();
function tarLocal(id, campos){ id = String(id); const v = TAR_LOCAL.get(id) || {c:{}}; Object.assign(v.c, campos); v.t = Date.now(); TAR_LOCAL.set(id, v); aplicarTarLocal(); }
function aplicarTarLocal(){ const ahora = Date.now();
  TAR_LOCAL.forEach((v, id) => { const r = RAW.tar.find(x => String(x.id)===id); if(!r) return;
    const listo = !v.c._pend && Object.keys(v.c).every(k => k.charAt(0)==='_' || String(r[k]||'')===String(v.c[k]||''));
    if(listo || ahora - v.t > 90000) { TAR_LOCAL.delete(id); delete r._pend; return; }
    Object.assign(r, v.c); }); }
function ponerTareas(filas){
  if(!Array.isArray(filas)) return;
  const ids = new Set(filas.map(t => String(t.id)));
  TAR_NUEVAS.forEach((v, id) => { if(ids.has(id) || Date.now() - v.t > 90000) TAR_NUEVAS.delete(id); });
  RAW.tar = filas.map(f => Object.assign({}, f)).concat([...TAR_NUEVAS.values()].map(v => v.r));
  aplicarTarLocal();
}

  const rng = weekRange(V.semana), [s, e] = rng, L = notas().filter(r => !r.sistema && inRange(r.fecha, rng)).sort((a,b) => a.fecha - b.fecha);
  const urg = L.filter(r => tipoDe(r)==='urgente' && !deEgresado(r)), resto = L.filter(r => !urg.includes(r));
  const porInt = PERS.filter(p => resto.some(r => quienDe(r)===p.id)).sort(porIngreso).map(p => ({p, L: resto.filter(r => quienDe(r)===p.id)}));
  const com = resto.filter(r => quienDe(r)==='com'), ops = resto.filter(r => quienDe(r).startsWith('op:'));
  const sin = V.semana===0 ? activos().filter(p => !L.some(r => quienDe(r)===p.id)) : [];
  const bajas = PERS.filter(p => p.baja && !p.fantasma && inRange(new Date(+p.baja + 12*36e5), rng)).sort((a,b) => a.baja - b.baja);
  const ingresos = PERS.filter(p => p.ingreso && !p.fantasma && inRange(new Date(+p.ingreso + 12*36e5), rng)).sort((a,b) => a.ingreso - b.ingreso);
  const k = toISO(aHoja(s)), cerrada = reuniones().find(r => r.personal===k);

}

    if(an) return `<div class="tarea anulando${an==='anulada'?' fuera':''}"><div class="tt"><b>${esc(t.titulo)}</b><small>${an==='anulada' ? '🗑 Anulada' : '<span class="gira"></span> Anulando…'}</small></div></div>`;
    return `<div class="tarea${t.estado==='hecho'?' hecha':''}">
    <button class="tt" onclick="verTarea('${esc(t.id)}')"><b>${esc(t.titulo)}</b><small>${t.estado==='hecho' ? '✓ Hecha ' + quienCuando(t.hecha) : 'Anotó ' + esc(t.creadapor || '—') + (t.creada ? ' · ' + fDate(fechaDe(t.creada)) : '')}${t._pend ? ' · <span class="pend">⏳ guardando…</span>' : ''}</small></button>
    ${t.estado==='hecho' ? `<button class="deshacer"${t._pend?' disabled':''} onclick="marcarTarea('${esc(t.id)}', false)">↩ Deshacer</button>` : `<button class="hecho"${t._pend?' disabled':''} onclick="confirmarHecha('${esc(t.id)}')"><i></i>Marcar hecha</button>`}</div>`; };
  return `<div class="ayuda">✅ <b>Tareas de la comunidad:</b> anotá lo que hay que hacer en la casa. Cuando esté hecha, tocá <b>Marcar hecha</b> y baja al final.</div>
  <div class="nueva"><input id="tNueva" placeholder="Nueva tarea… (ej: arreglar la canilla del baño)" onkeydown="if(event.key==='Enter')agregarTarea()"><button class="b p" onclick="agregarTarea()">Agregar</button></div>
  <div class="grp">Para hacer (${pend.length})</div>
  ${pend.map(fila).join('') || '<div class="vacio">No hay nada pendiente 👍</div>'}
  ${hechas.length ? `<div class="grp">Hechas (${hechas.length})</div>${hechas.map(fila).join('')}` : ''}`;
}
async function agregarTarea(){
  const inp = $('tNueva'), t = inp.value.trim(); if(!t){ inp.focus(); return; }
  const kT = x => String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
  if(TAR.some(x => !x.anulado && x.estado!=='hecho' && kT(x.titulo)===kT(t))) { toast('Esa tarea ya está anotada'); inp.value=''; return; }
  const rec = {id:nid('t'), titulo:t, estado:'pendiente', responsable:'', limite:'', origen:'Comunidad', creada:aHoja(new Date()), creadapor:miNombre(), hecha:''};
  // aparece al instante; se guarda por detrás (así no se carga dos veces)
  const nueva = {r:Object.assign({}, rec, {_pend:true}), t:Date.now()}; TAR_NUEVAS.set(rec.id, nueva);
  RAW.tar.push(nueva.r); inp.value = ''; armar();
  try { await guardarFila(HOJA_TAR, rec, 'Nueva tarea de la comunidad: ' + t.slice(0,80), false);
    nueva.r._pend = false; nueva.t = Date.now(); const x = RAW.tar.find(r => String(r.id)===rec.id); if(x) x._pend = false; armar(); guardarCache(); }
  catch(e){ TAR_NUEVAS.delete(rec.id); RAW.tar = RAW.tar.filter(r => String(r.id)!==rec.id); armar(); const i2 = $('tNueva'); if(i2 && !i2.value) i2.value = t; estado(errorGuardar(e), true); }
}
// Cambia una tarea al instante y la guarda por detrás; si falla, vuelve como estaba
async function cambiarTarea(id, campos, log, aviso){
  const raw = RAW.tar.find(x => String(x.id)===id); if(!raw || raw._pend) return false;
  const antes = {}; Object.keys(campos).forEach(k => antes[k] = raw[k]);
  tarLocal(id, Object.assign({}, campos, {_pend:true})); armar(); if(aviso) toast(aviso);
  try { await guardarFila(HOJA_TAR, Object.assign({id}, campos), log, true); tarLocal(id, {_pend:false}); armar(); guardarCache(); return true; }
  catch(e){ TAR_LOCAL.delete(id); const r = RAW.tar.find(x => String(x.id)===id); if(r){ Object.assign(r, antes); delete r._pend; } armar(); toast('⚠ No se pudo guardar. Probá de nuevo'); estado(errorGuardar(e), true); return false; }
}
function marcarTarea(id, hecho){
  const t = TAR.find(x => x.id===id); if(!t || t._pend) return;
  cambiarTarea(id, {estado: hecho ? 'hecho' : 'pendiente', hecha: hecho ? aHoja(new Date()) + ' por ' + miNombre() : ''},
    (hecho ? 'Tarea hecha: ' : 'Tarea vuelve a pendiente: ') + t.titulo.slice(0,80), hecho ? '✓ Hecha' : 'Vuelve a pendientes');
}
function verTarea(id){ const t = TAR.find(x => x.id===id); if(!t) return;
  $('sheet').innerHTML = `<div class="shh"><h2>Tarea<small>Anotó ${esc(t.creadapor || '—')}${t.creada ? ' · ' + fDate(fechaDe(t.creada)) + ' ' + fh(fechaDe(t.creada)) : ''}</small></h2><button class="xx" onclick="closeSheet()">✕</button></div>
    <div class="texto">${esc(t.titulo)}</div>
    ${t.estado==='hecho' ? `<p class="nota">✓ Hecha: ${esc(t.hecha)}</p>` : ''}
    <p class="err" id="tErr"></p><div id="tX"></div>
    <div class="btns"><button class="b red" onclick="confirmarAnularTarea('${esc(t.id)}')">Anular</button><button class="b" onclick="closeSheet()">Cerrar</button></div>`;
  $('sheetWrap').hidden = false; document.body.style.overflow = 'hidden'; }
function confirmarHecha(id){ const t = TAR.find(x => x.id===id); if(!t || t._pend) return;
  $('sheet').innerHTML = `<div class="anular-conf hecha-conf"><div class="ic">✅</div><h2>¿Esta tarea ya está hecha?</h2>
    <div class="texto">${esc(t.titulo)}</div><p class="nota">Anotó ${esc(t.creadapor || '—')}${t.creada ? ' · ' + fDate(fechaDe(t.creada)) : ''}. Va a quedar como hecha por ${esc(miNombre())}.</p>
    <div class="btns"><button class="b" id="hNo" onclick="closeSheet()">No, todavía</button><button class="b verde" id="hSi" onclick="hechaConfirmada('${esc(id)}')">✓ Sí, está hecha</button></div></div>`;
  $('sheetWrap').hidden = false; document.body.style.overflow = 'hidden'; }
async function hechaConfirmada(id){ const si = $('hSi'), no = $('hNo'); if(!si || si.disabled) return;
  si.disabled = true; si.innerHTML = '<span class="gira"></span> Guardando…'; if(no) no.disabled = true;
  await new Promise(r => setTimeout(r, 400)); closeSheet(); marcarTarea(id, true); }
function confirmarAnularTarea(id){ const t = TAR.find(x => x.id===id); if(!t) return;
  $('sheet').innerHTML = `<div class="anular-conf"><div class="ic">🗑</div><h2>¿Anular esta tarea?</h2>
    <div class="texto">${esc(t.titulo)}</div><p class="nota">No se borra del todo: queda guardada en la planilla como anulada.</p>
    <div class="btns"><button class="b" id="aNo" onclick="verTarea('${esc(id)}')">No, volver</button><button class="b red" id="aSi" onclick="anularTarea('${esc(id)}')">Sí, anular</button></div></div>`; }
const ANULANDO = new Map();
async function anularTarea(id){ const t = TAR.find(x => x.id===id); if(!t || ANULANDO.has(id)) return;
  const si = $('aSi'), no = $('aNo'); if(si){ si.disabled = true; si.innerHTML = '<span class="gira"></span> Anulando…'; } if(no) no.disabled = true;
  await new Promise(r => setTimeout(r, 450));            // que se vea que se apretó
  ANULANDO.set(id, 'anulando'); closeSheet();
  const ok = await cambiarTarea(id, {anulado: aHoja(new Date()) + ' por ' + miNombre()}, 'Anuló una tarea de la comunidad: ' + t.titulo.slice(0,80));
  if(!ok){ ANULANDO.delete(id); armar(); return; }
  ANULANDO.set(id, 'anulada'); armar();
  toast('🗑 Tarea anulada', 'Deshacer', () => { ANULANDO.delete(id); cambiarTarea(id, {anulado:''}, 'Volvió a poner una tarea anulada: ' + t.titulo.slice(0,80), 'Tarea recuperada'); });
  setTimeout(() => { ANULANDO.delete(id); armar(); }, 1800);
}
// Mientras estás en Tareas, se trae lo que marcan los compañeros cada 15 segundos
async function refrescarTareas(){ if(!token || S.ocupado) return;
  try { const r = await api({action:'getSheet', sheet:HOJA_TAR}); if(r && Array.isArray(r.data)){ const antes = JSON.stringify(RAW.tar.map(t => [t.id,t.estado,t.anulado]));
    ponerTareas(r.data); if(antes !== JSON.stringify(RAW.tar.map(t => [t.id,t.estado,t.anulado]))){ armar(); guardarCache(); } } } catch(e){} }
setInterval(() => { if(V.v==='tareas' && document.visibilityState==='visible' && $('sheetWrap').hidden) refrescarTareas(); }, 15000);

/* ======== menú del usuario ======== */
let instalar = null;
// Marca en el celular si Bitácora está instalada (la pantalla de Inicio de Internos lo lee para mostrar o no "Instalar")
function marcaBit(v){ try { if(v) localStorage.setItem('bit_inst','"1"'); else localStorage.removeItem('bit_inst'); } catch(e){} }
if(window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) marcaBit(true);
const pideInstalar = /[?&]instalar=1/.test(location.search);
function barraInstalar(){ if(!instalar || document.getElementById('bitInstBar')) return;
  const d = document.createElement('div'); d.id = 'bitInstBar';
  d.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:9999;display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#3a2410,#211b15);border:1px solid #f7a823;border-radius:16px;padding:10px 12px;color:#f0e8da;font:400 14px system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.4)';
  d.innerHTML = '<div style="flex:1"><b style="display:block;font-size:15px">Instalá Bitácora en este celular</b>Queda con su ícono, como WhatsApp.</div><button type="button" style="border:0;background:#f7a823;color:#281a08;font:700 14px system-ui,sans-serif;height:42px;padding:0 14px;border-radius:11px;cursor:pointer">Instalar</button><button type="button" aria-label="Cerrar" style="border:0;background:none;color:#b3a99b;font-size:20px;cursor:pointer;width:32px;height:42px">✕</button>';
  d.children[1].onclick = async () => { const ev = instalar; if(!ev) return; ev.prompt(); try { await ev.userChoice; } catch(e){} instalar = null; d.remove(); };
  d.children[2].onclick = () => d.remove();
  document.body.appendChild(d); }
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); instalar = e; marcaBit(false); if(pideInstalar) barraInstalar(); });
window.addEventListener('appinstalled', () => { instalar = null; marcaBit(true); const b = document.getElementById('bitInstBar'); if(b) b.remove(); toast('Bitácora instalada'); });
function abrirMenu(){
  $('sheet').innerHTML = `<div class="shh"><h2>Tu usuario<small>${esc(email)}${role ? ' · ' + esc(role) : ''}</small></h2><button class="xx" onclick="closeSheet()">✕</button></div>
    <div class="paso">Tu nombre en las notas</div>
    <div class="nuevo"><input id="mNom" value="${esc(miNombre())}" maxlength="40"><button class="b p" style="width:auto;padding:11px 16px" onclick="guardarNombre()">Guardar</button></div>
    <div style="display:grid;gap:8px;margin-top:18px">
      ${avisosOn() ? '<div class="hecha" style="margin:0">🔔 Avisos de urgentes activados en este celular</div><div class="btns" style="margin:0"><button class="b" onclick="probarAvisos()">Probar aviso</button><button class="b red" onclick="desactivarAvisos()">Desactivar</button></div>' : '<button class="b p" onclick="activarAvisos()">🔔 Activar avisos de urgentes</button>'}
      ${instalar ? '<button class="b" onclick="instalarApp()">📲 Instalar en este celular</button>' : ''}
      <button class="b" onclick="closeSheet();cargar().then(()=>toast('Actualizado')).catch(e=>estado('No se pudo actualizar: '+e.message,true))">⟳ Actualizar</button>
      <a class="b" data-pasa href="https://reboirasnicolas4-dev.github.io/registro-k7x2/" style="text-decoration:none">Ir a Internos</a>
      <button class="b red" onclick="salir()">Salir</button>
    </div>`;
  $('sheetWrap').hidden = false; document.body.style.overflow = 'hidden';
}
function guardarNombre(){ const v = $('mNom').value.trim(); if(!v) return; try { localStorage.setItem('alas-bit-nombre', v); } catch(e){} closeSheet(); render(); toast('Vas a figurar como ' + v); }
async function instalarApp(){ if(!instalar) return; instalar.prompt(); try { await instalar.userChoice; } catch(e){} instalar = null; closeSheet(); }
function salir(){ closeSheet(); cerrarSesion(); email=''; role=''; RAW.int=[]; RAW.egr=[]; RAW.reg=[]; RAW.tar=[]; PERS=[]; REGS=[]; TAR=[]; $('lmsg').textContent=''; mostrar(false); modoSetup(false); }

function openSheet(html){ $('sheet').innerHTML = html; $('sheetWrap').hidden = false; document.body.style.overflow = 'hidden'; }
function closeSheet(){ $('sheetWrap').hidden = true; document.body.style.overflow = ''; if(rec){ try { rec.stop(); } catch(e){} } if(revisarVersion.pend){ revisarVersion.pend = false; setTimeout(revisarVersion, 3000); } }
document.addEventListener('keydown', e => { if(e.key==='Escape') closeSheet(); });
function toast(t, accion, fn){ const el = $('toast'); el.innerHTML = ''; const sp = document.createElement('span'); sp.textContent = t; el.append(sp); el.classList.toggle('conbtn', !!accion);
  if(accion){ const b = document.createElement('button'); b.textContent = accion; b.onclick = () => { el.classList.remove('show'); fn(); }; el.append(b); }
  el.classList.add('show'); clearTimeout(window._tt); window._tt = setTimeout(() => el.classList.remove('show'), accion ? 6000 : 2400); }
/* ============ Ingreso (igual que Internos y Cuartos) ============ */
function modoSetup(on, codigo){ $('setup').hidden = !on; $('pwrow').hidden = on; $('coderow').hidden = !(on && codigo); if(!on) $('ncode').value = '';
  $('ltxt').textContent = on ? (codigo ? 'Escribí el código que te pasaron y elegí tu contraseña nueva.' : 'Es tu primera vez: elegí una contraseña para tu usuario.') : 'Ingresá con el mismo correo y contraseña de la app de Internos.';
  $('lbtn').textContent = on ? 'Crear contraseña e ingresar' : 'Ingresar'; }
$('lf').addEventListener('submit', async e => {
  e.preventDefault(); email = $('em').value.trim().toLowerCase(); $('lmsg').textContent = '';
  const setup = !$('setup').hidden; $('lbtn').disabled = true;
  try {
    if(setup){ const a = $('np1').value, b = $('np2').value;
      if(!$('coderow').hidden && !/^\d{6}$/.test($('ncode').value.trim())){ $('lmsg').textContent = 'Escribí el código de 6 números que te pasaron.'; return; }
      if(a.length < 6){ $('lmsg').textContent = 'La contraseña tiene que tener al menos 6 caracteres.'; return; }
      if(a !== b){ $('lmsg').textContent = 'Las dos contraseñas no coinciden.'; return; }
      pass = ''; token = ''; const r = await api({action:'setPassword', newPassword:a, code:$('ncode').value.trim()});
      if(!r || r.ok!==true){ $('lmsg').textContent = (r && r.error) || 'No se pudo guardar la contraseña.'; return; }
      if(r.token){ token = r.token; pass = ''; } else pass = a; modoSetup(false);
    } else { token = ''; pass = $('pw').value; }
    const res = await api({action:'checkUser'});
    if(res && res.token){ token = res.token; pass = ''; }
    if(res && res.needsSetup){ modoSetup(true, res.needsCode); return; }
    if(!res || !res.allowed){ $('lmsg').textContent = (res && res.error) || 'Ese correo no está autorizado.'; return; }
    role = String(res.role||'');
    try { localStorage.setItem('internos-email', email); } catch(x){} guardarSesion();
    $('pw').value = ''; mostrar(true); render(); await cargar();
  } catch(err){ $('lmsg').textContent = 'No se pudo conectar con la hoja (' + err.message + '). Probá de nuevo.'; }
  finally { $('lbtn').disabled = false; if($('setup').hidden) $('lbtn').textContent = 'Ingresar'; }
});
try { $('em').value = localStorage.getItem('internos-email') || ''; localStorage.removeItem('internos-pw'); if(localStorage.getItem('alas-token')) $('rec').checked = true; const su = localStorage.getItem('internos-api'); if(su) API = su; } catch(e){}
(async()=>{
  const fin = () => $('splash').hidden = true;
  const ses = sesionGuardada();
  if(!ses || !ses.email || !ses.token){ mostrar(false); fin(); return; }
  email = ses.email; token = ses.token || ''; pass = '';
  const cache = leerCache(email);
  if(cache){ soloCopia = true; role = String(cache.role||''); mostrar(true); try { armar(...cache.d); } catch(x){} fin();
    try { await cargar(); guardarSesion(); }
    catch(e){ soloCopia = true; render(); if(token){ const h = new Date(cache.t); estado('Google no contesta: se ve lo guardado a las '+fTime(h)+'. Tocá tu nombre → Actualizar.', true); } }
    return; }
  try { mostrar(true); render(); await cargar();
    if(!role){ const res = await api({action:'checkUser'});
      if(!res || !res.allowed){ const t = res && res.error; borrarSesion(); token=''; email=''; mostrar(false); if(t) $('lmsg').textContent = t; return; }
      role = String(res.role||''); render(); }
    guardarSesion();
  } catch(e){ if(token) estado('No se pudo cargar: '+e.message+'. Tocá tu nombre → Actualizar.', true); }
  finally { fin(); }
})();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));

</script>
