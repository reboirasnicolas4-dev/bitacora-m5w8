<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex">
<title>Bitácora · Alas de Libertad</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="bloqueo.js?v=2"></script>
<link rel="icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --bg:#F4F1EC;--card:#FFFFFF;--ink:#1D1A17;--muted:#5C544D;--soft:#857B73;--line:#E2DBD2;
  --brand:#C2571B;--brand-d:#8E3E12;--brand-bg:#FBEDE3;--brown:#5B3A22;
  --c-conducta:#1F5FA8;--c-familia:#7B45B0;--c-equipo:#0E7C72;--c-general:#55702F;
  --urg:#B42318;--urg-bg:#FDECEA;--imp:#9A5200;--imp-bg:#FFF2D6;--ok:#1E7B3B;--ok-bg:#E5F4EA;
  --r:16px;
}
html,body{margin:0;background:#E7E1D9;color:var(--ink);font-family:'Atkinson Hyperlegible',system-ui,-apple-system,Segoe UI,sans-serif;font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:calc(170px + env(safe-area-inset-bottom))}
@media(min-width:500px){#app{box-shadow:0 0 0 1px var(--line),0 10px 40px rgba(0,0,0,.08)}}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.mark{width:34px;height:34px;border-radius:10px;background:var(--brand);display:grid;place-items:center;flex:none}
.brand b{display:block;font-size:17px;color:var(--brown);letter-spacing:.1px}
.brand small{display:block;font-size:12.5px;color:var(--soft)}
.me{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px 4px 4px;font-size:14px}
.av{width:30px;height:30px;border-radius:50%;background:var(--brown);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.demo-tag{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--brand-d);background:var(--brand-bg);padding:2px 7px;border-radius:6px}

main{padding:14px 14px 0}
h1{font-size:22px;margin:4px 2px 12px;color:var(--ink)}
h2{font-size:19px;margin:0}
h3{font-size:16px;margin:0}
.muted{color:var(--muted)}
.soft{color:var(--soft)}
.sec-t{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin:22px 4px 10px}
.sec-t .n{background:var(--line);color:var(--ink);border-radius:999px;padding:0 8px;font-size:12px;letter-spacing:0}

/* guard banner */
.guard{background:var(--brown);color:#fff;border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:center}
.guard .ic{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none}
.guard b{display:block;font-size:16.5px}
.guard span{display:block;font-size:14px;opacity:.88}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left}
.stat b{display:block;font-size:24px;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.stat.alert b{color:var(--urg)}

/* chips / filters */
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;margin:14px -14px 0;padding-left:14px;padding-right:14px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:15px;white-space:nowrap}
.fchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.search{width:100%;margin-top:10px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;font-size:16px}

/* registro card */
.day{font-size:14px;font-weight:700;color:var(--muted);margin:18px 4px 8px;text-transform:capitalize}
.reg{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--cc);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.reg.p-urgente{background:#FFFBFA;border-color:#F3C7C1;border-left-color:var(--urg)}
.reg-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cat{font-size:13.5px;font-weight:700;color:var(--cc)}
.time{margin-left:auto;font-size:13.5px;color:var(--soft);white-space:nowrap}
.pb{font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap}
.pb.urgente{background:var(--urg);color:#fff}
.pb.importante{background:var(--imp-bg);color:var(--imp)}
.ints{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ichip{font-size:13.5px;background:#F1ECE6;border-radius:8px;padding:3px 9px;font-weight:700;color:var(--brown)}
.ichip.gen{background:#EEF1EA;color:var(--c-general);font-weight:400}
.ichip.baja{background:#EEE;color:#6b6b6b;text-decoration:line-through}
.txt{margin:8px 0 0;font-size:16px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.reg-f{margin-top:8px;font-size:13.5px;color:var(--soft)}
.inv{color:var(--c-equipo);font-weight:700}
.sys{font-size:12px;background:#ECEFF3;color:#3F4B5B;border-radius:6px;padding:2px 7px;font-weight:700}

.empty{text-align:center;color:var(--muted);padding:28px 16px;background:var(--card);border:1px dashed var(--line);border-radius:14px}

/* FAB */
.fab-wrap{position:fixed;left:0;right:0;bottom:calc(74px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto;padding:0 14px;pointer-events:none;z-index:40;display:flex;justify-content:flex-end}
.fab{pointer-events:auto;border:0;background:var(--brand);color:#fff;font-weight:700;font-size:17.5px;border-radius:999px;padding:16px 22px;box-shadow:0 8px 22px rgba(142,62,18,.35);display:flex;align-items:center;gap:8px}
.fab:active{transform:scale(.98)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:35}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:13px;color:var(--soft);position:relative}
.nav button svg{width:26px;height:26px}
.nav button.on{color:var(--brand-d);font-weight:700}
.nav button.on .pill{background:var(--brand-bg)}
.pill{border-radius:999px;padding:2px 16px;display:grid;place-items:center}
.badge{position:absolute;top:2px;left:calc(50% + 8px);background:var(--urg);color:#fff;font-size:11px;font-weight:700;border-radius:999px;min-width:19px;height:19px;padding:0 5px;display:grid;place-items:center;border:2px solid #fff}
.badge.n{background:var(--brown)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgba(29,26,23,.45)}
.sheet{position:relative;background:var(--bg);width:100%;max-width:480px;max-height:94vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sh-h{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;border-bottom:1px solid var(--line);background:#fff;border-radius:22px 22px 0 0}
.sh-h h2{flex:1}
.x{border:0;background:#F1ECE6;width:38px;height:38px;border-radius:50%;font-size:18px}
.sh-b{padding:14px 16px 18px;overflow-y:auto;flex:1}
.sh-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff;display:flex;gap:10px}
.lbl{display:flex;align-items:baseline;gap:6px;font-weight:700;font-size:15px;margin:16px 2px 8px}
.lbl:first-child{margin-top:2px}
.lbl small{font-weight:400;color:var(--soft);font-size:13px}
.meta-row{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.meta-row input{border:0;background:#F6F3EF;border-radius:8px;padding:8px;font-size:15px;min-width:0;flex:1}
.meta-row .who{font-size:14px;color:var(--muted);white-space:nowrap}
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cbtn{border:2px solid var(--line);background:#fff;border-radius:14px;padding:11px 12px;text-align:left;min-height:74px}
.cbtn b{display:block;font-size:15px;color:var(--cc)}
.cbtn span{display:block;font-size:12.5px;color:var(--soft);margin-top:2px;line-height:1.25}
.cbtn.on{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 8%,#fff);box-shadow:inset 0 0 0 1px var(--cc)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-size:15px}
.chip.on{background:var(--brown);border-color:var(--brown);color:#fff;font-weight:700}
.chip.gen.on{background:var(--c-general);border-color:var(--c-general)}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg3 button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 6px;font-size:15px;font-weight:700}
.seg3 button.on[data-v=normal],.seg3 button.on[data-v=pendiente]{border-color:var(--ink);background:#F3F0EC}
.seg3 button.on[data-v=importante],.seg3 button.on[data-v=proceso]{border-color:var(--imp);background:var(--imp-bg);color:var(--imp)}
.seg3 button.on[data-v=urgente]{border-color:var(--urg);background:var(--urg);color:#fff}
.seg3 button.on[data-v=hecho]{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
textarea,.inp,select{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;font-size:16px}
textarea{min-height:130px;resize:vertical}
textarea:focus,.inp:focus,select:focus,.search:focus{outline:3px solid color-mix(in srgb,var(--brand) 30%,transparent);border-color:var(--brand)}
.hint{font-size:13px;color:var(--soft);margin:6px 2px 0}
.err{color:var(--urg);font-weight:700;font-size:14px;margin:10px 2px 0;display:none}
.btn{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:13px 16px;font-weight:700;font-size:16px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;flex:1}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.danger{background:var(--urg);border-color:var(--urg);color:#fff}
.btn.ghost-d{color:var(--urg)}
.btn.wa{background:#1F8F4E;border-color:#1F8F4E;color:#fff;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.full{width:100%}
.btn.sm{padding:9px 12px;font-size:14.5px;border-radius:11px}

/* internos */
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#E9E3DB;border-radius:14px;padding:4px;gap:4px}
.tabs button{border:0;background:none;border-radius:11px;padding:11px 6px;font-weight:700;font-size:15px;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.sync{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:12px 0 4px;font-size:14px}
.sync .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 4px var(--ok-bg)}
.sync div{flex:1;line-height:1.3}
.icard{display:flex;width:100%;text-align:left;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.ini{width:44px;height:44px;border-radius:50%;background:#EFE6DC;color:var(--brown);display:grid;place-items:center;font-weight:700;flex:none}
.icard .b{flex:1;min-width:0}
.icard b{display:block;font-size:16.5px}
.icard small{display:block;color:var(--muted);font-size:13.5px}
.icard .r{text-align:right;font-size:13px;color:var(--soft);white-space:nowrap}
.flag{display:inline-block;background:var(--urg);color:#fff;border-radius:6px;font-size:12px;font-weight:700;padding:2px 7px;margin-top:3px}
.est{display:inline-block;border-radius:6px;font-size:12.5px;font-weight:700;padding:2px 8px}
.est.ok{background:var(--ok-bg);color:var(--ok)}
.est.bad{background:var(--urg-bg);color:var(--urg)}
.est.neu{background:#ECEFF3;color:#3F4B5B}
.srow.pulse{animation:pl 1s ease}
@keyframes pl{0%{background:#FFF3C4}100%{background:#fff}}
.syncing .dot{background:var(--imp);box-shadow:0 0 0 4px var(--imp-bg);animation:bl .6s infinite alternate}
@keyframes bl{to{opacity:.3}}
.back{border:0;background:none;color:var(--brand-d);font-weight:700;font-size:16px;padding:6px 2px;margin-bottom:6px}
.prof{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.prof h2{font-size:22px}
.prof .row{margin-top:6px;color:var(--muted);font-size:15px}
.archived{background:#F2F2F2;border:1px dashed #BDBDBD;color:#4a4a4a;border-radius:12px;padding:10px 12px;margin-top:12px;font-size:14.5px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.mini div{background:#F7F4F0;border-radius:10px;padding:8px 10px}
.mini b{display:block;font-size:20px}
.mini span{font-size:12.5px;color:var(--muted)}

/* reunión */
.wk{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.wk .arr{border:1px solid var(--line);background:#fff;width:42px;height:42px;border-radius:12px;font-size:20px;flex:none}
.wk .arr:disabled{opacity:.35}
.wk .c{flex:1;text-align:center}
.wk .c b{display:block;font-size:16.5px}
.wk .c span{font-size:13.5px;color:var(--muted)}
.live{display:inline-block;background:var(--ok-bg);color:var(--ok);font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;margin-left:4px}
.kpis{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px}
.kpi b{font-size:16px}
.kpi.u{border-color:#F3C7C1;background:var(--urg-bg);color:var(--urg)}
.alertbox{background:var(--urg-bg);border:1.5px solid #F0B9B2;border-radius:var(--r);padding:12px 12px 2px}
.alertbox .sec-t{color:var(--urg);margin:2px 2px 10px}
details.grp{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
details.grp summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary b{flex:1;font-size:16px}
details.grp summary .cnt{font-size:13px;color:var(--muted);white-space:nowrap}
details.grp summary::after{content:'›';font-size:22px;color:var(--soft);transform:rotate(90deg);transition:.15s}
details.grp:not([open]) summary::after{transform:none}
.line{display:block;width:100%;text-align:left;border:0;border-top:1px solid #EFEAE4;background:none;padding:10px 14px}
.line .ld{font-size:13px;color:var(--soft);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.line .ld .c{font-weight:700;color:var(--cc)}
.line p{margin:4px 0 0;font-size:15.5px;white-space:pre-line}
.nonov{background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:14.5px;color:var(--muted)}
.wa-opts label{display:flex;align-items:center;gap:10px;padding:8px 2px;font-size:15px}
.wa-opts input{width:22px;height:22px;accent-color:var(--brand)}
.wa-txt{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px;min-height:300px;background:#F7FBF8;border-color:#CFE5D7}

/* tareas */
.task{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.task.st-hecho{opacity:.65}
.task.st-hecho .tk-b b{text-decoration:line-through}
.stbtn{flex:none;border:2px solid var(--line);background:#fff;border-radius:10px;padding:7px 9px;font-size:13px;font-weight:700;min-width:96px}
.st-pendiente .stbtn{border-color:#CFC6BC}
.st-proceso .stbtn{border-color:var(--imp);background:var(--imp-bg);color:var(--imp)}
.st-hecho .stbtn{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.tk-b{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0}
.tk-b b{display:block;font-size:16px}
.tk-m{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13.5px;color:var(--muted);margin-top:5px}
.venc{color:var(--urg);font-weight:700}
.orig{background:var(--brand-bg);color:var(--brand-d);border-radius:6px;padding:0 6px;font-weight:700;font-size:12.5px}
.toprow{display:flex;align-items:center;gap:10px;margin:4px 2px 12px}
.toprow h1{margin:0;flex:1}

/* sheet table for sync */
.srow{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.srow .n{flex:1;min-width:0}
.srow .n b{display:block;font-size:15px}
.srow .n small{color:var(--soft);font-size:12.5px}
.srow select{width:auto;max-width:48%;padding:8px 10px;font-size:14px;border-radius:10px}
.srow.changed{border-color:var(--brand);background:var(--brand-bg)}
.note{background:#EEF3F8;border:1px solid #D3E0EC;border-radius:12px;padding:10px 12px;font-size:14px;color:#2B4057}

.oprow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.oprow.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.oprow b{flex:1}
.gtag{font-size:12.5px;font-weight:700;border-radius:6px;padding:2px 8px;background:#F1ECE6;color:var(--brown)}

.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.full-d{white-space:pre-line;font-size:17px;line-height:1.5;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15px;margin-top:12px}
.kv dt{color:var(--soft)}
.kv dd{margin:0;font-weight:700}
img.mark{object-fit:contain;background:none;width:38px;height:38px}
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center}
#splash[hidden]{display:none}
.sp-in{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--brown)}
.sp-in img{width:84px;height:84px;object-fit:contain;animation:lat 1.2s ease-in-out infinite alternate}
@keyframes lat{to{transform:scale(1.06);opacity:.8}}
.sp-in small{color:var(--soft)}
#login{min-height:100vh;display:grid;place-items:center;padding:20px 16px;background:var(--bg)}
#login[hidden]{display:none}
.lg-box{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px 20px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.lg-brand{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.lg-brand img{width:58px;height:58px;object-fit:contain}
.lg-brand small{color:var(--soft);font-size:14px}
.lg-brand h1{margin:0;font-size:26px;color:var(--brown)}
.lg-form{display:grid;gap:12px}

<script>
/* ============================================================
   Bitácora · Alas de Libertad
   - Los internos NO se cargan acá: vienen de Base_Internos (pestañas "Internos" y "Egresados")
     por el mismo Apps Script de la app de Internos, y se actualizan solos en tiempo real (Firebase).
   - Lo que se anota en la bitácora se guarda en la pestaña "Bitacora" y las tareas en "Tareas Bitacora".
   ============================================================ */
const DEFAULT_API = "https://script.google.com/macros/s/AKfycbzYLuWCtvRv-sQobVzwXxUhTbjfhDuul9raoOD4RbxFOkBVaPI5FLEOU4TI5z3pQl9_/exec";
let API = DEFAULT_API;
const HOJA_BIT = "Bitacora", HOJA_TAR = "Tareas Bitacora", HOJA_EGR = "Egresados";
const DUR_MESES = 9;

/* ============ Utilidades ============ */
const DAY = 864e5;
const DN = ['dom','lun','mar','mié','jue','vie','sáb'];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const D = x => x instanceof Date ? x : new Date(x);
const fDate = x => { const d = D(x); return `${DN[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth()+1)}`; };
const fDateY = x => { if(!x) return '—'; const d = D(x); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`; };
const fTime = x => { const d = D(x); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const midnight = x => { const d = new Date(D(x)); d.setHours(0,0,0,0); return d; };
const dayDiff = (a,b) => Math.round((midnight(a)-midnight(b))/DAY);
function relDay(x){ const k = dayDiff(new Date(), x); if(k===0) return 'Hoy'; if(k===1) return 'Ayer'; return fDate(x); }
function toLocalInput(x){ const d = D(x); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
const aHoja = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
function toISO(v){ v = String(v||'').trim(); if(/^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0,10); const m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); return m ? m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0') : ''; }
// "2026-11-18 15:20", "2026-11-18" o ISO -> Date local
function fechaDe(v){ v = String(v||'').trim(); const m = v.match(/^(\d{4})-(\d{2})-(\d{2})(?:[ T](\d{1,2}):(\d{2}))?/); if(m) return new Date(+m[1], +m[2]-1, +m[3], +(m[4]||0), +(m[5]||0)); const d = new Date(v); return isNaN(d) ? new Date(0) : d; }
const diaLocal = s => s ? fechaDe(s) : null;
function durTxt(from, to=new Date()){ const d = Math.max(0, dayDiff(to, from)); if(d < 31) return `${d} días`; const m = Math.floor(d/30.44); return m===1 ? '1 mes' : `${m} meses`; }
function mesDe(ing){ const d = Math.max(0, dayDiff(new Date(), ing)); return Math.min(DUR_MESES, Math.floor(d/30.44)+1); }
function lastFriday(ref = new Date()){ const d = new Date(ref); d.setHours(10,0,0,0); d.setDate(d.getDate() - ((d.getDay()-5+7)%7)); if(d > ref) d.setDate(d.getDate()-7); return d; }
const shortName = n => { const p = String(n).trim().split(/\s+/); return p.length>1 ? `${p[0]} ${p[p.length-1][0]}.` : String(n); };
const initials = n => String(n).trim().split(/\s+/).map(w=>w[0]||'').slice(0,2).join('').toUpperCase();
const normCed = c => String(c||'').replace(/\D/g,'');
const nid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const lista = (s, sep=',') => String(s||'').split(sep).map(x=>x.trim()).filter(Boolean);

const CATS = {
  conducta:{label:'Evolución / Conducta', short:'Conducta', icon:'🧭', color:'var(--c-conducta)', hint:'Crisis, desmotivación, intención de abandono, avances'},
  familia:{label:'Contacto familiar / externo', short:'Familia', icon:'📞', color:'var(--c-familia)', hint:'Llamadas, reclamos, visitas'},
  equipo:{label:'Incidencia de equipo', short:'Equipo', icon:'🤝', color:'var(--c-equipo)', hint:'Conflictos, trato hacia internos, alertas legales'},
  general:{label:'Novedad general', short:'General', icon:'🏠', color:'var(--c-general)', hint:'Mantenimiento, convivencia, insumos'}
};
const PRIOS = {normal:'Normal', importante:'Importante', urgente:'Urgente / Delicado'};
const TSTATE = {pendiente:'Pendiente', proceso:'En proceso', hecho:'Hecho'};
const estCls = e => /termin|derivad|finaliz|egresad/i.test(e) ? 'ok' : /(fue|estall|abandon|fuga)/i.test(e) ? 'bad' : 'neu';

/* ============ Estado ============ */
let email = "", pass = "", role = "", token = "", soloCopia = false;
const isAdmin = () => /admin/i.test(role) && !soloCopia;
const RAW = {int:[], egr:[], reg:[], tar:[]};
let PERS = [], BYID = {}, REGS = [], TAR = [];
const S = { view:'bitacora', filtro:'todos', q:'', intTab:'activos', intSel:null, intCat:'todos', intQ:'', weekOffset:0, tFiltro:'abiertas', form:null, task:null, wa:{equipo:false, abrev:true, tareas:true}, ocupado:false };

function miNombre(){ try { const n = localStorage.getItem('alas-bit-nombre'); if(n) return n; } catch(e){} const u = email.split('@')[0] || 'Usuario'; return u.charAt(0).toUpperCase()+u.slice(1); }
const activos = () => PERS.filter(p => p.estado==='Activo').sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
const bajas = () => PERS.filter(p => p.estado!=='Activo').sort((a,b)=>(b.baja?+b.baja:0)-(a.baja?+a.baja:0));
function weekRange(offset){ const F = lastFriday(); const s = new Date(F.getTime()+offset*7*DAY); return [s, new Date(s.getTime()+7*DAY)]; }
const inRange = (x,[s,e]) => { const t = D(x); return t>=s && t<e; };

/* ============ Armar los datos que vienen de la planilla ============ */
function armar(int, egr, reg, tar){
  if(Array.isArray(int)) RAW.int = int; if(Array.isArray(egr)) RAW.egr = egr; if(Array.isArray(reg)) RAW.reg = reg; if(Array.isArray(tar)) RAW.tar = tar;
  const act = RAW.int.filter(o => String(o.nombre||'').trim()).map(o => ({
    id:String(o.id||''), nombre:String(o.nombre).trim(), cedula:String(o.cedula||''), ingreso:diaLocal(toISO(o.ingreso)), tipo:String(o.tipo||''), estado:'Activo', baja:null }));
  const actIds = new Set(act.map(p=>p.id)), actCed = new Set(act.map(p=>normCed(p.cedula)).filter(Boolean));
  const egMap = new Map();
  RAW.egr.filter(o => String(o.nombre||'').trim()).forEach(o => {
    const p = { id:String(o.id || ('egr-'+(normCed(o.cedula) || o._fila))), nombre:String(o.nombre).trim(), cedula:String(o.cedula||''), ingreso:diaLocal(toISO(o.fechadeingreso)),
      tipo:String(o.tipo||''), estado:String(o.motivo||'').trim() || 'Egresado', baja:diaLocal(toISO(o.fechadeegreso)), nota:String(o.nota||'') };
    if(actIds.has(p.id) || (p.cedula && actCed.has(normCed(p.cedula)))) return; // volvió a ingresar: cuenta como activo
    const k = normCed(p.cedula) || p.id, ya = egMap.get(k);
    if(!ya || (p.baja && (!ya.baja || p.baja > ya.baja))) egMap.set(k, Object.assign(p, {otrosIds: ya ? [ya.id, ...(ya.otrosIds||[])] : []}));
  });
  PERS = [...act, ...egMap.values()];
  BYID = {}; PERS.forEach(p => { BYID[p.id] = p; (p.otrosIds||[]).forEach(x => BYID[x] = BYID[x] || p); });
  const byCed = {}; PERS.forEach(p => { const c = normCed(p.cedula); if(c && (!byCed[c] || p.estado==='Activo')) byCed[c] = p; });

  REGS = RAW.reg.filter(o => o.id).map(o => {
    const ids = lista(o.internos), noms = lista(o.nombres,'|'), ceds = lista(o.cedulas);
    const internos = ids.map((id,k) => {
      if(BYID[id]) return BYID[id].id;
      const c = normCed(ceds[k]); if(c && byCed[c]) return byCed[c].id;
      // ya no está en Internos ni en Egresados (por ejemplo, se borró la fila): se conserva con el nombre guardado
      const p = {id, nombre: noms[k] || 'Sin nombre', cedula: ceds[k]||'', ingreso:null, tipo:'', estado:'Sin datos en Internos', baja:null, fantasma:true};
      PERS.push(p); BYID[id] = p; return id;
    });
    return { id:String(o.id), fecha:fechaDe(o.fecha), cat: CATS[o.categoria] ? o.categoria : 'general', prio: PRIOS[o.prioridad] ? o.prioridad : 'normal',
      internos, nombres:noms, cedulas:ceds, personal:String(o.personal||''), texto:String(o.texto||''), operador:String(o.operador||''), email:String(o.email||''),
      editado:String(o.editado||''), _fila:o._fila };
  }).sort((a,b)=>b.fecha-a.fecha);
  // Bajas: una línea automática en la bitácora el día del egreso (no se guarda, se arma de la pestaña Egresados)
  bajas().filter(p=>!p.fantasma && p.baja).forEach(p => REGS.push({ id:'egr:'+p.id, fecha:new Date(p.baja.getFullYear(),p.baja.getMonth(),p.baja.getDate(),8,0), cat:'conducta', prio:'urgente',
    internos:[p.id], nombres:[p.nombre], cedulas:[p.cedula], personal:'', operador:'App de Internos', email:'', sistema:true,
    texto:`Egreso registrado en la app de Internos (motivo: ${p.estado})${p.nota?'. Nota: '+p.nota:''}. Sale de la lista de activos; sus registros quedan guardados.` }));
  REGS.sort((a,b)=>b.fecha-a.fecha);

  TAR = RAW.tar.filter(o => o.id && String(o.titulo||'').trim()).map(o => ({ id:String(o.id), titulo:String(o.titulo), estado: TSTATE[o.estado] ? o.estado : 'pendiente',
    resp:String(o.responsable||''), limite:toISO(o.limite), origen:String(o.origen||''), creada:String(o.creada||''), creadapor:String(o.creadapor||''), _fila:o._fila }));

  const nombres = new Set([miNombre()]);
  REGS.forEach(r => { if(r.personal) nombres.add(r.personal); if(r.operador && !r.sistema) nombres.add(r.operador); });
  TAR.forEach(t => t.resp && nombres.add(t.resp)); nombres.add('Coordinación');
  $('dlPersonas').innerHTML = [...nombres].sort((a,b)=>a.localeCompare(b,'es')).map(n=>`<option value="${esc(n)}">`).join('');
  if(S.intSel && !BYID[S.intSel]) S.intSel = null;
  render();
}

/* ============ Sesión (igual que Internos y Cuartos: se guarda un código, nunca la contraseña) ============ */
function credenciales(){ return token ? {email, token} : {email, password:pass}; }
function guardarSesion(){ try { const rec = $('rec').checked;
  if(rec && token) localStorage.setItem('alas-token', JSON.stringify({email, token})); else localStorage.removeItem('alas-token');
  localStorage.removeItem('internos-pw'); sessionStorage.removeItem('alas-sesion'); } catch(x){} }
function pasarSesion(){ try { if(token) sessionStorage.setItem('alas-paso', JSON.stringify({email, token, t:Date.now()})); } catch(x){} }
function sesionGuardada(){ try { const p = JSON.parse(sessionStorage.getItem('alas-paso')||'null'); sessionStorage.removeItem('alas-paso'); sessionStorage.removeItem('alas-sesion');
  if(p && p.token && Date.now()-p.t < 60000) return p; return JSON.parse(localStorage.getItem('alas-token')||'null'); } catch(x){ return null; } }
function borrarSesion(){ try { ['alas-cache','alas-cache-cuartos','alas-cache-med','alas-cache-bitacora','alas-token','internos-pw'].forEach(k=>localStorage.removeItem(k)); sessionStorage.removeItem('alas-sesion'); sessionStorage.removeItem('alas-paso'); } catch(x){} }
function cerrarSesion(){ const uid = FSC.uid; fsSalir(); if(token) api({action:'logout', uid}).catch(()=>{}); borrarSesion(); token=''; pass=''; try { AlasBloqueo.olvidar(); } catch(x){} }
document.addEventListener('click', e => { if(e.target.closest('a[data-internos]')) pasarSesion(); });

/* ============ Comunicación con la hoja (mismo script que Internos) ============ */
const REPETIBLE = a => /^(get|check|list)/i.test(a||'') || ['updateRow','inicio'].includes(a);
async function postGoogle(url, datos){
  const body = JSON.stringify(datos), esperas = REPETIBLE(datos.action) ? [7000,8000,9000,10000,12000] : [0]; let err;
  for(const ms of esperas){
    const ctl = ms ? new AbortController() : null, tm = ms ? setTimeout(()=>ctl.abort(), ms) : 0;
    try { const r = await fetch(url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body, signal: ctl ? ctl.signal : undefined});
      const t = await r.text(); clearTimeout(tm); return {r, t}; }
    catch(e){ clearTimeout(tm); err = e.name==='AbortError' ? new Error('Google no contestó') : e; }
  }
  throw err;
}
async function api(datos){
  const {r, t} = await postGoogle(API, Object.assign(credenciales(), datos));
  if(!r.ok) throw new Error('HTTP '+r.status);
  let o; try { o = JSON.parse(t); } catch(e){ throw new Error('respuesta inesperada de la hoja'); }
  if(o && o.auth===false && datos.action!=='logout'){ sesionVencida(o.error); throw new Error(o.error||'sesión vencida'); }
  return o;
}
function sesionVencida(txt){ borrarSesion(); token=''; pass=''; role=''; mostrar(false); modoSetup(false); $('lmsg').textContent = txt || 'Tu sesión venció. Ingresá de nuevo con tu contraseña.'; }
function leerCache(em){ try { const c = JSON.parse(localStorage.getItem('alas-cache-bitacora')||'null'); return c && c.email===em && c.d ? c : null; } catch(x){ return null; } }
function guardarCache(){ try { if(token && localStorage.getItem('alas-token')) localStorage.setItem('alas-cache-bitacora', JSON.stringify({email, role, t:Date.now(), d:[RAW.int, RAW.egr, RAW.reg, RAW.tar]})); } catch(x){} }
const datos = r => (r && Array.isArray(r.data)) ? r.data : [];

async function cargar(){
  estado('Actualizando…');
  const [r, bit, tar] = await Promise.all([
    api({action:'inicio', hojas:[HOJA_EGR]}),
    api({action:'getSheet', sheet:HOJA_BIT}),
    api({action:'getSheet', sheet:HOJA_TAR})
  ]);
  let int, egr;
  if(r && Array.isArray(r.internos)){ if(r.role) role = String(r.role); int = r.internos; egr = (r.hojas||{})[HOJA_EGR] || []; FSC.tCarga = Number(r.tServidor)||0; }
  else if(r && r.allowed===false){ sesionVencida(r.error); throw new Error(r.error||'sesión vencida'); }
  else { const [i2, e2] = await Promise.all([api({action:'getInternos'}), api({action:'getSheet', sheet:HOJA_EGR})]); int = i2; egr = datos(e2); }
  if(!Array.isArray(int)) throw new Error((int && int.error) || 'no se pudo leer Internos');
  soloCopia = false;
  armar(int, egr, datos(bit), datos(tar));
  guardarCache();
  estado('');
  FSC.datos = {internos:int, ['hoja_'+HOJA_EGR]:egr}; Object.keys(FSC.datos).forEach(k => FSC.ult[k] = JSON.stringify(FSC.datos[k]));
  setTimeout(fsEscuchar, 0);
}
// Registros y tareas que anotan los compañeros: se traen solos cada minuto (y al volver a la app)
async function refrescarBitacora(silencioso=true){
  if(!token || S.ocupado) return;
  try { const [bit, tar] = await Promise.all([api({action:'getSheet', sheet:HOJA_BIT}), api({action:'getSheet', sheet:HOJA_TAR})]);
    const antes = RAW.reg.length + '|' + RAW.tar.map(t=>t.estado).join();
    if(document.querySelector('#sheetWrap:not([hidden])')) { RAW.reg = datos(bit); RAW.tar = datos(tar); return; } // no interrumpir un formulario abierto
    armar(null, null, datos(bit), datos(tar)); guardarCache();
    if(!silencioso && antes !== RAW.reg.length + '|' + RAW.tar.map(t=>t.estado).join()) toast('Hay novedades nuevas del equipo');
  } catch(e){ if(!silencioso) estado('No se pudo actualizar ('+e.message+').', true); }
}
setInterval(() => { if(document.visibilityState==='visible') refrescarBitacora(false); }, 60000);
document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible' && token) refrescarBitacora(false); });

/* ============ Base en tiempo real (Firebase): altas y egresos de la app de Internos llegan solos ============ */
const FB_CONF = {apiKey:"AIzaSyC3mDOcJqIa4HfMOCsCQod2tbi30zkmUUs",authDomain:"alas-de-libertad.firebaseapp.com",projectId:"alas-de-libertad",storageBucket:"alas-de-libertad.firebasestorage.app",messagingSenderId:"39658390390",appId:"1:39658390390:web:4cfb1fdc7a29b26b0eb057"};
const FB_JS = "https://www.gstatic.com/firebasejs/10.12.2/";
const _js = {}; function cargarJS(u){ return _js[u] || (_js[u] = new Promise((ok,no)=>{ const s = document.createElement('script'); s.src = u; s.onload = ok; s.onerror = ()=>{ delete _js[u]; no(new Error('no se pudo cargar Firebase')); }; document.head.append(s); })); }
const FSC = {db:null, uid:'', listo:null, unsubs:[], ult:{}, datos:null, tCarga:0};
function fsIniciar(){ if(FSC.listo) return FSC.listo;
  FSC.listo = (async()=>{ await cargarJS(FB_JS+'firebase-app-compat.js'); await cargarJS(FB_JS+'firebase-auth-compat.js'); await cargarJS(FB_JS+'firebase-firestore-compat.js');
    if(!firebase.apps.length) firebase.initializeApp(FB_CONF); const db = firebase.firestore();
    if(localStorage.getItem('alas-token')){ try { await db.enablePersistence({synchronizeTabs:true}); } catch(x){} }
    const au = firebase.auth(); await new Promise(r=>{ const u = au.onAuthStateChanged(()=>{ u(); r(); }); }); if(!au.currentUser) await au.signInAnonymously();
    FSC.uid = au.currentUser.uid; FSC.db = db; return db; })().catch(e=>{ FSC.listo = null; throw e; }); return FSC.listo; }
async function fsAcceso(forzar){ const k = 'alas-fs-acc', marca = email+'|'+FSC.uid; let v = ''; try { v = localStorage.getItem(k) || sessionStorage.getItem(k) || ''; } catch(x){}
  if(!forzar && v.startsWith(marca+'|') && Date.now()-Number(v.split('|')[2]) < 864e5) return;
  const r = await api({action:'fbAcceso', uid:FSC.uid}); if(!r || r.ok!==true) throw new Error((r && r.error) || 'sin acceso a la base');
  try { (localStorage.getItem('alas-token') ? localStorage : sessionStorage).setItem(k, marca+'|'+Date.now()); } catch(x){} }
async function fsEscuchar(){
  if(!token || !FSC.datos || FSC.unsubs.length || fsEscuchar.p) return; fsEscuchar.p = 1;
  try { await fsIniciar(); await fsAcceso(false); } catch(e){ fsEscuchar.p = 0; return; }
  ['internos', 'hoja_'+HOJA_EGR].forEach(id => { let reintento = false;
    const c = () => { const u = FSC.db.doc('datos/'+id).onSnapshot(s => { const o = s.data(); if(!o || !Array.isArray(o.d) || !token || !FSC.datos) return;
        const t = o.t && o.t.toMillis ? o.t.toMillis() : 0; if(t && t < FSC.tCarga) return;
        const j = JSON.stringify(o.d); if(FSC.ult[id]===j) return;
        const antes = activos().map(p=>p.id).join();
        FSC.ult[id] = j; FSC.datos[id] = o.d;
        armar(FSC.datos.internos, FSC.datos['hoja_'+HOJA_EGR], null, null); guardarCache();
        if(antes !== activos().map(p=>p.id).join()) toast('La lista de internos se actualizó desde la app de Internos'); },
      async e => { FSC.unsubs = FSC.unsubs.filter(x=>x!==u); if(!reintento && e && e.code==='permission-denied'){ reintento = true; try { await fsAcceso(true); c(); } catch(x){} } });
      FSC.unsubs.push(u); }; c(); });
  fsEscuchar.p = 0; }
setInterval(() => { if(document.visibilityState==='visible') fsEscuchar(); }, 5000);
function fsSalir(){ try { FSC.unsubs.forEach(u=>u()); } catch(x){} FSC.unsubs = []; FSC.ult = {}; FSC.datos = null;
  try { localStorage.removeItem('alas-fs-acc'); sessionStorage.removeItem('alas-fs-acc'); } catch(x){}
  try { const db = FSC.db; if(db){ db.terminate().then(()=>db.clearPersistence()).catch(()=>{}); } } catch(x){} FSC.db = null; FSC.listo = null; }

/* ============ Guardar en la planilla ============ */
// Busca la fila actual de un registro por su id (las filas pueden correrse si otro borró algo)
async function filaDe(hoja, id){ const r = await api({action:'getSheet', sheet:hoja}); const o = datos(r).find(x => String(x.id)===String(id)); return o ? o._fila : 0; }
function errorGuardar(e){
  const m = String(e && e.message || e);
  if(/Solo un Admin/i.test(m)) return 'Tu usuario todavía no puede anotar en la bitácora (falta habilitarlo en el script). Avisale a Nicolás.';
  return 'No se pudo guardar: ' + m + '. Revisá la conexión y probá de nuevo.';
}
async function guardarFila(hoja, rec, log, editar){
  S.ocupado = true;
  try {
    let r;
    if(editar){ const fila = await filaDe(hoja, rec.id); if(!fila) throw new Error('ya no existe en la planilla');
      r = await api({action:'updateRow', sheet:hoja, fila, record:rec, log}); }
    else r = await api({action:'addRow', sheet:hoja, record:rec, log});
    if(!r || r.ok!==true) throw new Error((r && r.error) || 'la hoja no confirmó');
  } finally { S.ocupado = false; }
}
async function borrarFila(hoja, id, log){
  S.ocupado = true;
  try { const fila = await filaDe(hoja, id); if(!fila) throw new Error('ya no existe en la planilla');
    const r = await api({action:'deleteRow', sheet:hoja, fila, log}); if(!r || r.ok!==true) throw new Error((r && r.error) || 'la hoja no confirmó'); }
  finally { S.ocupado = false; }
}

function estado(t, err){ const e = $('estado'); e.textContent = t || ''; e.classList.toggle('err', !!err); e.hidden = !t; }
function render(){
  if($('app').hidden) return;
  const m = $('main');
  if(S.view==='bitacora') m.innerHTML = vBitacora();
  if(S.view==='internos') m.innerHTML = S.intSel ? vInterno() : vInternos();

function vBitacora(){
  const [F, end] = weekRange(0);
  const dd = dayDiff(end, new Date());
  const cuando = dd<=0 ? 'hoy' : dd===1 ? 'mañana' : `en ${dd} días`;
  const urg = REGS.filter(r=>r.prio==='urgente' && inRange(r.fecha,[F,end])).length;
  const pend = TAR.filter(t=>t.estado!=='hecho').length;
  let list = REGS;
  if(S.filtro==='urgente') list = list.filter(r=>r.prio==='urgente');
  else if(S.filtro!=='todos') list = list.filter(r=>r.cat===S.filtro);
  const q = S.q.trim().toLowerCase();
  if(q) list = list.filter(r => (r.texto+' '+r.operador+' '+r.personal+' '+r.internos.map(id=>BYID[id]?.nombre||'').join(' ')).toLowerCase().includes(q));
  const total = list.length; list = list.slice(0, 80);
  let html = '', last = '';
  for(const r of list){ const d = relDay(r.fecha); if(d!==last){ html += `<div class="day">${d}</div>`; last = d; } html += regCard(r); }
  const F_ = (v,l) => `<button class="fchip ${S.filtro===v?'on':''}" onclick="S.filtro='${v}';render()">${l}</button>`;
  return `
  <div class="guard">

    <div><b>Guardia de esta semana</b><span>Entró el ${fDate(F)} · cambio de guardia ${fDate(end)} (${cuando})</span></div>
  </div>
  <div class="stats">
    <button class="stat ${urg?'alert':''}" onclick="go('reunion')"><b>${urg}</b><span>Alertas urgentes esta semana</span></button>
    <button class="stat" onclick="go('tareas')"><b>${pend}</b><span>Tareas pendientes</span></button>

  ${html || `<div class="empty" style="margin-top:14px">${REGS.length ? 'No hay registros con ese filtro.' : 'Todavía no hay nada anotado. Tocá <b>+ Nuevo registro</b> para empezar.'}</div>`}
  ${total>80?`<p class="hint" style="text-align:center">Se muestran los 80 más recientes. Usá el buscador o la ficha de cada interno para ver más.</p>`:''}`;
}

/* ============ Vista: Reunión de viernes ============ */
function reunionData(){
  const rng = weekRange(S.weekOffset), [s,e] = rng;
  const regs = REGS.filter(r=>inRange(r.fecha,rng)).sort((a,b)=>a.fecha-b.fecha);
  const urg = regs.filter(r=>r.prio==='urgente');
  const rest = regs.filter(r=>r.prio!=='urgente');
  const bajasSem = PERS.filter(i=>i.baja && !i.fantasma && inRange(i.baja,rng));
  const presentes = PERS.filter(i => !i.fantasma && (!i.ingreso || i.ingreso < e) && (i.estado==='Activo' || (i.baja && i.baja >= s))).sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
  const ids = new Set(presentes.map(p=>p.id));
  PERS.filter(p=>p.fantasma && regs.some(r=>r.internos.includes(p.id))).forEach(p=>{ if(!ids.has(p.id)) presentes.push(p); });
  const porInt = presentes.map(i=>({i, regs: rest.filter(r=>r.cat!=='equipo' && r.internos.includes(i.id)), urg: urg.filter(r=>r.internos.includes(i.id)).length}));
  const equipo = rest.filter(r=>r.cat==='equipo');
  const generales = rest.filter(r=>r.cat!=='equipo' && !r.internos.length);
  const tareas = TAR.filter(t=>t.estado!=='hecho').sort(sortTareas);
  return {s,e,regs,urg,rest,bajasSem,porInt,equipo,generales,tareas};
}

  <div class="alertbox" style="margin-top:18px">

  <div class="sec-t">🤝 Equipo / operadores <span class="n">${R.equipo.length}</span></div>

  <div class="sec-t">🏠 Novedades generales <span class="n">${R.generales.length}</span></div>

  <div class="sec-t">📋 Tareas para la guardia entrante <span class="n">${R.tareas.length}</span></div>

  <button class="btn full" onclick="nuevaTarea('Reunión ${fDate(R.e)}')">+ Anotar tarea surgida en la reunión</button>`;

const waName = (i, abrev) => abrev ? shortName(i.nombre) : i.nombre;
function buildWA(){
  const R = reunionData(), o = S.wa;
  const clip = t => t.length>220 ? t.slice(0,217).trimEnd()+'…' : t;
  const who = r => r.internos.length ? r.internos.map(id=>waName(BYID[id],o.abrev)).join(', ') : 'General';
  const okEq = r => o.equipo || r.cat!=='equipo';
  const L = [];
  L.push(`*ALAS DE LIBERTAD · Reunión de viernes*`);
  L.push(`Guardia: ${fDate(R.s)} → ${fDate(R.e)}`);
  L.push(`${R.regs.filter(r=>!r.sistema).length} registros · ${R.urg.length} alertas · ${R.bajasSem.length} egresos`);
  L.push('');
  const urg = R.urg.filter(okEq).filter(r=>!r.sistema);
  L.push(`🔴 *ALERTAS URGENTES*`);
  if(R.bajasSem.length) L.push(`• *Egresos:* ${R.bajasSem.map(i=>`${waName(i,o.abrev)} (${i.estado}, ${fDate(i.baja)})`).join('; ')}`);
  urg.forEach(r=>L.push(`• *${who(r)}* (${fDate(r.fecha)}): ${clip(r.texto)}`));
  if(!urg.length && !R.bajasSem.length) L.push('• Sin alertas urgentes.');
  L.push('');
  L.push(`👥 *NOVEDADES POR INTERNO*`);
  R.porInt.filter(x=>x.regs.length).forEach(x=>{ L.push(`*${waName(x.i,o.abrev)}*`); x.regs.forEach(r=>L.push(`  – ${fDate(r.fecha)}: ${clip(r.texto)}`)); });
  const sin = R.porInt.filter(x=>!x.regs.length && !x.urg && x.i.estado==='Activo');
  if(sin.length) L.push(`_Sin novedades: ${sin.map(x=>waName(x.i,o.abrev)).join(', ')}_`);
  L.push('');
  if(o.equipo){ L.push(`🤝 *EQUIPO / OPERADORES*`); R.equipo.forEach(r=>L.push(`• ${fDate(r.fecha)}: ${clip(r.texto)}`)); if(!R.equipo.length) L.push('• Sin incidencias.'); L.push(''); }
  L.push(`🏠 *NOVEDADES GENERALES*`);
  R.generales.forEach(r=>L.push(`• ${fDate(r.fecha)}: ${clip(r.texto)}`)); if(!R.generales.length) L.push('• Sin novedades.');
  if(o.tareas){ L.push(''); L.push(`📋 *TAREAS PARA LA GUARDIA ENTRANTE*`);
    R.tareas.forEach(t=>L.push(`☐ ${t.titulo}${t.resp?` — ${t.resp.split(' ')[0]}`:''}${t.limite?` (vence ${fDate(diaLocal(t.limite))})`:''}${t.estado==='proceso'?' [en proceso]':''}`));
    if(!R.tareas.length) L.push('• Sin tareas pendientes.'); }
  if(!o.equipo){ L.push(''); L.push('_Las incidencias de equipo se tratan solo en la reunión._'); }
  return L.join('\n');
}
function abrirWA(){
  const ck = (k,l) => `<label><input type="checkbox" ${S.wa[k]?'checked':''} onchange="S.wa['${k}']=this.checked;$('waT').value=buildWA()"> ${l}</label>`;
  openSheet(`
    <div class="sh-h"><h2>Resumen para WhatsApp</h2><button class="x" onclick="closeSheet()">✕</button></div>
    <div class="sh-b">
      <div class="wa-opts">${ck('abrev','Solo nombre e inicial del apellido (más privado)')}${ck('tareas','Incluir tareas pendientes')}${ck('equipo','Incluir incidencias de equipo / operadores')}</div>
      <textarea id="waT" class="wa-txt" readonly>${esc(buildWA())}</textarea>
      <p class="hint">Los *asteriscos* se ven en negrita en WhatsApp.</p>
    </div>
    <div class="sh-foot">${navigator.share?`<button class="btn" onclick="compartirWA()">Compartir</button>`:''}<button class="btn wa" style="flex:1" onclick="copiarWA()">Copiar resumen</button></div>`);
}
async function compartirWA(){ try { await navigator.share({text:$('waT').value}); } catch(e){ if(e.name!=='AbortError') copiarWA(); } }
async function copiarWA(){
  const t = $('waT'); let ok = false;
  try { await navigator.clipboard.writeText(t.value); ok = true; } catch(e){
    try { t.removeAttribute('readonly'); t.select(); ok = document.execCommand('copy'); t.setAttribute('readonly',''); } catch(e2){} }
  if(ok) toast('Resumen copiado. Pegalo en el grupo de WhatsApp.'); else { t.focus(); t.select(); toast('Seleccioné el texto: copialo manualmente.'); }
}

/* ============ Vista: Tareas ============ */
function sortTareas(a,b){ const o = {proceso:0,pendiente:1,hecho:2}; return o[a.estado]-o[b.estado] || (a.limite||'9999').localeCompare(b.limite||'9999'); }
function taskCard(t){
  let lim = '';
  if(t.limite){ const d = dayDiff(diaLocal(t.limite), new Date());
    const venc = t.estado!=='hecho' && d<0, hoy = t.estado!=='hecho' && d===0;
    lim = `<span class="${venc||hoy?'venc':''}">📅 ${venc?'Vencida · ':hoy?'Vence hoy · ':''}${fDate(diaLocal(t.limite))}</span>`; }
  return `<div class="task st-${t.estado}">
    <button class="stbtn" onclick="cicloTarea('${esc(t.id)}')" title="Cambiar estado">${t.estado==='hecho'?'✓ ':''}${TSTATE[t.estado]}</button>
    <button class="tk-b" onclick="editarTarea('${esc(t.id)}')"><b>${esc(t.titulo)}</b>
      <span class="tk-m"><span>👤 ${esc(t.resp||'Sin asignar')}</span>${lim}${t.origen?`<span class="orig">${esc(t.origen)}</span>`:''}</span></button>
  </div>`;
}
function vTareas(){
  let list = [...TAR].sort(sortTareas);
  if(S.tFiltro==='abiertas') list = list.filter(t=>t.estado!=='hecho');
  if(S.tFiltro==='mias') list = list.filter(t=>t.resp===miNombre() && t.estado!=='hecho');
  if(S.tFiltro==='hechas') list = list.filter(t=>t.estado==='hecho');
  const F_ = (v,l) => `<button class="fchip ${S.tFiltro===v?'on':''}" onclick="S.tFiltro='${v}';render()">${l}</button>`;
  return `
  <div class="toprow"><h1>Tareas y pendientes</h1><button class="btn sm dark" onclick="nuevaTarea()">+ Tarea</button></div>
  <p class="hint" style="margin:-6px 2px 0">Tocá el estado para avanzarlo: Pendiente → En proceso → Hecho.</p>
  <div class="filters">${F_('abiertas','Abiertas')}${F_('mias','Mías')}${F_('hechas','Hechas')}${F_('todas','Todas')}</div>
  <div style="margin-top:12px">${list.map(taskCard).join('') || '<div class="empty">No hay tareas en esta lista.</div>'}</div>`;
}
const tareaFila = t => ({id:t.id, titulo:t.titulo, estado:t.estado, responsable:t.resp, limite:t.limite, origen:t.origen, creada:t.creada, creadapor:t.creadapor});
async function cicloTarea(id){
  const t = TAR.find(x=>x.id===id); if(!t) return; const antes = t.estado;
  t.estado = {pendiente:'proceso',proceso:'hecho',hecho:'pendiente'}[t.estado]; render();
  try { await guardarFila(HOJA_TAR, {id:t.id, estado:t.estado}, `Tarea «${t.titulo.slice(0,60)}» → ${TSTATE[t.estado]}`, true);
    const r = RAW.tar.find(x=>String(x.id)===id); if(r) r.estado = t.estado; toast(`${TSTATE[t.estado]}: ${t.titulo.slice(0,40)}`); }
  catch(e){ t.estado = antes; render(); estado(errorGuardar(e), true); }
}
function nuevaTarea(origen=''){ S.task = {id:null, titulo:'', estado:'pendiente', resp:'', limite:'', origen}; formTarea(); }
function editarTarea(id){ S.task = {...TAR.find(x=>x.id===id)}; formTarea(); }
function formTarea(){
  const t = S.task;
  openSheet(`
    <div class="sh-h"><h2>${t.id?'Editar tarea':'Nueva tarea'}</h2><button class="x" onclick="closeSheet()">✕</button></div>
    <div class="sh-b">
      ${t.origen?`<p style="margin:0 2px 8px"><span class="orig">${esc(t.origen)}</span></p>`:''}
      <label class="lbl">¿Qué hay que hacer?</label>
      <textarea id="tTit" style="min-height:80px" placeholder="Ej: Llamar al médico por el control de…">${esc(t.titulo)}</textarea>
      <label class="lbl">Responsable <small>(opcional)</small></label>
      <input id="tResp" class="inp" list="dlPersonas" value="${esc(t.resp)}" placeholder="Sin asignar">
      <label class="lbl">Fecha límite <small>(opcional)</small></label>
      <input id="tLim" class="inp" type="date" value="${esc(t.limite)}">
      <label class="lbl">Estado</label>
      <div class="seg3" id="tEst">${Object.entries(TSTATE).map(([v,l])=>`<button type="button" data-v="${v}" class="${t.estado===v?'on':''}" onclick="S.task.estado='${v}';document.querySelectorAll('#tEst button').forEach(b=>b.classList.toggle('on',b.dataset.v==='${v}'))">${l}</button>`).join('')}</div>
      <p class="err" id="tErr"></p>
      <div id="tDel"></div>
    </div>
    <div class="sh-foot">${t.id && isAdmin()?`<button class="btn ghost-d" onclick="confirmarBorrarTarea()">Eliminar</button>`:''}<button class="btn primary" id="tSave" onclick="guardarTarea()">Guardar tarea</button></div>`);
  if(!t.id) setTimeout(()=>$('tTit')?.focus(), 250);
}
async function guardarTarea(){
  const t = S.task, err = $('tErr'); t.titulo = $('tTit').value.trim(); t.resp = $('tResp').value.trim(); t.limite = $('tLim').value;
  if(!t.titulo){ err.textContent = 'Escribí qué hay que hacer.'; err.style.display='block'; return; }
  const nueva = !t.id; if(nueva){ t.id = nid('t'); t.creada = aHoja(new Date()); t.creadapor = miNombre(); }
  const b = $('tSave'); b.disabled = true; b.textContent = 'Guardando…';
  try { await guardarFila(HOJA_TAR, tareaFila(t), (nueva?'Nueva tarea: ':'Editó tarea: ')+t.titulo.slice(0,80), !nueva);
    const r = tareaFila(t); const i = RAW.tar.findIndex(x=>String(x.id)===t.id); if(i>=0) RAW.tar[i] = Object.assign(RAW.tar[i], r); else RAW.tar.push(r);
    closeSheet(); armar(); toast('Tarea guardada'); }
  catch(e){ if(nueva) t.id = null; err.textContent = errorGuardar(e); err.style.display='block'; b.disabled = false; b.textContent = 'Guardar tarea'; }
}
function confirmarBorrarTarea(){ $('tDel').innerHTML = `<div class="archived" style="background:var(--urg-bg);border-color:#F0B9B2">¿Eliminar esta tarea? <div style="display:flex;gap:8px;margin-top:8px"><button class="btn sm" onclick="$('tDel').innerHTML=''">No</button><button class="btn sm danger" onclick="borrarTarea()">Sí, eliminar</button></div></div>`; }
async function borrarTarea(){ const t = S.task;
  try { await borrarFila(HOJA_TAR, t.id, 'Borró tarea: '+t.titulo.slice(0,80)); RAW.tar = RAW.tar.filter(x=>String(x.id)!==t.id); closeSheet(); armar(); toast('Tarea eliminada'); }
  catch(e){ $('tErr').textContent = errorGuardar(e); $('tErr').style.display='block'; } }

function filtrarChips(q){ q = q.trim().toLowerCase(); document.querySelectorAll('#fInt .chip[data-n]').forEach(b => b.hidden = q && !b.dataset.n.includes(q) && !b.classList.contains('on')); }
function selCat(k){ S.form.cat = k; document.querySelectorAll('#fCat .cbtn').forEach(b=>b.classList.toggle('on', b.dataset.v===k)); }
function togInt(id){
  const f = S.form;
  if(id==='gen') f.internos = []; else f.internos = f.internos.includes(id) ? f.internos.filter(x=>x!==id) : [...f.internos, id];
  document.querySelectorAll('#fInt .chip').forEach(b=>b.classList.toggle('on', b.dataset.v==='gen' ? !f.internos.length : f.internos.includes(b.dataset.v)));
}
function selPrio(k){ S.form.prio = k; document.querySelectorAll('#fPrio button').forEach(b=>b.classList.toggle('on', b.dataset.v===k));
  $('prioHint').textContent = k==='urgente'?'Va a aparecer arriba de todo en la Reunión de viernes.':'Urgente / Delicado: riesgo de abandono, amenaza de denuncia, conflicto grave.'; }
async function guardarRegistro(){
  const f = S.form, err = $('fErr');
  f.texto = $('fTxt').value.trim(); f.personal = $('fPers').value.trim();
  const fe = $('fFecha').value; if(fe) f.fecha = new Date(fe);
  if(!f.cat){ err.textContent = 'Elegí una categoría.'; err.style.display='block'; return; }
  if(!f.texto){ err.textContent = 'Escribí una descripción breve.'; err.style.display='block'; $('fTxt').focus(); return; }
  const nuevo = !f.id;
  const ps = f.internos.map(id=>BYID[id]).filter(Boolean);
  const rec = { id: f.id || nid('b'), fecha: aHoja(f.fecha), categoria:f.cat, prioridad:f.prio,
    internos: ps.map(p=>p.id).join(','), nombres: ps.map(p=>p.nombre).join(' | '), cedulas: ps.map(p=>p.cedula).join(','),
    personal:f.personal, texto:f.texto };
  if(nuevo){ rec.operador = miNombre(); rec.email = email; } else rec.editado = aHoja(new Date()) + ' por ' + miNombre();
  const b = $('fSave'); b.disabled = true; b.textContent = 'Guardando…';
  try {
    await guardarFila(HOJA_BIT, rec, (nuevo?'Bitácora: ':'Editó bitácora: ') + CATS[f.cat].short + (ps.length?' · '+ps.map(p=>p.nombre).join(', '):''), !nuevo);
    const i = RAW.reg.findIndex(x=>String(x.id)===rec.id); if(i>=0) RAW.reg[i] = Object.assign({}, RAW.reg[i], rec); else RAW.reg.push(rec);

}

/* ============ Sheet / toast ============ */
function openSheet(html){ $('sheet').innerHTML = html; $('sheetWrap').hidden = false; document.body.style.overflow='hidden'; }
function closeSheet(){ $('sheetWrap').hidden = true; document.body.style.overflow=''; }
document.addEventListener('keydown', e => { if(e.key==='Escape') closeSheet(); });
function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(window._tt); window._tt = setTimeout(()=>el.classList.remove('show'), 2800); }

/* ============ Ingreso (igual que Internos y Cuartos) ============ */
function modoSetup(on, codigo){ $('setup').hidden = !on; $('pwrow').hidden = on; $('coderow').hidden = !(on && codigo); if(!on) $('ncode').value = '';
  $('ltxt').textContent = on ? (codigo ? 'Escribí el código que te pasaron y elegí tu contraseña nueva.' : 'Es tu primera vez: elegí una contraseña para tu usuario.') : 'Ingresá con el mismo correo y contraseña de la app de Internos.';
  $('lbtn').textContent = on ? 'Crear contraseña e ingresar' : 'Ingresar'; }
$('lf').addEventListener('submit', async e => {
  e.preventDefault(); email = $('em').value.trim().toLowerCase(); $('lmsg').textContent = '';
  const setup = !$('setup').hidden; $('lbtn').disabled = true;
  try {
    if(setup){ const a = $('np1').value, b = $('np2').value;
      if(!$('coderow').hidden && !/^\d{6}$/.test($('ncode').value.trim())){ $('lmsg').textContent = 'Escribí el código de 6 números que te pasaron.'; return; }
      if(a.length < 6){ $('lmsg').textContent = 'La contraseña tiene que tener al menos 6 caracteres.'; return; }
      if(a !== b){ $('lmsg').textContent = 'Las dos contraseñas no coinciden.'; return; }
      pass = ''; token = ''; const r = await api({action:'setPassword', newPassword:a, code:$('ncode').value.trim()});
      if(!r || r.ok!==true){ $('lmsg').textContent = (r && r.error) || 'No se pudo guardar la contraseña.'; return; }
      if(r.token){ token = r.token; pass = ''; } else pass = a; modoSetup(false);
    } else { token = ''; pass = $('pw').value; }
    const res = await api({action:'checkUser'});
    if(res && res.token){ token = res.token; pass = ''; }
    if(res && res.needsSetup){ modoSetup(true, res.needsCode); return; }
    if(!res || !res.allowed){ $('lmsg').textContent = (res && res.error) || 'Ese correo no está autorizado.'; return; }
    role = String(res.role||'');
    try { localStorage.setItem('internos-email', email); } catch(x){} guardarSesion();
    $('pw').value = ''; mostrar(true); render(); await cargar();
  } catch(err){ $('lmsg').textContent = 'No se pudo conectar con la hoja (' + err.message + '). Probá de nuevo.'; }
  finally { $('lbtn').disabled = false; if($('setup').hidden) $('lbtn').textContent = 'Ingresar'; }
});
try { $('em').value = localStorage.getItem('internos-email') || ''; localStorage.removeItem('internos-pw'); if(localStorage.getItem('alas-token')) $('rec').checked = true; const su = localStorage.getItem('internos-api'); if(su) API = su; } catch(e){}
(async()=>{
  const fin = () => $('splash').hidden = true;
  const ses = sesionGuardada();
  if(!ses || !ses.email || !ses.token){ mostrar(false); fin(); return; }
  email = ses.email; token = ses.token || ''; pass = '';
  const cache = leerCache(email);
  if(cache){ soloCopia = true; role = String(cache.role||''); mostrar(true); try { armar(...cache.d); } catch(x){} fin();
    try { await cargar(); guardarSesion(); }
    catch(e){ soloCopia = true; render(); if(token){ const h = new Date(cache.t); estado('Google no contesta: se ve lo guardado a las '+fTime(h)+'. Tocá tu nombre → Actualizar.', true); } }
    return; }
  try { mostrar(true); render(); await cargar();
    if(!role){ const res = await api({action:'checkUser'});
      if(!res || !res.allowed){ const t = res && res.error; borrarSesion(); token=''; email=''; mostrar(false); if(t) $('lmsg').textContent = t; return; }
      role = String(res.role||''); render(); }
    guardarSesion();
  } catch(e){ if(token) estado('No se pudo cargar: '+e.message+'. Tocá tu nombre → Actualizar.', true); }
  finally { fin(); }
})();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));

</script>
